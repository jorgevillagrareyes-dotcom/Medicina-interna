<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="480.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Dispositivos de oxigenoterapia y FiO₂ aproximada</text>
<line x1="330.0" y1="56" x2="330.0" y2="440" stroke="#e4e7eb"/>
<text x="330.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">20 %</text>
<line x1="405.0" y1="56" x2="405.0" y2="440" stroke="#e4e7eb"/>
<text x="405.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">30 %</text>
<line x1="480.0" y1="56" x2="480.0" y2="440" stroke="#e4e7eb"/>
<text x="480.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">40 %</text>
<line x1="555.0" y1="56" x2="555.0" y2="440" stroke="#e4e7eb"/>
<text x="555.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">50 %</text>
<line x1="630.0" y1="56" x2="630.0" y2="440" stroke="#e4e7eb"/>
<text x="630.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">60 %</text>
<line x1="705.0" y1="56" x2="705.0" y2="440" stroke="#e4e7eb"/>
<text x="705.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">70 %</text>
<line x1="780.0" y1="56" x2="780.0" y2="440" stroke="#e4e7eb"/>
<text x="780.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">80 %</text>
<line x1="855.0" y1="56" x2="855.0" y2="440" stroke="#e4e7eb"/>
<text x="855.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">90 %</text>
<line x1="930.0" y1="56" x2="930.0" y2="440" stroke="#e4e7eb"/>
<text x="930.0" y="460" text-anchor="middle" font-size="12.5" fill="#52606d">100 %</text>
<line x1="330" y1="440" x2="930" y2="440" stroke="#1f2933" stroke-width="1.5"/>
<text x="630.0" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">FiO₂ entregada (aproximada)</text>
<text x="14" y="82" font-size="14.5" font-weight="700" fill="#0f766e">Naricera (cánula nasal)</text>
<text x="14" y="99" font-size="12" fill="#52606d">1–6 L/min · ~ +3–4 % por litro</text>
<rect x="360.0" y="70" width="150.0" height="22" rx="6" fill="#0f766e" opacity="0.85"/>
<text x="435.0" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">24–44 %</text>
<text x="330" y="110" font-size="11.5" font-style="italic" fill="#52606d">Bajo flujo: la FiO₂ real varía con el patrón respiratorio</text>
<text x="14" y="144" font-size="14.5" font-weight="700" fill="#0f766e">Mascarilla simple</text>
<text x="14" y="161" font-size="12" fill="#52606d">5–10 L/min (mínimo 5 L)</text>
<rect x="442.5" y="132" width="150.0" height="22" rx="6" fill="#0f766e" opacity="0.85"/>
<text x="517.5" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">35–55 %</text>
<text x="14" y="206" font-size="14.5" font-weight="700" fill="#12474f">Mascarilla Venturi</text>
<text x="14" y="223" font-size="12" fill="#52606d">FiO₂ fija según la válvula</text>
<rect x="360.0" y="194" width="270.0" height="22" rx="6" fill="#12474f" opacity="0.85"/>
<text x="495.0" y="210" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">24–60 %</text>
<text x="330" y="234" font-size="11.5" font-style="italic" fill="#52606d">De elección en la hipercapnia: FiO₂ precisa (24–28 %)</text>
<text x="14" y="268" font-size="14.5" font-weight="700" fill="#b45309">Mascarilla con reservorio</text>
<text x="14" y="285" font-size="12" fill="#52606d">10–15 L/min, bolsa inflada</text>
<rect x="630.0" y="256" width="225.0" height="22" rx="6" fill="#b45309" opacity="0.85"/>
<text x="742.5" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">60–90 %</text>
<text x="330" y="296" font-size="11.5" font-style="italic" fill="#52606d">Para la hipoxemia grave, como puente</text>
<text x="14" y="330" font-size="14.5" font-weight="700" fill="#6d28d9">Cánula nasal de alto flujo</text>
<text x="14" y="347" font-size="12" fill="#52606d">30–60 L/min, calentado y humidificado</text>
<rect x="337.5" y="318" width="592.5" height="22" rx="6" fill="#6d28d9" opacity="0.85"/>
<text x="633.8" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">21–100 %</text>
<text x="330" y="358" font-size="11.5" font-style="italic" fill="#52606d">FiO₂ regulable, algo de PEEP, lava el espacio muerto</text>
<text x="14" y="392" font-size="14.5" font-weight="700" fill="#b3261e">VMNI (BiPAP o CPAP)</text>
<text x="14" y="409" font-size="12" fill="#52606d">presión positiva con mascarilla</text>
<rect x="337.5" y="380" width="592.5" height="22" rx="6" fill="#b3261e" opacity="0.85"/>
<text x="633.8" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">21–100 %</text>
<text x="330" y="420" font-size="11.5" font-style="italic" fill="#52606d">Hipercapnia (EPOC), edema pulmonar cardiogénico</text>
<text x="14" y="510" font-size="11.5" fill="#52606d">Esquema propio con rangos aproximados. Meta de SpO₂: 92–96 % en la mayoría; 88–92 % si hay riesgo de hipercapnia (EPOC, obesidad, neuromuscular).</text>
</svg>