<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="980" height="630" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<text x="490.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Dispepsia en Chile: ¿quién necesita una endoscopía?</text>
<rect x="250" y="44" width="480" height="64" rx="8" fill="#eef2f6" stroke="#52606d" stroke-width="1.6"/>
<text x="490.0" y="63.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">Dispepsia: dolor o ardor epigástrico, plenitud posprandial</text>
<text x="490.0" y="80.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">o saciedad precoz. Revisar AINE y aspirina; si predomina</text>
<text x="490.0" y="97.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">la pirosis, pensar en reflujo (ERGE)</text>
<line x1="490" y1="108" x2="490" y2="128" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="215" y="128" width="550" height="76" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="490.0" y="153.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">¿≥ 40 años con epigastralgia de más de 15 días (guía GES)</text>
<text x="490.0" y="170.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">o algún SIGNO DE ALARMA? Baja de peso, anemia, hemorragia digestiva,</text>
<text x="490.0" y="187.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">disfagia, vómitos persistentes, masa, cáncer gástrico en la familia</text>
<line x1="330" y1="204" x2="200" y2="244" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="248" y="222" font-size="13" font-weight="700" fill="#52606d">Sí</text>
<line x1="650" y1="204" x2="780" y2="244" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="690" y="222" font-size="13" font-weight="700" fill="#52606d">No (&lt; 40 años, sin alarma)</text>
<rect x="20" y="246" width="400" height="92" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.6"/>
<text x="220.0" y="271.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">ENDOSCOPÍA DIGESTIVA ALTA con biopsias</text>
<text x="220.0" y="288.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Biopsias para H. pylori (test de ureasa o histología)</text>
<text x="220.0" y="304.8" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">y de mucosa (Sydney) para atrofia y metaplasia</text>
<text x="220.0" y="321.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Sospecha de cáncer gástrico: especialista en ≤ 30 días (GES 27)</text>
<line x1="220" y1="338" x2="220" y2="360" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="360" width="400" height="132" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/>
<text x="220.0" y="381.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Según el hallazgo</text>
<text x="220.0" y="397.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Úlcera: IBP 4–8 semanas + erradicar H. pylori</text>
<text x="220.0" y="414.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">+ suspender AINE; biopsiar la úlcera gástrica</text>
<text x="220.0" y="430.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">y controlarla por endoscopía</text>
<text x="220.0" y="447.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Cáncer: etapificar y derivar (GES)</text>
<text x="220.0" y="463.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Atrofia o metaplasia extensa: vigilancia endoscópica</text>
<text x="220.0" y="480.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Normal: dispepsia funcional</text>
<rect x="560" y="246" width="400" height="92" rx="8" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.6"/>
<text x="760.0" y="280.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">"TEST AND TREAT" de H. pylori</text>
<text x="760.0" y="296.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Test de aire espirado con urea o antígeno en deposiciones</text>
<text x="760.0" y="313.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">(sin IBP por 2 semanas ni antibióticos por 4 semanas)</text>
<line x1="700" y1="338" x2="640" y2="372" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="620" y="356" font-size="13" font-weight="700" fill="#52606d">Positivo</text>
<line x1="820" y1="338" x2="880" y2="372" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="858" y="356" font-size="13" font-weight="700" fill="#52606d">Negativo</text>
<rect x="520" y="374" width="230" height="118" rx="8" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="635.0" y="404.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Erradicar</text>
<text x="635.0" y="421.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Cuádruple con bismuto</text>
<text x="635.0" y="437.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">14 días</text>
<text x="635.0" y="454.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Confirmar la erradicación</text>
<text x="635.0" y="470.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">≥ 4 semanas después</text>
<rect x="770" y="374" width="190" height="118" rx="8" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="865.0" y="404.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">IBP 4–8 semanas</text>
<text x="865.0" y="421.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">(omeprazol 20 mg/día)</text>
<text x="865.0" y="437.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Si persiste:</text>
<text x="865.0" y="454.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">endoscopía y manejo</text>
<text x="865.0" y="470.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">de dispepsia funcional</text>
<line x1="635" y1="492" x2="635" y2="520" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="520" y="520" width="440" height="72" rx="8" fill="#eef2f6" stroke="#52606d" stroke-width="1.6"/>
<text x="740.0" y="544.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Si los síntomas persisten tras erradicar: IBP;</text>
<text x="740.0" y="560.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">luego endoscopía (si no se hizo) y tratamiento de la dispepsia</text>
<text x="740.0" y="577.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">funcional (neuromoduladores, como amitriptilina en dosis bajas)</text>
<rect x="20" y="520" width="400" height="72" rx="8" fill="#fff7e6" stroke="#e0a526" stroke-width="1.6"/>
<text x="220.0" y="544.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">En Chile la triple con claritromicina erradicó solo el 81 %</text>
<text x="220.0" y="560.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">vs 95 % con cuádruple optimizada con bismuto</text>
<text x="220.0" y="577.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">(Medel-Jara 2025)</text>
<text x="960" y="614" text-anchor="end" font-size="11.5" fill="#7b8794">Esquema propio basado en la guía clínica GES de cáncer gástrico (MINSAL), ACG/CAG 2017 (dispepsia) y ACG 2024 (H. pylori).</text>
</svg>