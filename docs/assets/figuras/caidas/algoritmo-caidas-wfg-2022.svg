<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="980" height="720" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<text x="490.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Estratificación del riesgo de caídas en la comunidad (World Falls Guidelines 2022)</text>
<rect x="30" y="50" width="300" height="72" rx="8" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.6"/>
<text x="180.0" y="74.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Búsqueda oportunista</text>
<text x="180.0" y="90.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">Control anual, EMPAM, ficha</text>
<text x="180.0" y="107.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">(30 % caerá en el año siguiente)</text>
<rect x="650" y="50" width="300" height="72" rx="8" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.6"/>
<text x="800.0" y="74.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Consulta por una caída</text>
<text x="800.0" y="90.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">o por una lesión por caída</text>
<text x="800.0" y="107.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">(70 % caerá en el año siguiente)</text>
<rect x="340" y="140" width="300" height="62" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="490.0" y="167.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">¿Se cayó en los últimos 12 meses?</text>
<text x="490.0" y="184.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">o alguna de las 3 preguntas clave*</text>
<line x1="180" y1="122" x2="340" y2="160" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="800" y1="122" x2="800" y2="225" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="640" y1="171" x2="700" y2="225" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="668" y="190" font-size="13" font-weight="700" fill="#52606d">Sí</text>
<rect x="650" y="228" width="300" height="146" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.6"/>
<text x="800.0" y="264.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">¿Caída grave? (basta una):</text>
<text x="800.0" y="281.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Lesión</text>
<text x="800.0" y="297.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• ≥ 2 caídas en el último año</text>
<text x="800.0" y="314.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Fragilidad</text>
<text x="800.0" y="330.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• No pudo levantarse del suelo</text>
<text x="800.0" y="347.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Pérdida de conciencia o síncope</text>
<rect x="340" y="262" width="280" height="72" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="480.0" y="286.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">¿Alteración de marcha o equilibrio?</text>
<text x="480.0" y="302.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">Velocidad de marcha ≤ 0,8 m/s</text>
<text x="480.0" y="319.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">o Timed Up and Go > 15 s</text>
<line x1="650" y1="300" x2="622" y2="300" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="626" y="290" font-size="13" font-weight="700" fill="#52606d">No</text>
<line x1="400" y1="202" x2="250" y2="420" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="300" y="300" font-size="13" font-weight="700" fill="#52606d">No</text>
<rect x="30" y="424" width="290" height="70" rx="8" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="175.0" y="455.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">RIESGO BAJO</text>
<text x="175.0" y="473.2" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2933">Prevención primaria</text>
<rect x="345" y="424" width="290" height="70" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="490.0" y="455.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">RIESGO INTERMEDIO</text>
<text x="490.0" y="473.2" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2933">Mejorar el factor principal</text>
<rect x="660" y="424" width="290" height="70" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.6"/>
<text x="805.0" y="455.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">RIESGO ALTO</text>
<text x="805.0" y="473.2" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2933">Prevención secundaria y tratamiento</text>
<line x1="420" y1="334" x2="200" y2="424" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="280" y="372" font-size="13" font-weight="700" fill="#52606d">No</text>
<line x1="490" y1="334" x2="490" y2="424" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="497" y="385" font-size="13" font-weight="700" fill="#52606d">Sí</text>
<line x1="800" y1="374" x2="800" y2="424" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="807" y="404" font-size="13" font-weight="700" fill="#52606d">Sí</text>
<rect x="30" y="512" width="290" height="92" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="175.0" y="546.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Educación en prevención</text>
<text x="175.0" y="562.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Actividad física y ejercicio</text>
<text x="175.0" y="579.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Reevaluar en 1 año</text>
<rect x="345" y="512" width="290" height="92" rx="8" fill="#ffffff" stroke="#c28a12" stroke-width="1.6"/>
<text x="490.0" y="546.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Ejercicio de equilibrio, marcha</text>
<text x="490.0" y="562.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">y fuerza (kinesiología)</text>
<text x="490.0" y="579.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Educación • Reevaluar en 1 año</text>
<rect x="660" y="512" width="290" height="92" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/>
<text x="805.0" y="546.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Evaluación multifactorial</text>
<text x="805.0" y="562.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Intervenciones individualizadas</text>
<text x="805.0" y="579.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">• Control en 30–90 días</text>
<line x1="175" y1="494" x2="175" y2="512" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="490" y1="494" x2="490" y2="512" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="805" y1="494" x2="805" y2="512" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="30" y="636" font-size="13" fill="#3e4c59">* Tres preguntas clave: ¿se ha caído en el último año?, ¿se siente inestable al estar de pie o caminar?, ¿le preocupa caerse?</text>
<text x="30" y="656" font-size="13" fill="#3e4c59">En hospitales y residencias (ELEAM), todo adulto mayor se considera de riesgo alto. La sospecha de síncope obliga a estudiarlo.</text>
<text x="950" y="708" text-anchor="end" font-size="11.5" fill="#7b8794">Adaptado y traducido de Montero-Odasso M, et al. Age Ageing. 2022;51:afac205 (figura 1). Licencia CC BY-NC 4.0.</text>
</svg>