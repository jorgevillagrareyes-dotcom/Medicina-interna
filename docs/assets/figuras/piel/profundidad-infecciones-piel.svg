<text x="48" y="86" font-size="11.5" font-weight="700" fill="#4a3b33">Epidermis</text>
<text x="48" y="112" font-size="11.5" font-weight="700" fill="#4a3b33">Dermis</text>
<text x="48" y="202" font-size="11.5" font-weight="700" fill="#4a3b33">Tejido subcutáneo (grasa)</text>
<text x="48" y="318.0" font-size="11.5" font-weight="700" fill="#4a3b33">Fascia</text>
<text x="48" y="338" font-size="11.5" font-weight="700" fill="#ffffff">Músculo</text>
<path d="M482 71 L490 71 L490 95 L482 95" fill="none" stroke="#12474f" stroke-width="2"/>
<line x1="490" y1="83.0" x2="615" y2="76" stroke="#12474f" stroke-width="1" stroke-dasharray="2 2"/>
<text x="620" y="80" font-size="14" font-weight="700" fill="#12474f">Impétigo</text>
<text x="620" y="96" font-size="12" fill="#52606d">epidermis superficial; costras mielicéricas</text>
<path d="M502 71 L510 71 L510 139 L502 139" fill="none" stroke="#12474f" stroke-width="2"/>
<line x1="510" y1="105.0" x2="615" y2="116" stroke="#12474f" stroke-width="1" stroke-dasharray="2 2"/>
<text x="620" y="120" font-size="14" font-weight="700" fill="#12474f">Erisipela</text>
<text x="620" y="136" font-size="12" fill="#52606d">dermis superficial y linfáticos: borde neto y solevantado</text>
<path d="M522 97 L530 97 L530 305 L522 305" fill="none" stroke="#12474f" stroke-width="2"/>
<line x1="530" y1="201.0" x2="615" y2="181" stroke="#12474f" stroke-width="1" stroke-dasharray="2 2"/>
<text x="620" y="185" font-size="14" font-weight="700" fill="#12474f">Celulitis</text>
<text x="620" y="201" font-size="12" fill="#52606d">dermis profunda y subcutáneo: borde difuso</text>
<path d="M542 151 L550 151 L550 249 L542 249" fill="none" stroke="#12474f" stroke-width="2"/>
<line x1="550" y1="200.0" x2="615" y2="241" stroke="#12474f" stroke-width="1" stroke-dasharray="2 2"/>
<text x="620" y="245" font-size="14" font-weight="700" fill="#12474f">Foliculitis → forúnculo → absceso</text>
<text x="620" y="261" font-size="12" fill="#52606d">infección del folículo o colección de pus</text>
<path d="M562 251 L570 251 L570 321 L562 321" fill="none" stroke="#12474f" stroke-width="2"/>
<line x1="570" y1="286.0" x2="615" y2="301" stroke="#12474f" stroke-width="1" stroke-dasharray="2 2"/>
<text x="620" y="305" font-size="14" font-weight="700" fill="#12474f">Fascitis necrotizante</text>
<text x="620" y="321" font-size="12" fill="#52606d">se disemina por la fascia: dolor desproporcionado</text>
<path d="M582 323 L590 323 L590 449 L582 449" fill="none" stroke="#12474f" stroke-width="2"/>
<line x1="590" y1="386.0" x2="615" y2="391" stroke="#12474f" stroke-width="1" stroke-dasharray="2 2"/>
<text x="620" y="395" font-size="14" font-weight="700" fill="#12474f">Miositis / mionecrosis</text>
<text x="620" y="411" font-size="12" fill="#52606d">gangrena gaseosa (Clostridium), piomiositis</text>
<path d="M40 480 q 15 -12 30 0" fill="none" stroke="#b5474f" stroke-width="1.6"/>
<text x="78" y="484" font-size="12" fill="#52606d">vaso sanguíneo</text>
<path d="M190 480 q 15 -10 30 0" fill="none" stroke="#6a8fb0" stroke-width="1.3" stroke-dasharray="3 2"/>
<text x="228" y="484" font-size="12" fill="#52606d">linfático</text>
<text x="14" y="530" font-size="11.5" fill="#52606d">Esquema propio, no a escala. Cuanto más profunda la infección, más grave: la fascitis y la mionecrosis son urgencias quirúrgicas.</text>
