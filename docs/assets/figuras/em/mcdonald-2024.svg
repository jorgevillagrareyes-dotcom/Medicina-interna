<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="584" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Criterios de McDonald 2024: lesiones en el espacio y en el tiempo</text>
<text x="500.0" y="48" text-anchor="middle" font-size="12.5" font-weight="400" fill="#495057">Siempre que no haya una explicación mejor (descartar NMOSD, MOGAD, vasculitis, infecciones y lesiones vasculares)</text>
<ellipse cx="230" cy="185" rx="160" ry="110" fill="#f1f3f5" stroke="#868e96" stroke-width="1.8"/>
<path d="M150,170 C170,130 280,125 310,165 C300,185 280,178 262,172 C230,165 190,168 170,190 C160,200 148,190 150,170 Z" fill="#d0ebff" stroke="#74c0fc" stroke-width="1.4"/>
<ellipse cx="185" cy="150" rx="5" ry="12" fill="#e8590c" transform="rotate(30 185 150)"/>
<ellipse cx="220" cy="140" rx="5" ry="12" fill="#e8590c" transform="rotate(10 220 140)"/>
<ellipse cx="260" cy="142" rx="5" ry="12" fill="#e8590c" transform="rotate(-10 260 142)"/>
<ellipse cx="290" cy="155" rx="5" ry="12" fill="#e8590c" transform="rotate(-30 290 155)"/>
<ellipse cx="128" cy="105" rx="7" ry="5" fill="#e8590c"/>
<ellipse cx="340" cy="120" rx="6" ry="5" fill="#e8590c"/>
<path d="M262,262 L262,320 L290,320 L292,268 Z" fill="#e9ecef" stroke="#868e96" stroke-width="1.6"/>
<ellipse cx="335" cy="270" rx="48" ry="30" fill="#e9ecef" stroke="#868e96" stroke-width="1.6"/>
<ellipse cx="276" cy="290" rx="5" ry="6" fill="#e8590c"/>
<ellipse cx="345" cy="265" rx="6" ry="5" fill="#e8590c"/>
<rect x="264" y="318" width="24" height="108" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="1.6"/>
<ellipse cx="276" cy="372" rx="6" ry="13" fill="#e8590c"/>
<circle cx="70" cy="230" r="26" fill="#ffffff" stroke="#868e96" stroke-width="1.6"/>
<circle cx="52" cy="230" r="8" fill="#4a6fa5"/>
<line x1="95" y1="232" x2="170" y2="215" stroke="#868e96" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="128" cy="224" rx="9" ry="4" fill="#e8590c" transform="rotate(-12 128 224)"/>
<circle cx="196" cy="116" r="11" fill="#1f5f99"/>
<text x="196" y="120.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<circle cx="110" cy="128" r="11" fill="#1f5f99"/>
<text x="110" y="132.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<circle cx="318" cy="305" r="11" fill="#1f5f99"/>
<text x="318" y="309.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<circle cx="302" cy="370" r="11" fill="#1f5f99"/>
<text x="302" y="374.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<circle cx="128" cy="252" r="11" fill="#1f5f99"/>
<text x="128" y="256.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
<circle cx="48" cy="452" r="11" fill="#1f5f99"/>
<text x="48" y="456.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="66" y="456" text-anchor="start" font-size="12.8" font-weight="400" fill="#1f2933">Periventricular</text>
<circle cx="48" cy="473" r="11" fill="#1f5f99"/>
<text x="48" y="477.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="66" y="477" text-anchor="start" font-size="12.8" font-weight="400" fill="#1f2933">Cortical o yuxtacortical</text>
<circle cx="48" cy="494" r="11" fill="#1f5f99"/>
<text x="48" y="498.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="66" y="498" text-anchor="start" font-size="12.8" font-weight="400" fill="#1f2933">Infratentorial (tronco, cerebelo)</text>
<circle cx="48" cy="515" r="11" fill="#1f5f99"/>
<text x="48" y="519.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="66" y="519" text-anchor="start" font-size="12.8" font-weight="400" fill="#1f2933">Médula espinal</text>
<circle cx="48" cy="536" r="11" fill="#1f5f99"/>
<text x="48" y="540.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
<text x="66" y="540" text-anchor="start" font-size="12.8" font-weight="400" fill="#1f2933">Nervio óptico (RM, PEV u OCT; nuevo en 2024)</text>
<text x="40" y="568" text-anchor="start" font-size="12.3" font-weight="400" fill="#495057">Lesiones típicas: ovoides, ≥ 3 mm, perpendiculares a los ventrículos (dedos de Dawson)</text>
<rect x="470" y="70" width="510" height="54" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="725.0" y="93.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Síntoma o RM compatible con desmielinización</text>
<text x="725.0" y="110.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">¿En cuántas de las 5 regiones hay lesiones típicas?</text>
<line x1="560" y1="124" x2="560" y2="160" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="725" y1="124" x2="725" y2="160" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="890" y1="124" x2="890" y2="160" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="470" y="160" width="170" height="50" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.6"/>
<text x="555.0" y="189.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">≥ 4 regiones</text>
<rect x="645" y="160" width="160" height="50" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="725.0" y="189.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">2–3 regiones</text>
<rect x="810" y="160" width="170" height="50" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.6"/>
<text x="895.0" y="189.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">1 región</text>
<line x1="555" y1="210" x2="555" y2="395" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="725" y1="210" x2="725" y2="236" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="645" y="236" width="160" height="150" rx="8" fill="#fffdf0" stroke="#e8a10c" stroke-width="1.6"/>
<text x="725.0" y="264.5" text-anchor="middle" font-size="12.4" font-weight="700" fill="#1f2933">Más al menos uno:</text>
<text x="725.0" y="281.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Diseminación en el</text>
<text x="725.0" y="298.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">tiempo en la RM</text>
<text x="725.0" y="315.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Bandas oligoclonales o</text>
<text x="725.0" y="332.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">índice kappa en LCR</text>
<text x="725.0" y="349.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Vena central o anillo</text>
<text x="725.0" y="366.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">paramagnético (si hay)</text>
<line x1="725" y1="386" x2="620" y2="400" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="895" y1="210" x2="895" y2="236" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="810" y="236" width="170" height="120" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="895.0" y="266.5" text-anchor="middle" font-size="12.4" font-weight="700" fill="#1f2933">En general no basta</text>
<text x="895.0" y="283.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Seguimiento clínico</text>
<text x="895.0" y="300.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">y con RM; derivar a</text>
<text x="895.0" y="317.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">neurología (pueden</text>
<text x="895.0" y="334.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">ayudar biomarcadores)</text>
<rect x="470" y="400" width="300" height="50" rx="8" fill="#2f9e44" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="620.0" y="421.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Esclerosis múltiple</text>
<text x="620.0" y="438.0" text-anchor="middle" font-size="14" font-weight="400" fill="#ffffff">(forma con brotes o progresiva)</text>
<rect x="470" y="476" width="510" height="64" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.6"/>
<text x="725.0" y="495.5" text-anchor="middle" font-size="12.4" font-weight="700" fill="#1f2933">Diseminación en el tiempo en la RM</text>
<text x="725.0" y="512.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Lesiones con y sin gadolinio a la vez, o una lesión nueva en una RM de control.</text>
<text x="725.0" y="529.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">En ≥ 50 años o con factores de riesgo vascular, exigir más evidencia.</text>
</svg>