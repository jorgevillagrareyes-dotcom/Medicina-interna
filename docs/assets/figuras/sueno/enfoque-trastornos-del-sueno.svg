<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="590" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Trastornos del sueño: enfoque según el motivo de consulta</text>
<rect x="250" y="42" width="500" height="50" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Historia del sueño (idealmente con el compañero de cama)</text>
<text x="500" y="80" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Horarios, ronquido, pausas, conductas nocturnas, somnolencia diurna (Epworth), fármacos, alcohol</text>
<line x1="125" y1="106" x2="875" y2="106" stroke="#495057" stroke-width="1.6"/>
<line x1="500" y1="92" x2="500" y2="106" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="128.0" y1="106" x2="128.0" y2="124" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="10" y="124" width="236" height="56" rx="8" fill="#e8590c" stroke="#e8590c"/>
<text x="128.0" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">“No puedo dormir”</text>
<text x="128.0" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Insomnio</text>
<rect x="10" y="186" width="236" height="112" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/>
<text x="128.0" y="206" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Dificultad para iniciar o</text>
<text x="128.0" y="222" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">mantener el sueño, o</text>
<text x="128.0" y="238" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">despertar precoz, con</text>
<text x="128.0" y="254" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">repercusión diurna</text>
<text x="128.0" y="270" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Crónico: ≥ 3 noches/semana</text>
<text x="128.0" y="286" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">por ≥ 3 meses</text>
<rect x="10" y="304" width="236" height="112" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="1.4"/>
<text x="128.0" y="324" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Buscar: depresión, ansiedad,</text>
<text x="128.0" y="340" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">dolor, nicturia, reflujo,</text>
<text x="128.0" y="356" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">alcohol, cafeína, fármacos</text>
<text x="128.0" y="372" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">(corticoides, β-agonistas,</text>
<text x="128.0" y="388" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">ISRS), piernas inquietas,</text>
<text x="128.0" y="404" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">apnea</text>
<rect x="10" y="422" width="236" height="82" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="128.0" y="442" text-anchor="middle" font-size="12.6" font-weight="700" fill="#e8590c">TCC-I: primera línea</text>
<text x="128.0" y="459" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Fármaco solo por poco</text>
<text x="128.0" y="476" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">tiempo; evitar BZD</text>
<text x="128.0" y="493" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">en adultos mayores</text>
<line x1="374.0" y1="106" x2="374.0" y2="124" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="256" y="124" width="236" height="56" rx="8" fill="#1c7ed6" stroke="#1c7ed6"/>
<text x="374.0" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">“Me duermo de día”</text>
<text x="374.0" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Hipersomnia</text>
<rect x="256" y="186" width="236" height="112" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.4"/>
<text x="374.0" y="206" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Somnolencia diurna excesiva</text>
<text x="374.0" y="222" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">(Epworth &gt; 10)</text>
<text x="374.0" y="238" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Distinguir de la fatiga</text>
<text x="374.0" y="254" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">(cansancio sin tendencia</text>
<text x="374.0" y="270" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">a quedarse dormido)</text>
<text x="374.0" y="286" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933"></text>
<rect x="256" y="304" width="236" height="112" rx="8" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.4"/>
<text x="374.0" y="324" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">¿Duerme &lt; 7 h? Sueño</text>
<text x="374.0" y="340" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">insuficiente · Ronquido,</text>
<text x="374.0" y="356" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">pausas, obesidad: APNEA</text>
<text x="374.0" y="372" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Cataplejía, parálisis del</text>
<text x="374.0" y="388" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">sueño: NARCOLEPSIA</text>
<text x="374.0" y="404" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Sedantes, hipotiroidismo</text>
<rect x="256" y="422" width="236" height="82" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
<text x="374.0" y="442" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1c7ed6">Apnea: STOP-Bang y</text>
<text x="374.0" y="459" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">poligrafía o PSG</text>
<text x="374.0" y="476" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Narcolepsia: PSG y TLMS</text>
<text x="374.0" y="493" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">(test de latencias múltiples)</text>
<line x1="620.0" y1="106" x2="620.0" y2="124" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="502" y="124" width="236" height="56" rx="8" fill="#6741d9" stroke="#6741d9"/>
<text x="620.0" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">“Hago cosas de noche”</text>
<text x="620.0" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Parasomnias</text>
<rect x="502" y="186" width="236" height="112" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
<text x="620.0" y="206" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">NREM (primer tercio de</text>
<text x="620.0" y="222" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">la noche): sonambulismo,</text>
<text x="620.0" y="238" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">terrores, sin recuerdo</text>
<text x="620.0" y="254" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">REM (segunda mitad):</text>
<text x="620.0" y="270" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">actúa sus sueños, se</text>
<text x="620.0" y="286" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">golpea o golpea a otros</text>
<rect x="502" y="304" width="236" height="112" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="1.4"/>
<text x="620.0" y="324" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Trastorno conductual del</text>
<text x="620.0" y="340" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">sueño REM: hombre</text>
<text x="620.0" y="356" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">&gt; 50 años; anuncia</text>
<text x="620.0" y="372" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Parkinson o demencia</text>
<text x="620.0" y="388" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">con cuerpos de Lewy</text>
<text x="620.0" y="404" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Descartar crisis nocturnas</text>
<rect x="502" y="422" width="236" height="82" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
<text x="620.0" y="442" text-anchor="middle" font-size="12.6" font-weight="700" fill="#6741d9">Seguridad del dormitorio</text>
<text x="620.0" y="459" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">PSG con video si es</text>
<text x="620.0" y="476" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">violento o atípico</text>
<text x="620.0" y="493" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Melatonina o clonazepam</text>
<line x1="866.0" y1="106" x2="866.0" y2="124" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="748" y="124" width="236" height="56" rx="8" fill="#2f9e44" stroke="#2f9e44"/>
<text x="866.0" y="146" text-anchor="middle" font-size="12.4" font-weight="700" fill="#ffffff">“Mis piernas no se quedan quietas”</text>
<text x="866.0" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Piernas inquietas</text>
<rect x="748" y="186" width="236" height="112" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
<text x="866.0" y="206" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Urgencia de mover las</text>
<text x="866.0" y="222" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">piernas, peor en reposo</text>
<text x="866.0" y="238" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">y en la tarde o noche,</text>
<text x="866.0" y="254" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">alivia al moverse</text>
<text x="866.0" y="270" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Diagnóstico clínico</text>
<text x="866.0" y="286" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933"></text>
<rect x="748" y="304" width="236" height="112" rx="8" fill="#ffffff" stroke="#2f9e44" stroke-width="1.4"/>
<text x="866.0" y="324" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Ferritina y saturación de</text>
<text x="866.0" y="340" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">transferrina · Embarazo,</text>
<text x="866.0" y="356" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">ERC, neuropatía · Fármacos:</text>
<text x="866.0" y="372" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">antihistamínicos, ISRS,</text>
<text x="866.0" y="388" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">antipsicóticos,</text>
<text x="866.0" y="404" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">metoclopramida</text>
<rect x="748" y="422" width="236" height="82" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text x="866.0" y="442" text-anchor="middle" font-size="12.6" font-weight="700" fill="#2f9e44">Hierro si ferritina ≤ 75</text>
<text x="866.0" y="459" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">o saturación &lt; 20 %</text>
<text x="866.0" y="476" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Gabapentina o pregabalina</text>
<text x="866.0" y="493" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">No usar dopaminérgicos de rutina</text>
<rect x="10" y="516" width="980" height="62" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
<text x="500" y="538" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c92a2a">Derivar a la unidad de sueño (broncopulmonar o neurología)</text>
<text x="500" y="557" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Sospecha de apnea (para el estudio y el CPAP) · hipoventilación · narcolepsia · parasomnia violenta o trastorno conductual del sueño REM</text>
<text x="500" y="573" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Insomnio que no responde a la TCC-I y a la corrección de las causas · piernas inquietas con aumento (augmentation) por dopaminérgicos</text>
</svg>