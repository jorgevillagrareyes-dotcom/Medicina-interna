<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 714" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="714" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Apnea obstructiva del sueño: de la sospecha al tratamiento</text>
<rect x="40" y="44" width="920" height="66" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="64.9" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f5f99">1. Sospecha clínica</text>
<text x="500.0" y="81.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Ronquido habitual, pausas presenciadas, despertares con ahogo, somnolencia diurna, cefalea matinal, nicturia</text>
<text x="500.0" y="98.1" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Obesidad, cuello &gt; 40 cm, retrognatia · HTA resistente, FA, insuficiencia cardíaca, ACV, DM2 · conductor profesional</text>
<line x1="500" y1="110" x2="500" y2="128" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="128" width="920" height="50" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="500.0" y="149.2" text-anchor="middle" font-size="12.6" font-weight="700" fill="#b35c00">2. Cuestionarios: orientan, NO diagnostican</text>
<text x="500.0" y="165.8" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">STOP-Bang ≥ 3: riesgo intermedio o alto (≥ 5: alto) · Epworth &gt; 10: somnolencia excesiva</text>
<line x1="500" y1="178" x2="500" y2="196" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="500" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5f99">3. Estudio del sueño</text>
<line x1="250" y1="222" x2="750" y2="222" stroke="#495057" stroke-width="1.6"/>
<line x1="250" y1="222" x2="250" y2="236" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="750" y1="222" x2="750" y2="236" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="236" width="420" height="100" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="250.0" y="257.3" text-anchor="middle" font-size="12.6" font-weight="700" fill="#2f9e44">Poligrafía domiciliaria</text>
<text x="250.0" y="273.9" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Sospecha de apnea moderada o grave</text>
<text x="250.0" y="290.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">sin comorbilidad importante</text>
<text x="250.0" y="307.1" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Si es negativa o no concluyente y la</text>
<text x="250.0" y="323.7" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">sospecha persiste: polisomnografía</text>
<rect x="540" y="236" width="420" height="100" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6"/>
<text x="750.0" y="257.3" text-anchor="middle" font-size="12.6" font-weight="700" fill="#6741d9">Polisomnografía (en laboratorio)</text>
<text x="750.0" y="273.9" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Enfermedad cardiopulmonar grave, neuromuscular,</text>
<text x="750.0" y="290.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">hipoventilación, opioides, ACV, insomnio grave</text>
<text x="750.0" y="307.1" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Sospecha de otros trastornos del sueño</text>
<text x="750.0" y="323.7" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">(narcolepsia, parasomnias, movimientos)</text>
<line x1="250" y1="336" x2="250" y2="354" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="750" y1="336" x2="750" y2="354" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="250" y1="354" x2="750" y2="354" stroke="#495057" stroke-width="1.6"/>
<line x1="500" y1="354" x2="500" y2="368" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="500" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5f99">4. Gravedad según el IAH (eventos por hora)</text>
<rect x="100" y="396" width="190" height="46" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="195" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#868e96">IAH &lt; 5</text>
<text x="195" y="434" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Normal</text>
<rect x="305" y="396" width="190" height="46" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="400" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#e8a10c">IAH 5–14</text>
<text x="400" y="434" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Leve</text>
<rect x="510" y="396" width="190" height="46" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="605" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#e8590c">IAH 15–29</text>
<text x="605" y="434" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Moderada</text>
<rect x="715" y="396" width="190" height="46" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="810" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#c92a2a">IAH ≥ 30</text>
<text x="810" y="434" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Grave</text>
<text x="500" y="460" text-anchor="middle" font-size="12.6" font-weight="400" fill="#495057">El IAH orienta, pero la indicación de tratamiento depende de los síntomas y de la comorbilidad</text>
<line x1="500" y1="466" x2="500" y2="482" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="500" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5f99">5. Tratamiento</text>
<rect x="40" y="508" width="226" height="132" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="153.0" y="528" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f5f99">Medidas para todos</text>
<text x="153.0" y="548.0" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Bajar de peso</text>
<text x="153.0" y="563.6" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Evitar alcohol nocturno</text>
<text x="153.0" y="579.2" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">y sedantes (BZD, opioides)</text>
<text x="153.0" y="594.8" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Dormir de lado si es</text>
<text x="153.0" y="610.4" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">posicional · no conducir</text>
<text x="153.0" y="626.0" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">con somnolencia</text>
<rect x="278" y="508" width="226" height="132" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="391.0" y="528" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f9e44">CPAP o APAP</text>
<text x="391.0" y="548.0" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Somnolencia excesiva</text>
<text x="391.0" y="563.6" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">(recomendación fuerte)</text>
<text x="391.0" y="579.2" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Mala calidad de vida o HTA</text>
<text x="391.0" y="594.8" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">(condicional)</text>
<text x="391.0" y="610.4" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Uso ≥ 4 h por noche;</text>
<text x="391.0" y="626.0" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">educación y seguimiento</text>
<rect x="516" y="508" width="226" height="132" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6"/>
<text x="629.0" y="528" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6741d9">Alternativas</text>
<text x="629.0" y="548.0" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Dispositivo de avance</text>
<text x="629.0" y="563.6" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">mandibular (leve a</text>
<text x="629.0" y="579.2" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">moderada o no tolera</text>
<text x="629.0" y="594.8" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">el CPAP) · Cirugía de</text>
<text x="629.0" y="610.4" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">la vía aérea · estimulador</text>
<text x="629.0" y="626.0" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">del hipogloso</text>
<rect x="754" y="508" width="226" height="132" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="867.0" y="528" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e8590c">Obesidad (IMC ≥ 30)</text>
<text x="867.0" y="548.0" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Tirzepatida en la apnea</text>
<text x="867.0" y="563.6" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">moderada o grave</text>
<text x="867.0" y="579.2" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">(SURMOUNT-OSA: IAH</text>
<text x="867.0" y="594.8" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">−20 a −24 eventos/h</text>
<text x="867.0" y="610.4" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">vs placebo) · cirugía</text>
<text x="867.0" y="626.0" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">bariátrica</text>
<rect x="40" y="652" width="920" height="50" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="500.0" y="673.2" text-anchor="middle" font-size="12.6" font-weight="700" fill="#c92a2a">Alerta: hipoventilación por obesidad</text>
<text x="500.0" y="689.8" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Obeso con bicarbonato ≥ 27 mEq/L, SpO2 baja en vigilia o hipercapnia (PaCO2 ≥ 45 mmHg): gases arteriales y derivar (CPAP o VMNI)</text>
</svg>