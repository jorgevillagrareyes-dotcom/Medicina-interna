<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="442" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Hemoglobina o plaquetas altas: ¿reactivas o neoplasia mieloproliferativa?</text>
<rect x="30" y="44" width="460" height="58" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="260" y="66" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c92a2a">Eritrocitosis</text>
<text x="260" y="86" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Hb &gt; 16,5 g/dL (hombres) o &gt; 16 g/dL (mujeres) · Hto &gt; 49 % o &gt; 48 %</text>
<line x1="260" y1="102" x2="260" y2="118" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="118" width="460" height="40" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="260" y="143" text-anchor="middle" font-size="11.8" font-weight="700" fill="#495057">Repetir · descartar hemoconcentración · eritropoyetina sérica + JAK2 V617F</text>
<line x1="145" y1="172" x2="375" y2="172" stroke="#495057" stroke-width="1.6"/>
<line x1="260" y1="158" x2="260" y2="172" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="145" y1="172" x2="145" y2="186" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="375" y1="172" x2="375" y2="186" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="186" width="225" height="158" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="142" y="206" text-anchor="middle" font-size="13.4" font-weight="700" fill="#7048e8">EPO baja + JAK2+</text>
<text x="142" y="226.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">(exón 12 si V617F negativo)</text>
<text x="142" y="242.2" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f2933">→ POLICITEMIA VERA</text>
<text x="142" y="258.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Prurito acuagénico,</text>
<text x="142" y="274.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">eritromelalgia, trombosis,</text>
<text x="142" y="290.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">esplenomegalia; a menudo</text>
<text x="142" y="307.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">leucocitos y plaquetas</text>
<text x="142" y="323.2" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">también altos</text>
<rect x="265" y="186" width="225" height="158" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="377" y="206" text-anchor="middle" font-size="13.4" font-weight="700" fill="#2f9e44">EPO normal o alta</text>
<text x="377" y="226.0" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f2933">→ ERITROCITOSIS SECUNDARIA</text>
<text x="377" y="242.2" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Hipoxia: EPOC, apnea del sueño,</text>
<text x="377" y="258.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">altura (mineros), cardiopatía</text>
<text x="377" y="274.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Tabaco (CO) · testosterona</text>
<text x="377" y="290.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Tumores con EPO: riñón, hígado</text>
<text x="377" y="307.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Postrasplante renal · iSGLT2</text>
<text x="377" y="323.2" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f2933">→ tratar la causa</text>
<rect x="510" y="44" width="460" height="58" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="740" y="66" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b35c00">Trombocitosis</text>
<text x="740" y="86" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Plaquetas &gt; 450 000/µL persistentes</text>
<line x1="740" y1="102" x2="740" y2="118" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="510" y="118" width="460" height="40" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="740" y="143" text-anchor="middle" font-size="11.8" font-weight="700" fill="#495057">Buscar causa reactiva (la más frecuente: ~ 80–90 %) · ferritina, PCR, frotis</text>
<line x1="625" y1="172" x2="855" y2="172" stroke="#495057" stroke-width="1.6"/>
<line x1="740" y1="158" x2="740" y2="172" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="625" y1="172" x2="625" y2="186" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="855" y1="172" x2="855" y2="186" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="510" y="186" width="225" height="158" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="622" y="206" text-anchor="middle" font-size="13.4" font-weight="700" fill="#2f9e44">Reactiva</text>
<text x="622" y="226.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Déficit de hierro, hemorragia</text>
<text x="622" y="242.2" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Infección, inflamación (AR, EII)</text>
<text x="622" y="258.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Cáncer · posoperatorio</text>
<text x="622" y="274.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Esplenectomía o asplenia</text>
<text x="622" y="290.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Recuperación de una</text>
<text x="622" y="307.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">trombocitopenia</text>
<text x="622" y="323.2" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f2933">→ tratar la causa</text>
<rect x="745" y="186" width="225" height="158" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="857" y="206" text-anchor="middle" font-size="13.4" font-weight="700" fill="#7048e8">Sin causa y persistente</text>
<text x="857" y="226.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">JAK2, CALR, MPL + BCR::ABL1</text>
<text x="857" y="242.2" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f2933">→ TROMBOCITEMIA ESENCIAL</text>
<text x="857" y="258.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">(o mielofibrosis prefibrótica)</text>
<text x="857" y="274.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Descartar LMC (BCR::ABL1)</text>
<text x="857" y="290.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">y SMD con del(5q)</text>
<text x="857" y="307.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Trombosis y, con plaquetas</text>
<text x="857" y="323.2" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">&gt; 1 millón, sangrado</text>
<rect x="30" y="360" width="940" height="70" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="500" y="382" text-anchor="middle" font-size="13.6" font-weight="700" fill="#e8590c">Mielofibrosis primaria (o secundaria a policitemia vera o trombocitemia esencial)</text>
<text x="500" y="401" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Esplenomegalia masiva · anemia · leucoeritroblastosis y dacriocitos · síntomas constitucionales · aspirado "seco"</text>
<text x="500" y="418" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Biopsia de médula (fibrosis de reticulina) + JAK2, CALR o MPL · pronóstico con DIPSS · ruxolitinib o trasplante alogénico</text>
</svg>