<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 648" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="980" height="648" fill="#ffffff"/>
<text x="490.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">¿Tóxico-metabólica o estructural? Claves del examen en el compromiso de conciencia</text>
<rect x="180" y="52" width="385" height="40" rx="8" fill="#1f6f5c"/>
<text x="372.5" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Sugiere causa tóxico-metabólica</text>
<rect x="575" y="52" width="385" height="40" rx="8" fill="#b3261e"/>
<text x="767.5" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Sugiere lesión estructural: TC urgente</text>
<rect x="20" y="104" width="940" height="64" rx="6" fill="#f4f6f8" stroke="#d9dee3"/>
<text x="32" y="141" font-size="15" font-weight="700" fill="#1f2933">Inicio y curso</text>
<text x="190" y="130" font-size="14.5" font-weight="600" fill="#154d40">Horas a días, FLUCTUANTE</text>
<text x="190" y="152" font-size="14.5" font-weight="400" fill="#154d40">Antecedente: fármaco, falla de órgano, infección</text>
<text x="585" y="130" font-size="14.5" font-weight="600" fill="#7f1d17">SÚBITO (ACV, hemorragia) o progresivo</text>
<text x="585" y="152" font-size="14.5" font-weight="400" fill="#7f1d17">con cefalea, trauma o fiebre y rigidez de nuca</text>
<line x1="570" y1="112" x2="570" y2="160" stroke="#c3cad1" stroke-width="1.5"/>
<rect x="20" y="174" width="940" height="64" rx="6" fill="#ffffff" stroke="#d9dee3"/>
<text x="32" y="211" font-size="15" font-weight="700" fill="#1f2933">Pupilas</text>
<text x="190" y="200" font-size="14.5" font-weight="600" fill="#154d40">SIMÉTRICAS y REACTIVAS, aun en coma</text>
<text x="190" y="222" font-size="14.5" font-weight="400" fill="#154d40">(opioides: mióticas; anticolinérgicos: midriasis)</text>
<text x="585" y="200" font-size="14.5" font-weight="600" fill="#7f1d17">ANISOCORIA, pupila dilatada y fija</text>
<text x="585" y="222" font-size="14.5" font-weight="400" fill="#7f1d17">(herniación uncal: III par)</text>
<line x1="570" y1="182" x2="570" y2="230" stroke="#c3cad1" stroke-width="1.5"/>
<rect x="20" y="244" width="940" height="64" rx="6" fill="#f4f6f8" stroke="#d9dee3"/>
<text x="32" y="281" font-size="15" font-weight="700" fill="#1f2933">Motor</text>
<text x="190" y="270" font-size="14.5" font-weight="600" fill="#154d40">SIMÉTRICO: asterixis, mioclonías</text>
<text x="190" y="292" font-size="14.5" font-weight="400" fill="#154d40">multifocales, temblor, hiporreflexia o clonus</text>
<text x="585" y="270" font-size="14.5" font-weight="600" fill="#7f1d17">ASIMÉTRICO: hemiparesia, Babinski</text>
<text x="585" y="292" font-size="14.5" font-weight="400" fill="#7f1d17">unilateral, desviación conjugada de la mirada</text>
<line x1="570" y1="252" x2="570" y2="300" stroke="#c3cad1" stroke-width="1.5"/>
<rect x="20" y="314" width="940" height="64" rx="6" fill="#ffffff" stroke="#d9dee3"/>
<text x="32" y="351" font-size="15" font-weight="700" fill="#1f2933">Tronco cerebral</text>
<text x="190" y="340" font-size="14.5" font-weight="600" fill="#154d40">Reflejos oculocefálicos y corneales</text>
<text x="190" y="362" font-size="14.5" font-weight="400" fill="#154d40">conservados (salvo sedación profunda)</text>
<text x="585" y="340" font-size="14.5" font-weight="600" fill="#7f1d17">Pérdida de reflejos de tronco, paresia</text>
<text x="585" y="362" font-size="14.5" font-weight="400" fill="#7f1d17">de mirada, postura de descerebración</text>
<line x1="570" y1="322" x2="570" y2="370" stroke="#c3cad1" stroke-width="1.5"/>
<rect x="20" y="384" width="940" height="64" rx="6" fill="#f4f6f8" stroke="#d9dee3"/>
<text x="32" y="421" font-size="15" font-weight="700" fill="#1f2933">Respiración</text>
<text x="190" y="410" font-size="14.5" font-weight="600" fill="#154d40">KUSSMAUL (acidosis metabólica)</text>
<text x="190" y="432" font-size="14.5" font-weight="400" fill="#154d40">Bradipnea (opioides, hipercapnia)</text>
<text x="585" y="410" font-size="14.5" font-weight="600" fill="#7f1d17">Patrón irregular o atáxico</text>
<text x="585" y="432" font-size="14.5" font-weight="400" fill="#7f1d17">(lesión del tronco o compresión)</text>
<line x1="570" y1="392" x2="570" y2="440" stroke="#c3cad1" stroke-width="1.5"/>
<rect x="20" y="454" width="940" height="64" rx="6" fill="#ffffff" stroke="#d9dee3"/>
<text x="32" y="491" font-size="15" font-weight="700" fill="#1f2933">Examen clave</text>
<text x="190" y="480" font-size="14.5" font-weight="600" fill="#154d40">Glicemia capilar YA, Na, Ca, creatinina,</text>
<text x="190" y="502" font-size="14.5" font-weight="400" fill="#154d40">gases, amonio, niveles de fármacos, EEG</text>
<text x="585" y="480" font-size="14.5" font-weight="600" fill="#7f1d17">TC de cerebro sin contraste</text>
<text x="585" y="502" font-size="14.5" font-weight="400" fill="#7f1d17">(angio-TC o RM según el caso), luego PL</text>
<line x1="570" y1="462" x2="570" y2="510" stroke="#c3cad1" stroke-width="1.5"/>
<rect x="20" y="530" width="940" height="92" rx="8" fill="#fff7e6" stroke="#e0a526" stroke-width="1.5"/>
<text x="34" y="554" font-size="14" fill="#5c3d00">Trampas: la HIPOGLICEMIA y la hiponatremia pueden dar hemiparesia; la encefalopatía hepática puede dar</text>
<text x="34" y="574" font-size="14" fill="#5c3d00">signos focales transitorios; Wernicke da oftalmoplejia y nistagmo. Una causa metabólica NO descarta otra</text>
<text x="34" y="594" font-size="14" fill="#5c3d00">estructural (cirrótico con hematoma subdural, anticoagulado que se cae). Ante la duda o si no mejora al</text>
<text x="34" y="614" font-size="14" fill="#5c3d00">corregir la causa: TC. Si hay fiebre o inmunosupresión: punción lumbar.</text>
<text x="960" y="640" text-anchor="end" font-size="11.5" fill="#7b8794">Esquema propio basado en el examen neurológico del coma (Plum y Posner) y Angel y Young (2011).</text>
</svg>