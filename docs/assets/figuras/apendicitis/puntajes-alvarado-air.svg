<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="960" height="612" fill="#ffffff"/>
<text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">Puntajes clínicos de apendicitis aguda: Alvarado y AIR</text>
<rect x="20" y="50" width="450" height="52" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="245.0" y="72.3" text-anchor="middle" font-size="13" font-weight="700" fill="#e8590c">Puntaje de Alvarado (MANTRELS)</text>
<text x="245.0" y="88.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Solo clínica, hemograma y fórmula</text>
<rect x="20" y="112" width="450" height="34" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="34" y="134" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Migración del dolor a la fosa ilíaca derecha</text>
<text x="450" y="134" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="20" y="146" width="450" height="34" fill="#ffffff" stroke="#dee2e6"/>
<text x="34" y="168" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Anorexia</text>
<text x="450" y="168" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="20" y="180" width="450" height="34" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="34" y="202" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Náuseas o vómitos</text>
<text x="450" y="202" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="20" y="214" width="450" height="34" fill="#ffffff" stroke="#dee2e6"/>
<text x="34" y="236" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Sensibilidad en la fosa ilíaca derecha</text>
<text x="450" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">2</text>
<rect x="20" y="248" width="450" height="34" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="34" y="270" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Signo del rebote (Blumberg)</text>
<text x="450" y="270" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="20" y="282" width="450" height="34" fill="#ffffff" stroke="#dee2e6"/>
<text x="34" y="304" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Temperatura ≥ 37,3 °C</text>
<text x="450" y="304" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="20" y="316" width="450" height="34" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="34" y="338" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Leucocitos > 10.000/µL</text>
<text x="450" y="338" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">2</text>
<rect x="20" y="350" width="450" height="34" fill="#ffffff" stroke="#dee2e6"/>
<text x="34" y="372" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Desviación a la izquierda (neutrofilia)</text>
<text x="450" y="372" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="20" y="384" width="450" height="34" fill="#fff4e6" stroke="#e8590c"/>
<text x="34" y="406" text-anchor="start" font-size="13" font-weight="700" fill="#1f2933">Total</text>
<text x="450" y="406" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">0–10</text>
<rect x="490" y="50" width="450" height="52" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="715.0" y="72.3" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5f99">Puntaje AIR (respuesta inflamatoria)</text>
<text x="715.0" y="88.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Agrega la PCR y gradúa el rebote</text>
<rect x="490" y="112" width="450" height="34" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="504" y="134" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Vómitos</text>
<text x="920" y="134" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="490" y="146" width="450" height="34" fill="#ffffff" stroke="#dee2e6"/>
<text x="504" y="168" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Dolor en la fosa ilíaca derecha</text>
<text x="920" y="168" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="490" y="180" width="450" height="34" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="504" y="202" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Rebote: leve / moderado / intenso</text>
<text x="920" y="202" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1 / 2 / 3</text>
<rect x="490" y="214" width="450" height="34" fill="#ffffff" stroke="#dee2e6"/>
<text x="504" y="236" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Temperatura ≥ 38,5 °C</text>
<text x="920" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1</text>
<rect x="490" y="248" width="450" height="34" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="504" y="270" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Neutrófilos 70–84 % / ≥ 85 %</text>
<text x="920" y="270" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1 / 2</text>
<rect x="490" y="282" width="450" height="34" fill="#ffffff" stroke="#dee2e6"/>
<text x="504" y="304" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Leucocitos 10.000–14.900 / ≥ 15.000</text>
<text x="920" y="304" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1 / 2</text>
<rect x="490" y="316" width="450" height="34" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="504" y="338" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">PCR 10–49 mg/L / ≥ 50 mg/L</text>
<text x="920" y="338" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">1 / 2</text>
<rect x="490" y="350" width="450" height="34" fill="#e7f0f8" stroke="#1f5f99"/>
<text x="504" y="372" text-anchor="start" font-size="13" font-weight="700" fill="#1f2933">Total</text>
<text x="920" y="372" text-anchor="end" font-size="13" font-weight="700" fill="#1f2933">0–12</text>
<text x="480" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Riesgo según el puntaje y conducta sugerida (WSES)</text>
<rect x="20" y="456" width="300" height="110" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="170.0" y="483.0" text-anchor="middle" font-size="12.6" font-weight="700" fill="#2f9e44">Riesgo bajo</text>
<text x="170.0" y="499.2" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Alvarado 0–4 · AIR 0–4</text>
<text x="170.0" y="515.4" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Apendicitis poco probable</text>
<text x="170.0" y="531.6" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Alta con control precoz, o</text>
<text x="170.0" y="547.8" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">observar y repetir el puntaje</text>
<rect x="330" y="456" width="300" height="110" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="480.0" y="483.0" text-anchor="middle" font-size="12.6" font-weight="700" fill="#e8a10c">Riesgo intermedio</text>
<text x="480.0" y="499.2" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Alvarado 5–6 · AIR 5–8</text>
<text x="480.0" y="515.4" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Imagen: ecografía</text>
<text x="480.0" y="531.6" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">(TC si no es concluyente)</text>
<text x="480.0" y="547.8" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Hospitalizar y reevaluar</text>
<rect x="640" y="456" width="300" height="110" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="790.0" y="483.0" text-anchor="middle" font-size="12.6" font-weight="700" fill="#c92a2a">Riesgo alto</text>
<text x="790.0" y="499.2" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Alvarado 7–10 · AIR 9–12</text>
<text x="790.0" y="515.4" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Apendicitis probable</text>
<text x="790.0" y="531.6" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Evaluación por cirugía</text>
<text x="790.0" y="547.8" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Imagen según edad y sexo</text>
<text x="480" y="596" text-anchor="middle" font-size="11.5" font-weight="400" fill="#495057">Esquema propio basado en Alvarado (1986), Andersson (AIR) y las guías WSES Jerusalem 2020 y 2025.</text>
</svg>