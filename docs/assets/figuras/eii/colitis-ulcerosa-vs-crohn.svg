<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="712" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Colitis ulcerosa y enfermedad de Crohn: distribución y diferencias</text>
<path d="M80,310 L80,120 Q80,90 110,90 L330,90 Q360,90 360,120 L360,260 Q360,300 310,310 Q240,322 240,350 L240,390" fill="none" stroke="#dee2e6" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M110,90 L330,90 Q360,90 360,120" fill="none" stroke="#ffa8a8" stroke-width="30" stroke-linecap="butt" stroke-linejoin="round" opacity="0.85"/>
<path d="M80,310 L80,120 Q80,90 110,90" fill="none" stroke="#ffa8a8" stroke-width="30" stroke-linecap="butt" stroke-linejoin="round" opacity="0.85"/>
<path d="M360,120 L360,260" fill="none" stroke="#fa5252" stroke-width="30" stroke-linecap="butt" stroke-linejoin="round" opacity="0.85"/>
<path d="M360,260 Q360,300 310,310 Q240,322 240,350" fill="none" stroke="#fa5252" stroke-width="30" stroke-linecap="butt" stroke-linejoin="round" opacity="0.85"/>
<path d="M240,350 L240,390" fill="none" stroke="#c92a2a" stroke-width="30" stroke-linecap="butt" stroke-linejoin="round" opacity="0.85"/>
<path d="M80,310 L80,120 Q80,90 110,90 L330,90 Q360,90 360,120 L360,260 Q360,300 310,310 Q240,322 240,350 L240,390" fill="none" stroke="#868e96" stroke-width="1.2" stroke-dasharray="0" opacity="0"/>
<text x="220" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#c92a2a">Colitis ulcerosa</text>
<text x="220" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#c92a2a">Inflamación CONTINUA</text>
<text x="220" y="197" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">desde el recto hacia proximal</text>
<text x="220" y="214" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Solo mucosa · solo colon</text>
<rect x="272" y="349" width="14" height="14" rx="3" fill="#c92a2a"/>
<text x="292" y="360" text-anchor="start" font-size="12.2" font-weight="400" fill="#1f2933">E1 proctitis</text>
<rect x="272" y="369" width="14" height="14" rx="3" fill="#fa5252"/>
<text x="292" y="380" text-anchor="start" font-size="12.2" font-weight="400" fill="#1f2933">E2 izquierda (hasta el ángulo esplénico)</text>
<rect x="272" y="389" width="14" height="14" rx="3" fill="#ffa8a8"/>
<text x="292" y="400" text-anchor="start" font-size="12.2" font-weight="400" fill="#1f2933">E3 extensa (más allá del ángulo esplénico)</text>
<text x="180" y="412" text-anchor="end" font-size="12" font-weight="700" fill="#495057">Recto</text>
<line x1="185" y1="408" x2="223" y2="382" stroke="#868e96" stroke-width="1"/>
<text x="42" y="332" text-anchor="start" font-size="12" font-weight="700" fill="#495057">Ciego</text>
<text x="760" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#6741d9">Enfermedad de Crohn</text>
<path d="M620,310 L620,120 Q620,90 650,90 L870,90 Q900,90 900,120 L900,260 Q900,300 850,310 Q780,322 780,350 L780,390" fill="none" stroke="#dee2e6" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M620,310 L620,255" fill="none" stroke="#6741d9" stroke-width="30" opacity="0.8"/>
<path d="M730,90 L785,90" fill="none" stroke="#6741d9" stroke-width="30" opacity="0.8"/>
<path d="M900,170 L900,215" fill="none" stroke="#6741d9" stroke-width="30" opacity="0.8"/>
<path d="M700,360 Q670,320 635,295" fill="none" stroke="#dee2e6" stroke-width="16" stroke-linecap="round"/>
<path d="M680,332 Q660,310 635,295" fill="none" stroke="#6741d9" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
<circle cx="780" cy="405" r="9" fill="#6741d9" opacity="0.85"/>
<path d="M789,405 q14,6 22,-6" fill="none" stroke="#6741d9" stroke-width="3"/>
<text x="816" y="410" text-anchor="start" font-size="12" font-weight="700" fill="#6741d9">Enfermedad perianal</text>
<text x="708" y="378" text-anchor="start" font-size="12" font-weight="700" fill="#6741d9">Íleon terminal</text>
<text x="708" y="393" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">(lo más afectado)</text>
<text x="760" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#6741d9">Lesiones SALTEADAS</text>
<text x="760" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#6741d9">y TRANSMURALES</text>
<text x="760" y="214" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">De la boca al ano</text>
<text x="760" y="231" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Recto a menudo respetado</text>
<rect x="20" y="444" width="960" height="246" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="40" y="464" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933"></text>
<text x="300" y="463" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c92a2a">Colitis ulcerosa</text>
<text x="710" y="463" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6741d9">Enfermedad de Crohn</text>
<rect x="22" y="472" width="956" height="27" fill="#ffffff" opacity="0.7"/>
<text x="36" y="490" text-anchor="start" font-size="12.8" font-weight="700" fill="#495057">Extensión</text>
<text x="300" y="490" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Recto y colon, continua</text>
<text x="710" y="490" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Cualquier tramo; íleon terminal y colon; salteada</text>
<text x="36" y="517" text-anchor="start" font-size="12.8" font-weight="700" fill="#495057">Profundidad</text>
<text x="300" y="517" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Mucosa</text>
<text x="710" y="517" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Transmural: fístulas, abscesos, estenosis</text>
<rect x="22" y="526" width="956" height="27" fill="#ffffff" opacity="0.7"/>
<text x="36" y="544" text-anchor="start" font-size="12.8" font-weight="700" fill="#495057">Clínica típica</text>
<text x="300" y="544" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Diarrea con sangre, pujo, urgencia</text>
<text x="710" y="544" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Dolor en fosa ilíaca derecha, diarrea, baja de peso, masa</text>
<text x="36" y="571" text-anchor="start" font-size="12.8" font-weight="700" fill="#495057">Enfermedad perianal</text>
<text x="300" y="571" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">No</text>
<text x="710" y="571" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Sí (fístulas, abscesos, fisuras atípicas)</text>
<rect x="22" y="580" width="956" height="27" fill="#ffffff" opacity="0.7"/>
<text x="36" y="598" text-anchor="start" font-size="12.8" font-weight="700" fill="#495057">Endoscopía</text>
<text x="300" y="598" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Eritema, friabilidad, úlceras superficiales</text>
<text x="710" y="598" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Aftas, úlceras longitudinales, empedrado</text>
<text x="36" y="625" text-anchor="start" font-size="12.8" font-weight="700" fill="#495057">Histología</text>
<text x="300" y="625" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Abscesos de criptas, distorsión</text>
<text x="710" y="625" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Granulomas no caseificantes (en ~1/3)</text>
<rect x="22" y="634" width="956" height="27" fill="#ffffff" opacity="0.7"/>
<text x="36" y="652" text-anchor="start" font-size="12.8" font-weight="700" fill="#495057">Tabaco</text>
<text x="300" y="652" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Fumar "protege"</text>
<text x="710" y="652" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Fumar EMPEORA: suspender</text>
<text x="36" y="679" text-anchor="start" font-size="12.8" font-weight="700" fill="#495057">Cirugía</text>
<text x="300" y="679" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">La colectomía es curativa</text>
<text x="710" y="679" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">No curativa; recurre en la anastomosis</text>
</svg>