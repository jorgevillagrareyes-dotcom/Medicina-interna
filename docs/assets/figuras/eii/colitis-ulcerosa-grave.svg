<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 608" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="608" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Brote grave de colitis ulcerosa: manejo en el hospital</text>
<rect x="30" y="44" width="940" height="76" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="500.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c92a2a">Criterios de Truelove y Witts: brote GRAVE</text>
<text x="500.0" y="86.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">≥ 6 deposiciones con sangre al día + al menos uno de: frecuencia cardíaca &gt; 90 lpm · temperatura &gt; 37,8 °C · hemoglobina &lt; 10,5 g/dL ·</text>
<text x="500.0" y="102.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">VHS &gt; 30 mm/h (o PCR &gt; 30 mg/L)  →  HOSPITALIZAR</text>
<line x1="500" y1="120" x2="500" y2="138" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="138" width="460" height="172" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="260.0" y="159" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f5f99">Al ingreso: estudio</text>
<text x="44" y="180.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Hemograma, PCR, albúmina, electrolitos (K, Mg), función renal</text>
<text x="44" y="196.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Coprocultivo y toxina de Clostridioides difficile</text>
<text x="44" y="213.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Radiografía de abdomen: megacolon tóxico (colon &gt; 6 cm)</text>
<text x="44" y="229.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Rectosigmoidoscopía flexible con biopsias (CMV)</text>
<text x="44" y="246.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Antes de un biológico: IGRA o PPD, radiografía de</text>
<text x="44" y="262.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">tórax, VHB, VHC, VIH</text>
<rect x="510" y="138" width="460" height="172" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="740.0" y="159" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f9e44">Al ingreso: tratamiento</text>
<text x="524" y="180.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Metilprednisolona 60 mg/día IV (o hidrocortisona 100 mg c/6 h)</text>
<text x="524" y="196.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Profilaxis de TVP con heparina de bajo peso molecular</text>
<text x="524" y="213.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Hidratación, corregir K y Mg; transfundir si Hb &lt; 8 g/dL</text>
<text x="524" y="229.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Suspender AINE, opioides, anticolinérgicos y loperamida</text>
<text x="524" y="246.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Nutrición oral o enteral (no ayuno de rutina)</text>
<text x="524" y="262.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">Avisar al cirujano desde el primer día</text>
<line x1="500" y1="310" x2="500" y2="330" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="200" y="330" width="600" height="66" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="500.0" y="351" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b35c00">Día 3: ¿responde? (criterios de Oxford)</text>
<text x="500.0" y="372.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">&gt; 8 deposiciones/día, o 3–8 deposiciones con PCR &gt; 45 mg/L:</text>
<text x="500.0" y="388.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">~85 % termina en colectomía si se sigue igual</text>
<line x1="250" y1="414" x2="750" y2="414" stroke="#495057" stroke-width="1.6"/>
<line x1="500" y1="396" x2="500" y2="414" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="250" y1="414" x2="250" y2="432" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="750" y1="414" x2="750" y2="432" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="258" y="428" text-anchor="start" font-size="12.4" font-weight="700" fill="#2f9e44">Responde</text>
<text x="742" y="428" text-anchor="end" font-size="12.4" font-weight="700" fill="#c92a2a">No responde</text>
<rect x="30" y="432" width="440" height="100" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="250.0" y="453" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f9e44">Respuesta</text>
<text x="250.0" y="474.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Pasar a prednisona oral y bajar en forma gradual</text>
<text x="250.0" y="490.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Iniciar tratamiento de mantención (tiopurina</text>
<text x="250.0" y="507.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">o terapia avanzada) según el especialista</text>
<rect x="530" y="432" width="440" height="100" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="750.0" y="453" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e8590c">Terapia de rescate</text>
<text x="750.0" y="474.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Infliximab 5 mg/kg IV o ciclosporina 2 mg/kg/día IV</text>
<text x="750.0" y="490.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Si no hay respuesta en 4–7 días:</text>
<text x="750.0" y="507.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">COLECTOMÍA (no retrasar)</text>
<rect x="30" y="546" width="940" height="50" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="500.0" y="567" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c92a2a">Cirugía urgente en cualquier momento</text>
<text x="500.0" y="588.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Megacolon tóxico que no mejora · perforación · hemorragia masiva</text>
</svg>