<text x="630" y="106" text-anchor="end" font-size="15" font-weight="700" fill="#8a1c14">Delirium</text>
<text x="430" y="456" font-size="15" font-weight="700" fill="#1e6b3a">Sin delirium</text>
<text x="318" y="334" font-size="12.5" fill="#b3261e" transform="rotate(-32 318 334)">umbral</text>
<line x1="140" y1="470" x2="640" y2="470" stroke="#1f2933" stroke-width="2"/>
<line x1="140" y1="470" x2="140" y2="80" stroke="#1f2933" stroke-width="2"/>
<polygon points="640,470 630,465 630,475" fill="#1f2933"/>
<polygon points="140,80 135,90 145,90" fill="#1f2933"/>
<text x="390.0" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Factores precipitantes (noxa aguda)</text>
<text x="140" y="520" font-size="12" fill="#52606d">leve (un fármaco, una sonda)</text>
<text x="640" y="520" text-anchor="end" font-size="12" fill="#52606d">grave (sepsis, cirugía mayor, UCI)</text>
<text x="100" y="275.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933" transform="rotate(-90 100 275.0)">Vulnerabilidad basal</text>
<text x="128" y="464" text-anchor="end" font-size="12" fill="#52606d">baja</text>
<text x="128" y="92" text-anchor="end" font-size="12" fill="#52606d">alta</text>
<circle cx="220" cy="130" r="8" fill="#b3261e" stroke="#ffffff" stroke-width="2"/>
<text x="232" y="128" text-anchor="start" font-size="12.5" font-weight="700" fill="#b3261e">Mujer de 88 años con demencia</text>
<text x="232" y="144" text-anchor="start" font-size="12" fill="#52606d">+ ITU leve o una benzodiacepina → delirium</text>
<circle cx="595" cy="370" r="8" fill="#b3261e" stroke="#ffffff" stroke-width="2"/>
<text x="583" y="368" text-anchor="end" font-size="12.5" font-weight="700" fill="#b3261e">Hombre de 30 años sano</text>
<text x="583" y="384" text-anchor="end" font-size="12" fill="#52606d">+ shock séptico en UCI → delirium</text>
<circle cx="190" cy="435" r="8" fill="#1e6b3a" stroke="#ffffff" stroke-width="2"/>
<text x="202" y="433" text-anchor="start" font-size="12.5" font-weight="700" fill="#1e6b3a">Adulto joven sano</text>
<text x="202" y="449" text-anchor="start" font-size="12" fill="#52606d">+ infección leve → sin delirium</text>
<rect x="690" y="80" width="255" height="153" rx="6" fill="#f4f7f8" stroke="#c9d6d9"/>
<text x="704" y="102" font-size="14" font-weight="700" fill="#12474f">Vulnerabilidad (predisponentes)</text>
<text x="704" y="122" font-size="12.5" fill="#1f2933">Edad ≥ 65 años</text>
<text x="704" y="139" font-size="12.5" fill="#1f2933">Demencia o deterioro cognitivo</text>
<text x="704" y="156" font-size="12.5" fill="#1f2933">Delirium previo</text>
<text x="704" y="173" font-size="12.5" fill="#1f2933">Fragilidad, dependencia</text>
<text x="704" y="190" font-size="12.5" fill="#1f2933">Déficit visual o auditivo</text>
<text x="704" y="207" font-size="12.5" fill="#1f2933">Comorbilidad grave, ERC</text>
<text x="704" y="224" font-size="12.5" fill="#1f2933">Alcoholismo, desnutrición</text>
<rect x="690" y="251" width="255" height="153" rx="6" fill="#f4f7f8" stroke="#c9d6d9"/>
<text x="704" y="273" font-size="14" font-weight="700" fill="#8a1c14">Precipitantes</text>
<text x="704" y="293" font-size="12.5" fill="#1f2933">Fármacos (benzodiacepinas,</text>
<text x="704" y="310" font-size="12.5" fill="#1f2933">  anticolinérgicos, opioides)</text>
<text x="704" y="327" font-size="12.5" fill="#1f2933">Infección, hipoxemia, dolor</text>
<text x="704" y="344" font-size="12.5" fill="#1f2933">Alteraciones metabólicas</text>
<text x="704" y="361" font-size="12.5" fill="#1f2933">Cirugía, UCI, contención física</text>
<text x="704" y="378" font-size="12.5" fill="#1f2933">Sonda vesical, retención urinaria,</text>
<text x="704" y="395" font-size="12.5" fill="#1f2933">  constipación, privación de sueño</text>
<text x="14" y="550" font-size="11.5" fill="#52606d">Esquema propio basado en el modelo multifactorial de Inouye: cuanto mayor la vulnerabilidad, menor la noxa necesaria para desencadenar un delirium.</text>
</svg>