<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="980" height="470" fill="#ffffff"/>
<text x="490.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Curso del tétanos generalizado</text>
<rect x="70.0" y="70" width="107.5" height="30" fill="#eef1f4" stroke="#cbd2d9"/>
<rect x="177.5" y="70" width="30.7" height="30" fill="#fff4e5" stroke="#cbd2d9"/>
<rect x="208.2" y="70" width="322.5" height="30" fill="#fdecea" stroke="#cbd2d9"/>
<rect x="315.7" y="100" width="215.0" height="12" fill="#d9c2ee" stroke="#b79ad6"/>
<rect x="530.7" y="70" width="399.3" height="30" fill="#e8f4ec" stroke="#cbd2d9"/>
<line x1="70.0" y1="112" x2="70.0" y2="118" stroke="#52606d"/>
<text x="70.0" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">0</text>
<line x1="177.5" y1="112" x2="177.5" y2="118" stroke="#52606d"/>
<text x="177.5" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">7</text>
<line x1="285.0" y1="112" x2="285.0" y2="118" stroke="#52606d"/>
<text x="285.0" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">14</text>
<line x1="392.5" y1="112" x2="392.5" y2="118" stroke="#52606d"/>
<text x="392.5" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">21</text>
<line x1="500.0" y1="112" x2="500.0" y2="118" stroke="#52606d"/>
<text x="500.0" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">28</text>
<line x1="607.5" y1="112" x2="607.5" y2="118" stroke="#52606d"/>
<text x="607.5" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">35</text>
<line x1="715.0" y1="112" x2="715.0" y2="118" stroke="#52606d"/>
<text x="715.0" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">42</text>
<line x1="822.5" y1="112" x2="822.5" y2="118" stroke="#52606d"/>
<text x="822.5" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">49</text>
<line x1="930.0" y1="112" x2="930.0" y2="118" stroke="#52606d"/>
<text x="930.0" y="132" text-anchor="middle" font-size="11.5" fill="#52606d">56</text>
<text x="500.0" y="148" text-anchor="middle" font-size="12" fill="#52606d">Días desde la herida (ilustrativo)</text>
<text x="74.0" y="90" font-size="12" fill="#1f2933">Herida</text>
<rect x="24.0" y="176" width="180.0" height="140" rx="9" fill="#eef1f4" stroke="#52606d" stroke-width="1.5"/>
<text x="34.0" y="198" font-size="13" font-weight="700" fill="#52606d">Incubación</text>
<text x="34.0" y="220" font-size="12" fill="#1f2933">3–21 días (mediana ~ 7)</text>
<text x="34.0" y="238" font-size="12" fill="#1f2933">Más corta = más grave</text>
<line x1="123.8" y1="156" x2="114.0" y2="176" stroke="#52606d" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="212.0" y="176" width="180.0" height="140" rx="9" fill="#fff4e5" stroke="#c77d0a" stroke-width="1.5"/>
<text x="222.0" y="198" font-size="13" font-weight="700" fill="#c77d0a">Inicio</text>
<text x="222.0" y="220" font-size="12" fill="#1f2933">Del 1.er síntoma al</text>
<text x="222.0" y="238" font-size="12" fill="#1f2933">1.er espasmo: &lt; 48 h</text>
<text x="222.0" y="256" font-size="12" fill="#1f2933">= mal pronóstico</text>
<line x1="192.9" y1="156" x2="302.0" y2="176" stroke="#c77d0a" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="400.0" y="176" width="180.0" height="140" rx="9" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="410.0" y="198" font-size="13" font-weight="700" fill="#b3261e">Espasmos (1.ª–2.ª semana)</text>
<text x="410.0" y="220" font-size="12" fill="#1f2933">Trismus, risa sardónica,</text>
<text x="410.0" y="238" font-size="12" fill="#1f2933">rigidez de nuca y abdomen,</text>
<text x="410.0" y="256" font-size="12" fill="#1f2933">opistótonos; espasmos con</text>
<text x="410.0" y="274" font-size="12" fill="#1f2933">ruido o tacto; laringoespasmo</text>
<line x1="369.5" y1="156" x2="490.0" y2="176" stroke="#b3261e" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="588.0" y="176" width="180.0" height="140" rx="9" fill="#f3e8fb" stroke="#6b3fa0" stroke-width="1.5"/>
<text x="598.0" y="198" font-size="13" font-weight="700" fill="#6b3fa0">Disautonomía (2.ª semana)</text>
<text x="598.0" y="220" font-size="12" fill="#1f2933">HTA y taquicardia lábiles</text>
<text x="598.0" y="238" font-size="12" fill="#1f2933">que alternan con hipotensión</text>
<text x="598.0" y="256" font-size="12" fill="#1f2933">y bradicardia; fiebre,</text>
<text x="598.0" y="274" font-size="12" fill="#1f2933">sudoración: causa de muerte</text>
<line x1="423.2" y1="156" x2="678.0" y2="176" stroke="#6b3fa0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="776.0" y="176" width="180.0" height="140" rx="9" fill="#e8f4ec" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="786.0" y="198" font-size="13" font-weight="700" fill="#2e7d4f">Recuperación</text>
<text x="786.0" y="220" font-size="12" fill="#1f2933">4–6 semanas o más: los</text>
<text x="786.0" y="238" font-size="12" fill="#1f2933">espasmos ceden y la rigidez</text>
<text x="786.0" y="256" font-size="12" fill="#1f2933">dura más. La enfermedad</text>
<text x="786.0" y="274" font-size="12" fill="#1f2933">no deja inmunidad: vacunar</text>
<line x1="730.4" y1="156" x2="866.0" y2="176" stroke="#2e7d4f" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="20" y="330" width="940" height="96" rx="10" fill="#fbfcfd" stroke="#1f5f99" stroke-width="1.6"/>
<text x="36" y="354" font-size="14" font-weight="700" fill="#1f5f99">Qué hacer (en paralelo, desde el diagnóstico clínico)</text>
<text x="36" y="378" font-size="12.5" fill="#1f2933">1. UCI, pieza tranquila y vía aérea (intubación o traqueostomía precoz si hay espasmos o disfagia)</text>
<text x="36" y="397" font-size="12.5" fill="#1f2933">2. Inmunoglobulina antitetánica humana IM (neutraliza la toxina que aún no se une) + debridar la herida + metronidazol</text>
<text x="36" y="416" font-size="12.5" fill="#1f2933">3. Benzodiacepinas, sulfato de magnesio y relajantes con ventilación para los espasmos; tratar la disautonomía; vacunar al alta</text>
<text x="20" y="458" font-size="11.5" fill="#52606d">Esquema propio basado en el ACIP (2018), la OMS y Yen y Thwaites (Lancet, 2019). La conciencia se mantiene intacta durante los espasmos, que son muy dolorosos.</text>
</svg>