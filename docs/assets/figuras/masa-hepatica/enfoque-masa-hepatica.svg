<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="524" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Masa hepática: enfoque según el contexto</text>
<rect x="250" y="44" width="500" height="50" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="65.3" text-anchor="middle" font-size="12.4" font-weight="700" fill="#1f5f99">Lesión hepática focal en la ecografía o la TC</text>
<text x="500.0" y="81.7" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">¿Tiene cirrosis o hepatitis B crónica? ¿Cáncer conocido? ¿Fiebre?</text>
<line x1="250" y1="112" x2="750" y2="112" stroke="#495057" stroke-width="1.6"/>
<line x1="500" y1="94" x2="500" y2="112" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="250" y1="112" x2="250" y2="130" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="750" y1="112" x2="750" y2="130" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="258" y="126" text-anchor="start" font-size="12.4" font-weight="700" fill="#c92a2a">Cirrosis o VHB</text>
<text x="742" y="126" text-anchor="end" font-size="12.4" font-weight="700" fill="#2f9e44">Hígado sano</text>
<rect x="30" y="130" width="440" height="120" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="250.0" y="153.5" text-anchor="middle" font-size="12.4" font-weight="700" fill="#c92a2a">Sospecha de HEPATOCARCINOMA</text>
<text x="250.0" y="169.9" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Nódulo &lt; 1 cm: ecografía cada 3 meses</text>
<text x="250.0" y="186.3" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Nódulo ≥ 1 cm: TC o RM multifásica con contraste</text>
<text x="250.0" y="202.7" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Realce arterial + lavado venoso (LI-RADS 5):</text>
<text x="250.0" y="219.1" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">HEPATOCARCINOMA sin biopsia</text>
<text x="250.0" y="235.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Atípico: otra técnica o biopsia</text>
<rect x="530" y="130" width="440" height="120" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="750.0" y="153.5" text-anchor="middle" font-size="12.4" font-weight="700" fill="#2f9e44">¿Quística o sólida?</text>
<text x="750.0" y="169.9" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Ecografía y luego TC o RM con contraste</text>
<text x="750.0" y="186.3" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">(RM con contraste hepatobiliar si hay dudas)</text>
<text x="750.0" y="202.7" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Siempre preguntar por anticonceptivos, viajes,</text>
<text x="750.0" y="219.1" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">contacto con perros (hidatidosis), fiebre</text>
<text x="750.0" y="235.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">y antecedente de cáncer</text>
<line x1="250" y1="250" x2="250" y2="268" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="268" width="440" height="180" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="250.0" y="313.3" text-anchor="middle" font-size="12.4" font-weight="700" fill="#e8590c">Etapificación BCLC y equipo multidisciplinario</text>
<text x="250.0" y="329.7" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">0–A (único o ≤ 3 nódulos ≤ 3 cm, buen estado):</text>
<text x="250.0" y="346.1" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">resección, ablación o trasplante (criterios de Milán)</text>
<text x="250.0" y="362.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">B (multinodular, buen estado): quimioembolización</text>
<text x="250.0" y="378.9" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">C (invasión vascular o metástasis): inmunoterapia</text>
<text x="250.0" y="395.3" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">(atezolizumab + bevacizumab, durvalumab + tremelimumab)</text>
<text x="250.0" y="411.7" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">D (Child C, mal estado): cuidados paliativos</text>
<rect x="530" y="268" width="440" height="56" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="590" y="301" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1c7ed6">Quísticas</text>
<text x="660" y="284.0" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">Quiste simple: sin control · septos o nódulos: derivar</text>
<text x="660" y="299.5" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">Hidatídico (Chile): serología, albendazol + cirugía o PAIR</text>
<text x="660" y="315.0" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">Absceso (fiebre): drenaje + antibióticos</text>
<rect x="530" y="330" width="440" height="56" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="590" y="363" text-anchor="middle" font-size="12.8" font-weight="700" fill="#2f9e44">Sólidas benignas</text>
<text x="660" y="346.0" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">Hemangioma típico: sin control ni biopsia</text>
<text x="660" y="361.5" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">Hiperplasia nodular focal (cicatriz central): sin control</text>
<text x="660" y="377.0" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">Adenoma (anticonceptivos): suspender; resecar si ≥ 5 cm</text>
<rect x="530" y="392" width="440" height="56" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.5"/>
<text x="590" y="425" text-anchor="middle" font-size="12.8" font-weight="700" fill="#6741d9">Sólidas malignas</text>
<text x="660" y="408.0" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">Metástasis: la lesión maligna más frecuente en el hígado</text>
<text x="660" y="423.5" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">sano; buscar el primario (colon, páncreas, mama, pulmón)</text>
<text x="660" y="439.0" text-anchor="start" font-size="11.8" font-weight="400" fill="#1f2933">y biopsiar · colangiocarcinoma intrahepático</text>
<line x1="750" y1="250" x2="750" y2="268" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="462" width="940" height="50" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="500.0" y="483.3" text-anchor="middle" font-size="12.2" font-weight="700" fill="#495057">Regla práctica</text>
<text x="500.0" y="499.7" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">En el cirrótico, todo nódulo nuevo es un hepatocarcinoma hasta demostrar lo contrario · En el hígado sano, la mayoría de las lesiones incidentales son benignas</text>
</svg>