<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="760" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Reumatismos de partes blandas: dónde duele y qué buscar</text>
<circle cx="500" cy="92" r="36" fill="#d9e2ec"/>
<line x1="500" y1="120" x2="500" y2="150" stroke="#d9e2ec" stroke-width="26" stroke-linecap="round"/>
<rect x="428" y="145" width="144" height="230" rx="40" fill="#d9e2ec"/>
<line x1="430" y1="165" x2="390" y2="285" stroke="#d9e2ec" stroke-width="30" stroke-linecap="round"/>
<line x1="390" y1="285" x2="370" y2="395" stroke="#d9e2ec" stroke-width="26" stroke-linecap="round"/>
<line x1="570" y1="165" x2="610" y2="285" stroke="#d9e2ec" stroke-width="30" stroke-linecap="round"/>
<line x1="610" y1="285" x2="630" y2="395" stroke="#d9e2ec" stroke-width="26" stroke-linecap="round"/>
<ellipse cx="367" cy="420" rx="16" ry="24" fill="#d9e2ec"/>
<ellipse cx="633" cy="420" rx="16" ry="24" fill="#d9e2ec"/>
<line x1="462" y1="370" x2="452" y2="545" stroke="#d9e2ec" stroke-width="38" stroke-linecap="round"/>
<line x1="452" y1="545" x2="448" y2="700" stroke="#d9e2ec" stroke-width="32" stroke-linecap="round"/>
<line x1="538" y1="370" x2="548" y2="545" stroke="#d9e2ec" stroke-width="38" stroke-linecap="round"/>
<line x1="548" y1="545" x2="552" y2="700" stroke="#d9e2ec" stroke-width="32" stroke-linecap="round"/>
<ellipse cx="438" cy="712" rx="26" ry="11" fill="#d9e2ec"/>
<ellipse cx="562" cy="712" rx="26" ry="11" fill="#d9e2ec"/>
<line x1="425" y1="170" x2="320" y2="64" stroke="#b3261e" stroke-width="1.5"/>
<circle cx="425" cy="170" r="7" fill="#b3261e" stroke="#ffffff" stroke-width="2"/>
<rect x="20" y="46" width="300" height="116" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/>
<text x="30" y="65" font-size="13.5" font-weight="700" fill="#b3261e">Hombro doloroso</text>
<text x="30" y="83" font-size="12.3" fill="#1f2933">Manguito rotador o bursitis subacromial:</text>
<text x="30" y="99" font-size="12.3" fill="#1f2933">dolor lateral, arco doloroso (60–120°),</text>
<text x="30" y="115" font-size="12.3" fill="#1f2933">peor de noche al acostarse sobre él.</text>
<text x="30" y="131" font-size="12.3" fill="#1f2933">Capsulitis adhesiva: rigidez global con</text>
<text x="30" y="147" font-size="12.3" fill="#1f2933">rotación externa pasiva muy limitada</text>
<line x1="388" y1="285" x2="320" y2="192" stroke="#1f5f99" stroke-width="1.5"/>
<circle cx="388" cy="285" r="7" fill="#1f5f99" stroke="#ffffff" stroke-width="2"/>
<rect x="20" y="174" width="300" height="100" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.6"/>
<text x="30" y="193" font-size="13.5" font-weight="700" fill="#1f5f99">Codo</text>
<text x="30" y="211" font-size="12.3" fill="#1f2933">Epicondilalgia lateral ("de tenista"): dolor</text>
<text x="30" y="227" font-size="12.3" fill="#1f2933">al extender la muñeca contra resistencia.</text>
<text x="30" y="243" font-size="12.3" fill="#1f2933">Epitrocleítis ("de golfista"): al flectarla.</text>
<text x="30" y="259" font-size="12.3" fill="#1f2933">Bursitis olecraneana: si hay calor → puncionar</text>
<line x1="460" y1="395" x2="320" y2="304" stroke="#2e7d4f" stroke-width="1.5"/>
<circle cx="460" cy="395" r="7" fill="#2e7d4f" stroke="#ffffff" stroke-width="2"/>
<rect x="20" y="286" width="300" height="84" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="30" y="305" font-size="13.5" font-weight="700" fill="#2e7d4f">Cadera lateral</text>
<text x="30" y="323" font-size="12.3" fill="#1f2933">Síndrome del trocánter mayor (bursitis</text>
<text x="30" y="339" font-size="12.3" fill="#1f2933">trocantérica): dolor al acostarse de lado,</text>
<text x="30" y="355" font-size="12.3" fill="#1f2933">palpación dolorosa del trocánter</text>
<line x1="452" y1="548" x2="320" y2="400" stroke="#c28a12" stroke-width="1.5"/>
<circle cx="452" cy="548" r="7" fill="#c28a12" stroke="#ffffff" stroke-width="2"/>
<rect x="20" y="382" width="300" height="116" rx="8" fill="#ffffff" stroke="#c28a12" stroke-width="1.6"/>
<text x="30" y="401" font-size="13.5" font-weight="700" fill="#c28a12">Rodilla</text>
<text x="30" y="419" font-size="12.3" fill="#1f2933">Artrosis: dolor mecánico, crujidos, rigidez</text>
<text x="30" y="435" font-size="12.3" fill="#1f2933">&lt; 30 min, &gt; 50 años.</text>
<text x="30" y="451" font-size="12.3" fill="#1f2933">Bursitis prerrotuliana (arrodillarse) y</text>
<text x="30" y="467" font-size="12.3" fill="#1f2933">anserina (cara medial, bajo la interlínea).</text>
<text x="30" y="483" font-size="12.3" fill="#1f2933">Quiste de Baker (hueco poplíteo)</text>
<line x1="440" y1="706" x2="320" y2="528" stroke="#b3261e" stroke-width="1.5"/>
<circle cx="440" cy="706" r="7" fill="#b3261e" stroke="#ffffff" stroke-width="2"/>
<rect x="20" y="510" width="300" height="84" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/>
<text x="30" y="529" font-size="13.5" font-weight="700" fill="#b3261e">Talón y tobillo</text>
<text x="30" y="547" font-size="12.3" fill="#1f2933">Fascitis plantar: dolor al primer paso de la</text>
<text x="30" y="563" font-size="12.3" fill="#1f2933">mañana, en la inserción en el calcáneo.</text>
<text x="30" y="579" font-size="12.3" fill="#1f2933">Tendinopatía aquiliana (fluoroquinolonas)</text>
<line x1="628" y1="398" x2="680" y2="164" stroke="#1f5f99" stroke-width="1.5"/>
<circle cx="628" cy="398" r="7" fill="#1f5f99" stroke="#ffffff" stroke-width="2"/>
<rect x="680" y="146" width="300" height="84" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.6"/>
<text x="690" y="165" font-size="13.5" font-weight="700" fill="#1f5f99">Muñeca (borde radial)</text>
<text x="690" y="183" font-size="12.3" fill="#1f2933">Tenosinovitis de De Quervain: dolor en la</text>
<text x="690" y="199" font-size="12.3" fill="#1f2933">estiloides radial; Finkelstein positivo</text>
<text x="690" y="215" font-size="12.3" fill="#1f2933">(madres de lactantes, uso repetitivo)</text>
<line x1="636" y1="425" x2="680" y2="260" stroke="#b3261e" stroke-width="1.5"/>
<circle cx="636" cy="425" r="7" fill="#b3261e" stroke="#ffffff" stroke-width="2"/>
<rect x="680" y="242" width="300" height="116" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/>
<text x="690" y="261" font-size="13.5" font-weight="700" fill="#b3261e">Túnel carpiano</text>
<text x="690" y="279" font-size="12.3" fill="#1f2933">Parestesias nocturnas de los dedos 1.º a 3.º,</text>
<text x="690" y="295" font-size="12.3" fill="#1f2933">mejoran al sacudir la mano; Phalen y Tinel;</text>
<text x="690" y="311" font-size="12.3" fill="#1f2933">atrofia tenar si es grave. Asociado a embarazo,</text>
<text x="690" y="327" font-size="12.3" fill="#1f2933">hipotiroidismo, diabetes, AR, acromegalia.</text>
<text x="690" y="343" font-size="12.3" fill="#1f2933">Confirmar con electromiografía si se opera</text>
<line x1="640" y1="440" x2="680" y2="388" stroke="#2e7d4f" stroke-width="1.5"/>
<circle cx="640" cy="440" r="7" fill="#2e7d4f" stroke="#ffffff" stroke-width="2"/>
<rect x="680" y="370" width="300" height="84" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="690" y="389" font-size="13.5" font-weight="700" fill="#2e7d4f">Mano</text>
<text x="690" y="407" font-size="12.3" fill="#1f2933">Dedo en gatillo: nódulo en la polea A1 con</text>
<text x="690" y="423" font-size="12.3" fill="#1f2933">bloqueo en flexión (diabetes).</text>
<text x="690" y="439" font-size="12.3" fill="#1f2933">Rizartrosis: base del pulgar (artrosis)</text>
<line x1="546" y1="470" x2="680" y2="484" stroke="#c28a12" stroke-width="1.5"/>
<circle cx="546" cy="470" r="7" fill="#c28a12" stroke="#ffffff" stroke-width="2"/>
<rect x="680" y="466" width="300" height="116" rx="8" fill="#ffffff" stroke="#c28a12" stroke-width="1.6"/>
<text x="690" y="485" font-size="13.5" font-weight="700" fill="#c28a12">Fibromialgia (dolor generalizado)</text>
<text x="690" y="503" font-size="12.3" fill="#1f2933">Dolor en ≥ 4 de 5 regiones por ≥ 3 meses,</text>
<text x="690" y="519" font-size="12.3" fill="#1f2933">fatiga, sueño no reparador, síntomas</text>
<text x="690" y="535" font-size="12.3" fill="#1f2933">cognitivos. Examen articular y exámenes</text>
<text x="690" y="551" font-size="12.3" fill="#1f2933">normales. Se diagnostica en positivo, aunque</text>
<text x="690" y="567" font-size="12.3" fill="#1f2933">coexista con otra enfermedad (ACR 2016)</text>
<rect x="680" y="598" width="300" height="110" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.6"/>
<text x="690" y="620" font-size="12.5" font-weight="700" fill="#1f2933">ALARMA: no es partes blandas si hay</text>
<text x="690" y="637" font-size="12.5" font-weight="400" fill="#1f2933">fiebre, calor articular (artritis séptica),</text>
<text x="690" y="654" font-size="12.5" font-weight="400" fill="#1f2933">déficit neurológico progresivo, dolor de</text>
<text x="690" y="671" font-size="12.5" font-weight="400" fill="#1f2933">hombro con disnea o sudoración (IAM),</text>
<text x="690" y="688" font-size="12.5" font-weight="400" fill="#1f2933">o pérdida de peso (tumor)</text>
<text x="980" y="748" text-anchor="end" font-size="11.5" fill="#7b8794">Esquema propio basado en revisiones de hombro, codo y túnel carpiano (Padua 2023) y en los criterios ACR 2016 de fibromialgia.</text>
</svg>