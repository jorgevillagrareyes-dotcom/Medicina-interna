<text x="170" y="346" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Polineuropatía</text>
<text x="170" y="366" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">Distal y simétrica: «guante y calcetín»</text>
<text x="170" y="383" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">Aquilianos abolidos; empieza en los pies</text>
<text x="500" y="346" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Radiculopatía (L5 derecha)</text>
<text x="500" y="366" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">Dermatoma: cara lateral de la pierna y dorso</text>
<text x="500" y="383" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">del pie; dolor irradiado; Lasègue positivo</text>
<text x="830" y="346" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Mielopatía transversa (nivel T10)</text>
<text x="830" y="366" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">Nivel sensitivo bilateral + paraparesia</text>
<text x="830" y="383" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">y retención urinaria: urgencia (RM)</text>
<text x="170" y="706" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Hemisección medular derecha (Brown-Séquard)</text>
<text x="170" y="726" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">Lado de la lesión: debilidad y pérdida de</text>
<text x="170" y="743" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">propiocepción; lado opuesto: dolor y temperatura</text>
<text x="500" y="706" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Bulbo lateral derecho (Wallenberg)</text>
<text x="500" y="726" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">Cara del lado de la lesión + cuerpo del lado</text>
<text x="500" y="743" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">opuesto (dolor y temperatura); vértigo, ataxia</text>
<text x="830" y="706" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Tálamo o hemisferio (izquierdo)</text>
<text x="830" y="726" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">Hemicuerpo opuesto completo, con la cara;</text>
<text x="830" y="743" text-anchor="middle" font-size="12.8" font-weight="400" fill="#343a40">puede dejar dolor talámico (Déjérine-Roussy)</text>
<rect x="95" y="778" width="22" height="14" fill="#3b82c4" opacity="0.85"/>
<text x="125" y="790" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Todas las modalidades</text>
<rect x="310" y="778" width="22" height="14" fill="#f08c00" opacity="0.85"/>
<text x="340" y="790" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Dolor y temperatura</text>
