<text x="555" y="790" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Propiocepción y vibración</text>
<rect x="740" y="778" width="22" height="14" fill="none" stroke="#c92a2a" stroke-width="2.6"/>
<text x="770" y="790" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Debilidad (motora)</text>
