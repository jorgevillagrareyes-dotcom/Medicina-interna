<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 654" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="960" height="654" fill="#ffffff"/>
<text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">Enfoque de la hernia de la pared abdominal</text>
<rect x="330" y="50" width="300" height="54" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="480.0" y="73.3" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Aumento de volumen reductible</text>
<text x="480.0" y="89.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">que aumenta con Valsalva</text>
<rect x="250" y="122" width="460" height="70" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="480.0" y="145.2" text-anchor="middle" font-size="12.6" font-weight="700" fill="#c92a2a">¿Irreductible, dolorosa, con vómitos,</text>
<text x="480.0" y="161.4" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">eritema o signos de obstrucción?</text>
<text x="480.0" y="177.6" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Sí: hernia atascada o estrangulada → cirugía urgente</text>
<line x1="480" y1="104" x2="480" y2="120" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="480" y1="192" x2="480" y2="206" stroke="#495057" stroke-width="1.6"/>
<line x1="170" y1="206" x2="790" y2="206" stroke="#495057" stroke-width="1.6"/>
<line x1="170.0" y1="206" x2="170.0" y2="222" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="480.0" y1="206" x2="480.0" y2="222" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="790.0" y1="206" x2="790.0" y2="222" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="20" y="224" width="300" height="38" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="170.0" y="247.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5f99">Inguinal y crural</text>
<rect x="20" y="274" width="300" height="54.4" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.6"/>
<text x="170.0" y="289.4" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f5f99">Hombre asintomático o con</text>
<text x="170.0" y="305.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">síntomas mínimos: espera vigilada</text>
<text x="170.0" y="321.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">(informar riesgo de atascamiento)</text>
<rect x="20" y="338.4" width="300" height="70.6" rx="8" fill="#f8f9fa" stroke="#1f5f99" stroke-width="1.6"/>
<text x="170.0" y="353.8" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f5f99">Sintomática</text>
<text x="170.0" y="370.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Reparación con malla:</text>
<text x="170.0" y="386.2" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Lichtenstein (abierta) o</text>
<text x="170.0" y="402.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">TEP/TAPP (laparoscópica)</text>
<rect x="20" y="419.0" width="300" height="54.4" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.6"/>
<text x="170.0" y="434.4" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f5f99">Mujer</text>
<text x="170.0" y="450.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Laparoscópica con malla</text>
<text x="170.0" y="466.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">preperitoneal (no omitir una crural)</text>
<rect x="20" y="483.4" width="300" height="54.4" rx="8" fill="#f8f9fa" stroke="#1f5f99" stroke-width="1.6"/>
<text x="170.0" y="498.8" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1f5f99">Hernia crural (femoral)</text>
<text x="170.0" y="515.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Operar siempre y pronto:</text>
<text x="170.0" y="531.2" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">alto riesgo de estrangulación</text>
<rect x="330" y="224" width="300" height="38" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="480.0" y="247.4" text-anchor="middle" font-size="14" font-weight="700" fill="#e8590c">Umbilical y epigástrica</text>
<rect x="330" y="274" width="300" height="38.2" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="480.0" y="289.4" text-anchor="middle" font-size="12.2" font-weight="700" fill="#e8590c">Asintomática y pequeña</text>
<text x="480.0" y="305.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Espera vigilada razonable</text>
<rect x="330" y="322.2" width="300" height="54.4" rx="8" fill="#f8f9fa" stroke="#e8590c" stroke-width="1.6"/>
<text x="480.0" y="337.6" text-anchor="middle" font-size="12.2" font-weight="700" fill="#e8590c">Sintomática</text>
<text x="480.0" y="353.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Reparación abierta con</text>
<text x="480.0" y="370.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">malla plana preperitoneal</text>
<rect x="330" y="386.6" width="300" height="54.4" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="480.0" y="402.0" text-anchor="middle" font-size="12.2" font-weight="700" fill="#e8590c">Defecto grande o riesgo</text>
<text x="480.0" y="418.2" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">de complicación de la herida:</text>
<text x="480.0" y="434.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">considerar laparoscopía</text>
<rect x="330" y="451.0" width="300" height="54.4" rx="8" fill="#f8f9fa" stroke="#e8590c" stroke-width="1.6"/>
<text x="480.0" y="466.4" text-anchor="middle" font-size="12.2" font-weight="700" fill="#e8590c">Cirrosis con ascitis</text>
<text x="480.0" y="482.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Controlar la ascitis antes;</text>
<text x="480.0" y="498.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">riesgo de rotura y peritonitis</text>
<rect x="640" y="224" width="300" height="38" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="790.0" y="247.4" text-anchor="middle" font-size="14" font-weight="700" fill="#7048e8">Incisional (eventración)</text>
<rect x="640" y="274" width="300" height="54.4" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.6"/>
<text x="790.0" y="289.4" text-anchor="middle" font-size="12.2" font-weight="700" fill="#7048e8">Diagnóstico</text>
<text x="790.0" y="305.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Examen físico; TC o RM si hay duda</text>
<text x="790.0" y="321.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">y siempre antes de operar</text>
<rect x="640" y="338.4" width="300" height="54.4" rx="8" fill="#f8f9fa" stroke="#7048e8" stroke-width="1.6"/>
<text x="790.0" y="353.8" text-anchor="middle" font-size="12.2" font-weight="700" fill="#7048e8">Preoptimizar</text>
<text x="790.0" y="370.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Bajar de peso, dejar de fumar,</text>
<text x="790.0" y="386.2" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">controlar la diabetes (HbA1c)</text>
<rect x="640" y="402.79999999999995" width="300" height="54.4" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.6"/>
<text x="790.0" y="418.2" text-anchor="middle" font-size="12.2" font-weight="700" fill="#7048e8">Reparación</text>
<text x="790.0" y="434.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Con malla, idealmente</text>
<text x="790.0" y="450.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">retromuscular</text>
<rect x="640" y="467.19999999999993" width="300" height="54.4" rx="8" fill="#f8f9fa" stroke="#7048e8" stroke-width="1.6"/>
<text x="790.0" y="482.6" text-anchor="middle" font-size="12.2" font-weight="700" fill="#7048e8">Prevención</text>
<text x="790.0" y="498.8" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Cierre de laparotomía con</text>
<text x="790.0" y="515.0" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">puntos pequeños (small bites)</text>
<rect x="20" y="556" width="920" height="58" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="480.0" y="581.3" text-anchor="middle" font-size="12.6" font-weight="700" fill="#c92a2a">Evisceración (dehiscencia de la laparotomía con salida de asas)</text>
<text x="480.0" y="597.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Urgencia: cubrir con compresas estériles húmedas, no reintroducir las asas, régimen cero, antibióticos y reoperar</text>
<text x="480" y="640" text-anchor="middle" font-size="11.5" font-weight="400" fill="#495057">Esquema propio basado en HerniaSurge 2018 y 2023, guías EHS/AHS de hernia umbilical y epigástrica (2020) y de hernia incisional (2023).</text>
</svg>