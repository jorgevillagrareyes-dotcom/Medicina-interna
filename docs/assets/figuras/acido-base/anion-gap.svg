<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="480.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Anión gap: balance de cargas del plasma (gamblegrama)</text>
<text x="160" y="62" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2933">Normal</text>
<rect x="76" y="100.0" width="78" height="280.0" fill="#d9e6e8" stroke="#ffffff" stroke-width="1.5"/>
<text x="115.0" y="238.0" text-anchor="middle" font-size="14" font-weight="700" fill="#12474f">Na⁺</text>
<text x="115.0" y="254.0" text-anchor="middle" font-size="12.5" fill="#12474f">140</text>
<rect x="166" y="172.0" width="78" height="208.0" fill="#b9cfd3" stroke="#ffffff" stroke-width="1.5"/>
<text x="205.0" y="274.0" text-anchor="middle" font-size="14" font-weight="700" fill="#12474f">Cl⁻</text>
<text x="205.0" y="290.0" text-anchor="middle" font-size="12.5" fill="#12474f">104</text>
<rect x="166" y="124.0" width="78" height="48.0" fill="#f6d58e" stroke="#ffffff" stroke-width="1.5"/>
<text x="205.0" y="146.0" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4a00">HCO₃⁻</text>
<text x="205.0" y="162.0" text-anchor="middle" font-size="12.5" fill="#6b4a00">24</text>
<rect x="166" y="100.0" width="78" height="24.0" fill="#f2b8b0" stroke="#ffffff" stroke-width="1.5"/>
<text x="251" y="117.0" font-size="13.5" font-weight="700" fill="#8a1c14">AG 12</text>
<text x="115.0" y="398" text-anchor="middle" font-size="12.5" fill="#52606d">cationes</text>
<text x="205.0" y="398" text-anchor="middle" font-size="12.5" fill="#52606d">aniones</text>
<text x="160" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12474f">AG = 140 − (104 + 24) = 12</text>
<text x="480" y="62" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2933">Acidosis con AG elevado</text>
<rect x="396" y="100.0" width="78" height="280.0" fill="#d9e6e8" stroke="#ffffff" stroke-width="1.5"/>
<text x="435.0" y="238.0" text-anchor="middle" font-size="14" font-weight="700" fill="#12474f">Na⁺</text>
<text x="435.0" y="254.0" text-anchor="middle" font-size="12.5" fill="#12474f">140</text>
<rect x="486" y="172.0" width="78" height="208.0" fill="#b9cfd3" stroke="#ffffff" stroke-width="1.5"/>
<text x="525.0" y="274.0" text-anchor="middle" font-size="14" font-weight="700" fill="#12474f">Cl⁻</text>
<text x="525.0" y="290.0" text-anchor="middle" font-size="12.5" fill="#12474f">104</text>
<rect x="486" y="152.0" width="78" height="20.0" fill="#f6d58e" stroke="#ffffff" stroke-width="1.5"/>
<text x="571" y="167.0" font-size="13.5" font-weight="700" fill="#6b4a00">HCO₃⁻ 10</text>
<rect x="486" y="100.0" width="78" height="52.0" fill="#f2b8b0" stroke="#ffffff" stroke-width="1.5"/>
<text x="525.0" y="124.0" text-anchor="middle" font-size="14" font-weight="700" fill="#8a1c14">AG</text>
<text x="525.0" y="140.0" text-anchor="middle" font-size="12.5" fill="#8a1c14">26</text>
<text x="435.0" y="398" text-anchor="middle" font-size="12.5" fill="#52606d">cationes</text>
<text x="525.0" y="398" text-anchor="middle" font-size="12.5" fill="#52606d">aniones</text>
<text x="480" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12474f">AG = 140 − (104 + 10) = 26</text>
<text x="480" y="438" text-anchor="middle" font-size="12" fill="#52606d">El HCO₃ se gasta tamponando un ácido cuyo</text>
<text x="480" y="453" text-anchor="middle" font-size="12" fill="#52606d">anión no se mide (lactato, cetoácidos,</text>
<text x="480" y="468" text-anchor="middle" font-size="12" fill="#52606d">tóxicos): sube el AG, el Cl no cambia.</text>
<text x="800" y="62" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2933">Acidosis hiperclorémica (AG normal)</text>
<rect x="716" y="100.0" width="78" height="280.0" fill="#d9e6e8" stroke="#ffffff" stroke-width="1.5"/>
<text x="755.0" y="238.0" text-anchor="middle" font-size="14" font-weight="700" fill="#12474f">Na⁺</text>
<text x="755.0" y="254.0" text-anchor="middle" font-size="12.5" fill="#12474f">140</text>
<rect x="806" y="144.0" width="78" height="236.0" fill="#b9cfd3" stroke="#ffffff" stroke-width="1.5"/>
<text x="845.0" y="260.0" text-anchor="middle" font-size="14" font-weight="700" fill="#12474f">Cl⁻</text>
<text x="845.0" y="276.0" text-anchor="middle" font-size="12.5" fill="#12474f">118</text>
<rect x="806" y="124.0" width="78" height="20.0" fill="#f6d58e" stroke="#ffffff" stroke-width="1.5"/>
<text x="891" y="139.0" font-size="13.5" font-weight="700" fill="#6b4a00">HCO₃⁻ 10</text>
<rect x="806" y="100.0" width="78" height="24.0" fill="#f2b8b0" stroke="#ffffff" stroke-width="1.5"/>
<text x="891" y="117.0" font-size="13.5" font-weight="700" fill="#8a1c14">AG 12</text>
<text x="755.0" y="398" text-anchor="middle" font-size="12.5" fill="#52606d">cationes</text>
<text x="845.0" y="398" text-anchor="middle" font-size="12.5" fill="#52606d">aniones</text>
<text x="800" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12474f">AG = 140 − (118 + 10) = 12</text>
<text x="800" y="438" text-anchor="middle" font-size="12" fill="#52606d">Se pierde HCO₃ (diarrea, acidosis tubular) y</text>
<text x="800" y="453" text-anchor="middle" font-size="12" fill="#52606d">el riñón retiene Cl: el AG no cambia.</text>
<text x="14" y="512" font-size="11.5" fill="#52606d">Esquema propio. Valores en mEq/L. AG: anión gap (aniones no medidos: sobre todo albúmina, además fosfato, sulfato y ácidos orgánicos).</text>
</svg>