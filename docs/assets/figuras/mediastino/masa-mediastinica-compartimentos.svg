<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 536" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="536" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">Masa mediastínica: diagnóstico diferencial según el compartimento (ITMIG)</text>
<rect x="30" y="46" width="300" height="214" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="180.0" y="84.5" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c">PREVASCULAR (anterior)</text>
<text x="42" y="100.7" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">Más de la mitad de las masas</text>
<text x="42" y="116.9" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">Las "4 T":</text>
<text x="42" y="133.1" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Timo: TIMOMA, carcinoma tímico,</text>
<text x="52" y="149.3" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">hiperplasia, quiste</text>
<text x="42" y="165.5" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• "Terrible" linfoma (Hodgkin,</text>
<text x="52" y="181.7" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">linfoma B primario mediastínico)</text>
<text x="42" y="197.9" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Teratoma y tumores germinales</text>
<text x="52" y="214.1" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">(seminoma, no seminomatoso)</text>
<text x="42" y="230.3" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Tiroides: bocio endotorácico</text>
<rect x="350" y="46" width="300" height="214" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="84.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5f99">VISCERAL (medio)</text>
<text x="362" y="100.7" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• ADENOPATÍAS: cáncer pulmonar,</text>
<text x="372" y="116.9" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">linfoma, TBC, sarcoidosis,</text>
<text x="372" y="133.1" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">silicosis, metástasis</text>
<text x="362" y="149.3" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Quistes broncogénicos y de</text>
<text x="372" y="165.5" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">duplicación esofágica</text>
<text x="362" y="181.7" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Esófago: cáncer, acalasia,</text>
<text x="372" y="197.9" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">hernia hiatal</text>
<text x="362" y="214.1" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Vasos: aneurisma aórtico</text>
<text x="362" y="230.3" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Corazón y pericardio</text>
<rect x="670" y="46" width="300" height="214" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="820.0" y="84.5" text-anchor="middle" font-size="12" font-weight="700" fill="#7048e8">PARAVERTEBRAL (posterior)</text>
<text x="682" y="100.7" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Tumores NEUROGÉNICOS:</text>
<text x="692" y="116.9" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">schwannoma, neurofibroma</text>
<text x="692" y="133.1" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">(adultos); neuroblastoma y</text>
<text x="692" y="149.3" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">ganglioneuroma (niños)</text>
<text x="682" y="165.5" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Hematopoyesis extramedular</text>
<text x="692" y="181.7" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">(talasemia, mielofibrosis)</text>
<text x="682" y="197.9" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Absceso paravertebral (TBC,</text>
<text x="692" y="214.1" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">espondilodiscitis)</text>
<text x="682" y="230.3" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Meningocele, tumores óseos</text>
<line x1="500" y1="260" x2="500" y2="276" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="276" width="940" height="66" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="500.0" y="297.2" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">Estudio inicial</text>
<text x="500.0" y="313.4" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">TC de tórax CON CONTRASTE (localiza, mide densidad: grasa, calcio, líquido, partes blandas) · RM si la TC no aclara (quistes, hiperplasia tímica)</text>
<text x="500.0" y="329.6" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Hombre joven con masa anterior: α-fetoproteína, β-hCG y LDH · Miastenia: anti-AChR · Linfoma: LDH, hemograma, PET-TC · Bocio: TSH</text>
<line x1="500" y1="342" x2="500" y2="358" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="358" width="460" height="100" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="260.0" y="380.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44">Pueden ir directo a CIRUGÍA (sin biopsia)</text>
<text x="42" y="396.2" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Timoma pequeño, bien delimitado y resecable</text>
<text x="42" y="412.4" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Teratoma maduro (grasa + calcio + quiste)</text>
<text x="42" y="428.6" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Tumor neurogénico paravertebral</text>
<text x="42" y="444.8" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Quiste broncogénico sintomático</text>
<rect x="510" y="358" width="460" height="100" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="740.0" y="380.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c92a2a">Requieren BIOPSIA antes del tratamiento</text>
<text x="522" y="396.2" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Sospecha de LINFOMA (se trata con quimioterapia)</text>
<text x="522" y="412.4" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Tumor germinal (si los marcadores no bastan)</text>
<text x="522" y="428.6" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Masa infiltrante o irresecable, adenopatías</text>
<text x="532" y="444.8" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">(EBUS, mediastinoscopia, biopsia por TC)</text>
<rect x="30" y="472" width="940" height="50" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="500.0" y="493.3" text-anchor="middle" font-size="12" font-weight="700" fill="#c92a2a">Alarma: masa mediastínica grande + ortopnea, estridor o síndrome de vena cava superior</text>
<text x="500.0" y="509.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Riesgo de colapso de la vía aérea con la sedación o la anestesia general: evaluar antes con anestesia; biopsia con anestesia local si es posible</text>
</svg>