<text x="822.6666666666667" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Observar sin tratar ("watch and wait")</text>
<text x="822.6666666666667" y="373" text-anchor="middle" font-size="12" fill="#ffffff">control ecográfico; reactivación rara</text>
<rect x="19.0" y="390" width="639.3333333333334" height="46" rx="6" fill="#2b8a3e"/>
<text x="338.6666666666667" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Albendazol antes y después de cualquier procedimiento</text>
<text x="338.6666666666667" y="427" text-anchor="middle" font-size="12" fill="#ffffff">400 mg cada 12 h; reduce la siembra si el quiste se rompe</text>
<text x="18" y="468" font-size="12.6" fill="#1f2933">• CL: lesión quística sin signos patognomónicos (diferencial con el quiste simple): estudiar con serología o repetir la imagen.</text>
<text x="18" y="489" font-size="12.6" fill="#1f2933">• Pulmón: la cirugía es de elección y no se hace PAIR. Quistes complicados (rotura a la vía biliar, infección, compresión): cirugía.</text>
