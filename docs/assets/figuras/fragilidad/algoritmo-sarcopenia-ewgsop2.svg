<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker></defs>
<rect width="1000" height="540" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Sarcopenia: buscar, evaluar, confirmar y graduar (EWGSOP2)</text>
<rect x="20" y="60" width="225" height="140" rx="10" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.6"/>
<text x="132.5" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5f99">1. BUSCAR</text>
<text x="132.5" y="112" text-anchor="middle" font-size="12.8" fill="#1f2933">Sospecha clínica: caídas,</text>
<text x="132.5" y="132" text-anchor="middle" font-size="12.8" fill="#1f2933">debilidad, lentitud, baja de</text>
<text x="132.5" y="152" text-anchor="middle" font-size="12.8" fill="#1f2933">peso, dificultad para</text>
<text x="132.5" y="172" text-anchor="middle" font-size="12.8" fill="#1f2933">levantarse; o SARC-F ≥ 4</text>
<line x1="247" y1="120" x2="261" y2="120" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="263" y="60" width="225" height="140" rx="10" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="375.5" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#c28a12">2. EVALUAR la fuerza</text>
<text x="375.5" y="112" text-anchor="middle" font-size="12.8" fill="#1f2933">Prensión: &lt; 27 kg (hombres)</text>
<text x="375.5" y="132" text-anchor="middle" font-size="12.8" fill="#1f2933">o &lt; 16 kg (mujeres)</text>
<text x="375.5" y="152" text-anchor="middle" font-size="12.8" fill="#1f2933">o levantarse 5 veces</text>
<text x="375.5" y="172" text-anchor="middle" font-size="12.8" fill="#1f2933">de la silla en &gt; 15 s</text>
<line x1="490" y1="120" x2="504" y2="120" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="506" y="60" width="225" height="140" rx="10" fill="#fde9dc" stroke="#d9480f" stroke-width="1.6"/>
<text x="618.5" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#d9480f">3. CONFIRMAR la masa</text>
<text x="618.5" y="112" text-anchor="middle" font-size="12.8" fill="#1f2933">Masa apendicular (DXA o</text>
<text x="618.5" y="132" text-anchor="middle" font-size="12.8" fill="#1f2933">bioimpedancia): &lt; 20 kg (H)</text>
<text x="618.5" y="152" text-anchor="middle" font-size="12.8" fill="#1f2933">o &lt; 15 kg (M); índice</text>
<text x="618.5" y="172" text-anchor="middle" font-size="12.8" fill="#1f2933">&lt; 7,0 (H) o &lt; 5,5 kg/m² (M)</text>
<line x1="733" y1="120" x2="747" y2="120" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="749" y="60" width="225" height="140" rx="10" fill="#fde7e5" stroke="#b3261e" stroke-width="1.6"/>
<text x="861.5" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#b3261e">4. GRADUAR (rendimiento)</text>
<text x="861.5" y="112" text-anchor="middle" font-size="12.8" fill="#1f2933">Velocidad de marcha ≤ 0,8 m/s</text>
<text x="861.5" y="132" text-anchor="middle" font-size="12.8" fill="#1f2933">SPPB ≤ 8 puntos</text>
<text x="861.5" y="152" text-anchor="middle" font-size="12.8" fill="#1f2933">Timed Up and Go ≥ 20 s</text>
<text x="861.5" y="172" text-anchor="middle" font-size="12.8" fill="#1f2933">400 m: no completa o ≥ 6 min</text>
<line x1="132.5" y1="200" x2="132.5" y2="228" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="230" width="225" height="54" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.4"/>
<text x="132.5" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5f99">Positiva: seguir al paso 2</text>
<text x="132.5" y="272" text-anchor="middle" font-size="12.8" fill="#1f2933">Negativa: repetir el tamizaje</text>
<line x1="375.5" y1="200" x2="375.5" y2="228" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="263" y="230" width="225" height="54" rx="8" fill="#ffffff" stroke="#c28a12" stroke-width="1.4"/>
<text x="375.5" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#c28a12">Fuerza baja = sarcopenia</text>
<text x="375.5" y="272" text-anchor="middle" font-size="12.8" fill="#1f2933">PROBABLE: ya se puede tratar</text>
<line x1="618.5" y1="200" x2="618.5" y2="228" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="506" y="230" width="225" height="54" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="1.4"/>
<text x="618.5" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#d9480f">Masa baja = sarcopenia</text>
<text x="618.5" y="272" text-anchor="middle" font-size="12.8" fill="#1f2933">CONFIRMADA</text>
<line x1="861.5" y1="200" x2="861.5" y2="228" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="749" y="230" width="225" height="54" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.4"/>
<text x="861.5" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#b3261e">Rendimiento bajo = sarcopenia</text>
<text x="861.5" y="272" text-anchor="middle" font-size="12.8" fill="#1f2933">GRAVE</text>
<rect x="20" y="310" width="470" height="200" rx="10" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="36" y="336" font-size="15" font-weight="700" fill="#1f5f99">SARC-F (0–2 puntos cada ítem; ≥ 4 = sospecha)</text>
<circle cx="48" cy="366" r="11" fill="#1f5f99"/>
<text x="48" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">S</text>
<text x="70" y="371" font-size="13" fill="#1f2933">Fuerza: dificultad para levantar y cargar 4,5 kg</text>
<circle cx="48" cy="396" r="11" fill="#1f5f99"/>
<text x="48" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>
<text x="70" y="401" font-size="13" fill="#1f2933">Ayuda para caminar: dificultad para cruzar una pieza</text>
<circle cx="48" cy="426" r="11" fill="#1f5f99"/>
<text x="48" y="431" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">R</text>
<text x="70" y="431" font-size="13" fill="#1f2933">Levantarse de una silla o de la cama</text>
<circle cx="48" cy="456" r="11" fill="#1f5f99"/>
<text x="48" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C</text>
<text x="70" y="461" font-size="13" fill="#1f2933">Subir 10 peldaños</text>
<circle cx="48" cy="486" r="11" fill="#1f5f99"/>
<text x="48" y="491" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">F</text>
<text x="70" y="491" font-size="13" fill="#1f2933">Caídas en el último año (0, 1–3, ≥ 4)</text>
<rect x="510" y="310" width="470" height="200" rx="10" fill="#e3f5ea" stroke="#2e7d4f"/>
<text x="526" y="336" font-size="15" font-weight="700" fill="#2e7d4f">Tratamiento (sarcopenia y fragilidad)</text>
<text x="530" y="366" font-size="13" fill="#1f2933">• Ejercicio de resistencia progresivo (la base)</text>
<text x="530" y="386" font-size="13" fill="#1f2933">• + entrenamiento multicomponente (equilibrio, aeróbico)</text>
<text x="530" y="406" font-size="13" fill="#1f2933">• Proteínas 1,0–1,2 g/kg/día (1,2–1,5 si hay enfermedad)</text>
<text x="530" y="426" font-size="13" fill="#1f2933">• Tratar la baja de peso y la desnutrición</text>
<text x="530" y="446" font-size="13" fill="#1f2933">• Revisar los fármacos (polifarmacia, sedantes)</text>
<text x="530" y="466" font-size="13" fill="#1f2933">• Vitamina D solo si hay déficit</text>
<text x="530" y="486" font-size="13" fill="#1f2933">• No hay fármacos aprobados para la sarcopenia</text>
<text x="980" y="532" text-anchor="end" font-size="11.5" fill="#7b8794">Esquema propio basado en EWGSOP2 (Cruz-Jentoft 2019), ICFSR (Dent 2019) y PROT-AGE (Bauer 2013).</text>
</svg>