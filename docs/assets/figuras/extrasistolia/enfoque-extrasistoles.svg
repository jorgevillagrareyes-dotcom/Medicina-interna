<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="466" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">Extrasístoles ventriculares: estudio y manejo</text>
<rect x="130" y="44" width="740" height="50" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="65.3" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5f99">1. Detectar</text>
<text x="500.0" y="81.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Palpitaciones ("vuelco", "salto", pausa), pulso irregular · hallazgo en el ECG, el monitor o un reloj inteligente</text>
<line x1="500" y1="94" x2="500" y2="110" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="110" width="940" height="66" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="500.0" y="131.2" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">2. Estudio básico en TODOS</text>
<text x="500.0" y="147.4" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">ECG de 12 derivaciones (morfología) · Holter de 24–48 horas (CARGA = % de los latidos) · ecocardiograma · potasio, magnesio, TSH, hemograma</text>
<text x="500.0" y="163.6" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Preguntar: cafeína, alcohol, estimulantes y drogas, sueño · síncope · muerte súbita en la familia · Chagas (zona endémica) · test de esfuerzo si hay síntomas al ejercicio</text>
<line x1="300" y1="176" x2="300" y2="192" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="700" y1="176" x2="700" y2="192" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="192" width="460" height="178" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="260.0" y="220.6" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44">BENIGNAS (idiopáticas)</text>
<text x="42" y="236.8" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Corazón estructuralmente NORMAL, FEVI normal</text>
<text x="42" y="253.0" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Monomorfas, aisladas; tracto de salida del VD</text>
<text x="52" y="269.2" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">(QRS tipo bloqueo de rama izquierda, eje inferior)</text>
<text x="42" y="285.4" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Disminuyen o desaparecen con el ejercicio</text>
<text x="42" y="301.6" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Sin síncope ni muerte súbita familiar</text>
<text x="42" y="317.8" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">→ Tranquilizar y eliminar gatillantes</text>
<text x="42" y="334.0" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">→ Síntomas: betabloqueador o verapamilo/diltiazem</text>
<text x="42" y="350.2" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">→ Ablación si persisten o si el paciente la prefiere</text>
<rect x="510" y="192" width="460" height="178" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="740.0" y="220.6" text-anchor="middle" font-size="12" font-weight="700" fill="#c92a2a">SIGNOS DE ALARMA → cardiología</text>
<text x="522" y="236.8" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Cardiopatía estructural: infarto previo, miocardiopatía,</text>
<text x="532" y="253.0" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">valvulopatía, Chagas · FEVI baja</text>
<text x="522" y="269.2" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Polimorfas, duplas, TV no sostenida</text>
<text x="522" y="285.4" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Aumentan con el ejercicio · acoplamiento muy corto</text>
<text x="522" y="301.6" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">• Síncope, muerte súbita familiar, ECG basal anormal</text>
<text x="532" y="317.8" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">(QT largo, Brugada, ondas épsilon)</text>
<text x="522" y="334.0" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">→ RM cardíaca, test de esfuerzo, estudio coronario</text>
<text x="522" y="350.2" text-anchor="start" font-size="12" font-weight="400" fill="#1f2933">→ Tratar la cardiopatía; evaluar riesgo de muerte súbita</text>
<line x1="500" y1="370" x2="500" y2="386" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="386" width="940" height="66" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="500.0" y="407.2" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c">Miocardiopatía inducida por extrasístoles</text>
<text x="500.0" y="423.4" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Sospechar si la FEVI está baja sin otra causa y la carga es ≥ 10 % (riesgo mayor sobre 20 %) · ABLACIÓN como primera línea (ESC 2022)</text>
<text x="500.0" y="439.6" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">La FEVI suele recuperarse en meses al suprimir las extrasístoles · carga &gt; 20 % sin síntomas: control con ecocardiograma; ablación opcional</text>
</svg>