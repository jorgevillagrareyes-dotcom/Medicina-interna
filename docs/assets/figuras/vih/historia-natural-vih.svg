<text x="94.0" y="142.6" font-size="12.5" font-weight="700" fill="#1f5f99">CD4</text>
<text x="151.3" y="164.0" font-size="12.5" font-weight="700" fill="#b3261e">Carga viral</text>
<text x="151.3" y="179.0" font-size="11.5" fill="#b3261e">(peak: máximo contagio)</text>
<text x="285.3" y="319.6" font-size="11.5" fill="#b3261e">"set point" viral</text>
<text x="285.3" y="217.7" font-size="11.5" fill="#1f5f99">Caída de ~ 50–100 CD4/µL por año</text>
<text x="148.7" y="367.8" font-size="11.5" fill="#52606d">Síndrome retroviral</text>
<text x="148.7" y="381.8" font-size="11.5" fill="#52606d">agudo (2–4 semanas)</text>
<rect x="686" y="66" width="280" height="384" rx="10" fill="#fbfcfd" stroke="#9aa5b1"/>
<text x="826.0" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Qué aparece según el CD4</text>
<text x="700" y="112" font-size="13" font-weight="700" fill="#3e4c59">Cualquier CD4</text>
<text x="708" y="129" font-size="12" fill="#1f2933">Tuberculosis</text>
<text x="708" y="145" font-size="12" fill="#1f2933">Neumonía neumocócica</text>
<text x="708" y="161" font-size="12" fill="#1f2933">Herpes zóster, sífilis</text>
<text x="700" y="183" font-size="13" font-weight="700" fill="#8a6d5b">&lt; 500</text>
<text x="708" y="200" font-size="12" fill="#1f2933">Candidiasis oral</text>
<text x="708" y="216" font-size="12" fill="#1f2933">Leucoplasia vellosa oral</text>
<text x="708" y="232" font-size="12" fill="#1f2933">Sarcoma de Kaposi</text>
<text x="700" y="254" font-size="13" font-weight="700" fill="#b3261e">&lt; 200 (SIDA)</text>
<text x="708" y="271" font-size="12" fill="#1f2933">Pneumocystis</text>
<text x="708" y="287" font-size="12" fill="#1f2933">Candidiasis esofágica</text>
<text x="708" y="303" font-size="12" fill="#1f2933">LMP, TB diseminada</text>
<text x="700" y="325" font-size="13" font-weight="700" fill="#b3261e">&lt; 100</text>
<text x="708" y="342" font-size="12" fill="#1f2933">Toxoplasmosis cerebral</text>
<text x="708" y="358" font-size="12" fill="#1f2933">Criptococosis</text>
<text x="708" y="374" font-size="12" fill="#1f2933">Criptosporidiosis crónica</text>
<text x="700" y="396" font-size="13" font-weight="700" fill="#b3261e">&lt; 50</text>
<text x="708" y="413" font-size="12" fill="#1f2933">CMV: retinitis, colitis</text>
<text x="708" y="429" font-size="12" fill="#1f2933">MAC diseminado</text>
<text x="708" y="445" font-size="12" fill="#1f2933">Linfoma primario del SNC</text>
<text x="20" y="526" font-size="12" fill="#1f2933">La terapia antirretroviral suprime la carga viral, recupera los CD4 y corta esta historia: la esperanza de vida se acerca a la de la población general.</text>
<text x="20" y="546" font-size="11.5" fill="#52606d">Esquema propio, ilustrativo (la carga viral no está a escala). Umbrales según las guías de infecciones oportunistas de NIH/CDC/IDSA. LMP: leucoencefalopatía multifocal progresiva.</text>
</svg>