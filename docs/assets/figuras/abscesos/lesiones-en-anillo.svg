<text x="337.75" y="168" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9ec5ea">DWI−</text>
<text x="271.5" y="340" font-size="12.5" font-weight="700" fill="#1f2933">Glioblastoma o metástasis:</text>
<text x="271.5" y="359" font-size="12.5" font-weight="400" fill="#1f2933">anillo GRUESO, irregular,</text>
<text x="271.5" y="378" font-size="12.5" font-weight="400" fill="#1f2933">nodular</text>
<text x="271.5" y="397" font-size="12.5" font-weight="400" fill="#1f2933">Centro SIN restricción</text>
<text x="271.5" y="416" font-size="12.5" font-weight="400" fill="#1f2933">de la difusión</text>
<text x="271.5" y="435" font-size="12.5" font-weight="400" fill="#1f2933">Metástasis: a menudo múltiples,</text>
<text x="271.5" y="454" font-size="12.5" font-weight="400" fill="#1f2933">en la unión córtico-subcortical</text>
<rect x="261.5" y="44" width="224.5" height="494" rx="10" fill="none" stroke="#1f5f99" stroke-width="1.4"/>
<text x="606.2" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#6b3fa0">Toxoplasmosis</text>
