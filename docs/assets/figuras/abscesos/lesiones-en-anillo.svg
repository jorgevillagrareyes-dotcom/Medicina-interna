<text x="736.5" y="340" font-size="12.5" font-weight="700" fill="#1f2933">Quistes con un punto interno</text>
<text x="736.5" y="359" font-size="12.5" font-weight="400" fill="#1f2933">(escólex); varios estadios</text>
<text x="736.5" y="378" font-size="12.5" font-weight="400" fill="#1f2933">a la vez y calcificaciones</text>
<text x="736.5" y="397" font-size="12.5" font-weight="400" fill="#1f2933">Convulsiones en un paciente</text>
<text x="736.5" y="416" font-size="12.5" font-weight="400" fill="#1f2933">de zona endémica</text>
<text x="736.5" y="435" font-size="12.5" font-weight="400" fill="#1f2933">Serología y TC</text>
<text x="736.5" y="454" font-size="12.5" font-weight="400" fill="#1f2933">(calcificaciones)</text>
<rect x="726.5" y="44" width="224.5" height="494" rx="10" fill="none" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="25" y="566" font-size="11.5" fill="#52606d">Esquema propio, ilustrativo (T1 con contraste; DWI = difusión). La restricción de la difusión en el centro de la lesión</text>
<text x="25" y="584" font-size="11.5" fill="#52606d">es la clave para diferenciar un absceso de un tumor necrótico (ESCMID 2024: la RM es el examen de elección).</text>
