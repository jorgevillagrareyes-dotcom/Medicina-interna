<text x="504.0" y="340" font-size="12.5" font-weight="700" fill="#1f2933">VIH con CD4 &lt; 100</text>
<text x="504.0" y="359" font-size="12.5" font-weight="400" fill="#1f2933">Lesiones MÚLTIPLES en los</text>
<text x="504.0" y="378" font-size="12.5" font-weight="400" fill="#1f2933">ganglios basales y la unión</text>
<text x="504.0" y="397" font-size="12.5" font-weight="400" fill="#1f2933">córtico-subcortical</text>
<text x="504.0" y="416" font-size="12.5" font-weight="400" fill="#1f2933">Signo de la "diana excéntrica"</text>
<text x="504.0" y="435" font-size="12.5" font-weight="400" fill="#1f2933">Mejora con tratamiento</text>
<text x="504.0" y="454" font-size="12.5" font-weight="400" fill="#1f2933">empírico en 10–14 días</text>
<rect x="494.0" y="44" width="224.5" height="494" rx="10" fill="none" stroke="#6b3fa0" stroke-width="1.4"/>
<text x="838.8" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d4f">Neurocisticercosis</text>
