<text x="179.25" y="166" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b3261e">DWI+</text>
<text x="39.0" y="340" font-size="12.5" font-weight="700" fill="#1f2933">Anillo FINO, liso y regular</text>
<text x="39.0" y="359" font-size="12.5" font-weight="400" fill="#1f2933">(más delgado hacia el ventrículo)</text>
<text x="39.0" y="378" font-size="12.5" font-weight="400" fill="#1f2933">Centro con RESTRICCIÓN de la</text>
<text x="39.0" y="397" font-size="12.5" font-weight="400" fill="#1f2933">difusión (brillante en DWI,</text>
<text x="39.0" y="416" font-size="12.5" font-weight="400" fill="#1f2933">ADC bajo) = pus</text>
<text x="39.0" y="435" font-size="12.5" font-weight="400" fill="#1f2933">Edema alrededor; foco dental,</text>
<text x="39.0" y="454" font-size="12.5" font-weight="400" fill="#1f2933">otorrino o endocarditis</text>
<rect x="29.0" y="44" width="224.5" height="494" rx="10" fill="none" stroke="#b3261e" stroke-width="1.4"/>
<text x="373.8" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5f99">Tumor necrótico</text>
