<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="960" height="430" fill="#ffffff"/>
<text x="480.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Curso temporal del síndrome de abstinencia alcohólica (horas desde el último trago)</text>
<line x1="250.0" y1="60" x2="250.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="250.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">0 h</text>
<line x1="318.0" y1="60" x2="318.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="318.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">12 h</text>
<line x1="386.0" y1="60" x2="386.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="386.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">24 h</text>
<line x1="454.0" y1="60" x2="454.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="454.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">36 h</text>
<line x1="522.0" y1="60" x2="522.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="522.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">48 h</text>
<line x1="590.0" y1="60" x2="590.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="590.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">60 h</text>
<line x1="658.0" y1="60" x2="658.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="658.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">72 h</text>
<line x1="726.0" y1="60" x2="726.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="726.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">84 h</text>
<line x1="794.0" y1="60" x2="794.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="794.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">96 h</text>
<line x1="862.0" y1="60" x2="862.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="862.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">108 h</text>
<line x1="930.0" y1="60" x2="930.0" y2="330" stroke="#e4e7eb" stroke-width="1"/>
<text x="930.0" y="350" text-anchor="middle" font-size="12.5" fill="#52606d">120 h</text>
<line x1="250" y1="332" x2="930" y2="332" stroke="#3e4c59" stroke-width="1.8"/>
<text x="590.0" y="372" text-anchor="middle" font-size="13" fill="#52606d">Día 1 (0–24 h) · Día 2 (24–48 h) · Día 3 (48–72 h) · Días 4–5 (72–120 h)</text>
<text x="20" y="86" font-size="15" font-weight="700" fill="#c77d0a">Abstinencia leve a moderada</text>
<text x="20" y="104" font-size="12" fill="#52606d">temblor, ansiedad, sudoración,</text>
<text x="20" y="119" font-size="12" fill="#52606d">taquicardia, HTA, náuseas, insomnio</text>
<rect x="284.0" y="78" width="374.0" height="32" rx="16" fill="#c77d0a" opacity="0.22"/>
<rect x="318.0" y="78" width="136.0" height="32" rx="16" fill="#c77d0a" opacity="0.85"/>
<text x="20" y="150" font-size="15" font-weight="700" fill="#6b3fa0">Alucinosis alcohólica</text>
<text x="20" y="168" font-size="12" fill="#52606d">alucinaciones (visuales, táctiles,</text>
<text x="20" y="183" font-size="12" fill="#52606d">auditivas) con sensorio conservado</text>
<rect x="318.0" y="142" width="204.0" height="32" rx="16" fill="#6b3fa0" opacity="0.22"/>
<rect x="352.0" y="142" width="102.0" height="32" rx="16" fill="#6b3fa0" opacity="0.85"/>
<text x="20" y="214" font-size="15" font-weight="700" fill="#1f5f99">Convulsiones</text>
<text x="20" y="232" font-size="12" fill="#52606d">tónico-clónicas generalizadas,</text>
<text x="20" y="247" font-size="12" fill="#52606d">únicas o en salvas breves</text>
<rect x="284.0" y="206" width="238.0" height="32" rx="16" fill="#1f5f99" opacity="0.22"/>
<rect x="352.0" y="206" width="68.0" height="32" rx="16" fill="#1f5f99" opacity="0.85"/>
<text x="20" y="278" font-size="15" font-weight="700" fill="#b3261e">Delirium tremens</text>
<text x="20" y="296" font-size="12" fill="#52606d">delirium + hiperactividad autonómica,</text>
<text x="20" y="311" font-size="12" fill="#52606d">fiebre; dura 1–5 días</text>
<rect x="522.0" y="270" width="408.0" height="32" rx="16" fill="#b3261e" opacity="0.22"/>
<rect x="590.0" y="270" width="204.0" height="32" rx="16" fill="#b3261e" opacity="0.85"/>
<text x="20" y="400" font-size="12" fill="#52606d">Barra clara: período habitual de aparición · barra intensa: máxima frecuencia. Los tiempos son aproximados y varían entre pacientes.</text>
<text x="20" y="420" font-size="11.5" fill="#52606d">Esquema propio. Un paciente puede presentar abstinencia con alcoholemia aún positiva; la abstinencia no tratada puede progresar a convulsiones y delirium tremens.</text>
</svg>