<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="500" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Pancitopenia: ¿causa periférica o falla de la médula ósea?</text>
<rect x="30" y="44" width="940" height="50" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="500.0" y="65.3" text-anchor="middle" font-size="12.4" font-weight="700" fill="#c92a2a">Pancitopenia: anemia + leucopenia (neutropenia) + trombocitopenia</text>
<text x="500.0" y="81.7" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Urgente si hay fiebre con neutrófilos &lt; 500/µL, sangrado, plaquetas &lt; 10 000/µL o blastos en el frotis</text>
<line x1="500" y1="94" x2="500" y2="110" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="110" width="940" height="66" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="131.1" text-anchor="middle" font-size="12.4" font-weight="700" fill="#1f5f99">Primer estudio</text>
<text x="500.0" y="147.5" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Frotis revisado · reticulocitos · VCM · B12 y folato · LDH, bilirrubina, haptoglobina · pruebas hepáticas · VIH, VHB, VHC (VEB, CMV, parvovirus)</text>
<text x="500.0" y="163.9" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">ANA · ecografía abdominal (bazo, hígado) · revisar fármacos, alcohol, tóxicos, antecedentes familiares · citometría para HPN si hay hemólisis o trombosis</text>
<line x1="215" y1="194" x2="725" y2="194" stroke="#495057" stroke-width="1.6"/>
<line x1="500" y1="176" x2="500" y2="194" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="215" y1="194" x2="215" y2="212" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="725" y1="194" x2="725" y2="212" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="212" width="370" height="276" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="215" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#2f9e44">Causa periférica o sistémica</text>
<text x="215" y="252" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">(médula normal o hipercelular)</text>
<text x="215" y="280.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Hiperesplenismo: cirrosis, hipertensión portal</text>
<text x="215" y="300.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Déficit de B12 o folato (megaloblastosis)</text>
<text x="215" y="320.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Alcohol; fármacos: metotrexato, azatioprina,</text>
<text x="215" y="340.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">cotrimoxazol, cloranfenicol, quimioterapia</text>
<text x="215" y="360.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Infecciones: VIH, sepsis, TBC miliar, VEB,</text>
<text x="215" y="380.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">parvovirus B19, leishmaniasis</text>
<text x="215" y="400.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">LES y otras autoinmunes</text>
<text x="215" y="420.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Síndrome hemofagocítico (ferritina muy alta)</text>
<text x="215" y="440.0" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Hemoglobinuria paroxística nocturna (HPN)</text>
<text x="215" y="460.0" text-anchor="middle" font-size="12.3" font-weight="700" fill="#1f2933">→ tratar la causa; médula si no se aclara</text>
<rect x="420" y="212" width="550" height="44" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="695" y="239" text-anchor="middle" font-size="13.6" font-weight="700" fill="#b35c00">Mielograma + biopsia de médula ósea (citogenética, citometría)</text>
<line x1="557" y1="270" x2="833" y2="270" stroke="#495057" stroke-width="1.6"/>
<line x1="695" y1="256" x2="695" y2="270" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="557" y1="270" x2="557" y2="288" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="420" y="288" width="270" height="94" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="555" y="308" text-anchor="middle" font-size="13.2" font-weight="700" fill="#1f5f99">Hipocelular (&lt; 25 %)</text>
<text x="555" y="328.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">sin displasia ni blastos</text>
<text x="555" y="343.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2933">→ APLASIA MEDULAR</text>
<text x="555" y="359.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Descartar SMD hipoplásico,</text>
<text x="555" y="374.8" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">HPN, fallas hereditarias</text>
<line x1="837" y1="270" x2="837" y2="288" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="700" y="288" width="270" height="94" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="835" y="308" text-anchor="middle" font-size="13.2" font-weight="700" fill="#7048e8">Displasia ≥ 10 % de una línea</text>
<text x="835" y="328.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">blastos &lt; 20 %</text>
<text x="835" y="343.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2933">→ SÍNDROME MIELODISPLÁSICO</text>
<text x="835" y="359.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Excluir B12, cobre, alcohol,</text>
<text x="835" y="374.8" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">VIH y fármacos</text>
<rect x="420" y="394" width="270" height="94" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="555" y="414" text-anchor="middle" font-size="13.2" font-weight="700" fill="#c92a2a">Blastos ≥ 20 %</text>
<text x="555" y="434.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">(o alteración genética</text>
<text x="555" y="449.6" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">definitoria)</text>
<text x="555" y="465.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2933">→ LEUCEMIA AGUDA</text>
<text x="555" y="480.8" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Urgencia: GES 45</text>
<rect x="700" y="394" width="270" height="94" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="835" y="414" text-anchor="middle" font-size="13.2" font-weight="700" fill="#e8590c">Infiltración o fibrosis</text>
<text x="835" y="434.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Linfoma, mieloma, metástasis,</text>
<text x="835" y="449.6" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">mielofibrosis, TBC</text>
<text x="835" y="465.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">(aspirado "seco";</text>
<text x="835" y="480.8" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">leucoeritroblastosis)</text>
</svg>