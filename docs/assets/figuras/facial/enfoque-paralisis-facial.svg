<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="584" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Debilidad facial aguda unilateral: enfoque y tratamiento</text>
<rect x="300" y="42" width="400" height="36" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="64.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Debilidad facial aguda de un lado</text>
<line x1="500" y1="78" x2="500" y2="96" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="230" y="96" width="540" height="56" rx="8" fill="#fff5f5" stroke="#b3261e" stroke-width="1.6"/>
<text x="500.0" y="120.0" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1f2933">1. ¿Respeta la frente? ¿Hemiparesia, disartria, diplopía,</text>
<text x="500.0" y="137.0" text-anchor="middle" font-size="12.8" fill="#1f2933">ataxia u otros pares craneales afectados?</text>
<line x1="770" y1="124" x2="812" y2="124" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="776" y="116" font-size="12.5" font-weight="700" fill="#b3261e">Sí</text>
<rect x="812" y="96" width="172" height="56" rx="8" fill="#ffc9c9" stroke="#b3261e" stroke-width="1.6"/>
<text x="898.0" y="120.0" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1f2933">Central o de tronco</text>
<text x="898.0" y="137.0" text-anchor="middle" font-size="12.8" fill="#1f2933">Código ACV: TC o RM</text>
<line x1="500" y1="152" x2="500" y2="172" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="508" y="167" font-size="12.5" font-weight="700" fill="#2f9e44">No: periférica</text>
<rect x="170" y="172" width="600" height="92" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="470.0" y="197.0" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">2. ¿Hay una causa identificable? (historia, otoscopia, parótida, piel)</text>
<text x="470.0" y="214.0" text-anchor="middle" font-size="12.6" fill="#1f2933">Vesículas en el oído o el paladar, dolor intenso (Ramsay Hunt) · otitis o colesteatoma</text>
<text x="470.0" y="231.0" text-anchor="middle" font-size="12.6" fill="#1f2933">Masa parotídea · trauma · bilateral o recurrente del mismo lado</text>
<text x="470.0" y="248.0" text-anchor="middle" font-size="12.6" fill="#1f2933">Instalación &gt; 72 h o progresiva · fiebre · inmunosupresión o VIH</text>
<line x1="770" y1="218" x2="812" y2="218" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="776" y="210" font-size="12.5" font-weight="700" fill="#b3261e">Sí</text>
<rect x="812" y="172" width="172" height="92" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.6"/>
<text x="898.0" y="197.0" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">Estudio dirigido</text>
<text x="898.0" y="214.0" text-anchor="middle" font-size="12.6" fill="#1f2933">RM con gadolinio,</text>
<text x="898.0" y="231.0" text-anchor="middle" font-size="12.6" fill="#1f2933">TC de peñasco, serologías</text>
<text x="898.0" y="248.0" text-anchor="middle" font-size="12.6" fill="#1f2933">Derivar a ORL o neurología</text>
<line x1="500" y1="264" x2="500" y2="284" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="508" y="279" font-size="12.5" font-weight="700" fill="#2f9e44">No</text>
<rect x="200" y="284" width="600" height="40" rx="8" fill="#e6f4ea" stroke="#2f9e44" stroke-width="1.6"/>
<text x="500.0" y="308.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">3. Parálisis de Bell (diagnóstico de exclusión): sin exámenes ni imágenes de rutina</text>
<line x1="500" y1="324" x2="190.0" y2="346" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="346" width="300" height="132" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.4"/>
<rect x="40" y="346" width="300" height="28" rx="8" fill="#1f5f99"/><rect x="40" y="362" width="300" height="12" fill="#1f5f99"/>
<text x="190.0" y="365" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Todos: proteger el ojo</text>
<text x="190.0" y="394" text-anchor="middle" font-size="12.8" fill="#1f2933">Lágrimas artificiales cada 1–2 h</text>
<text x="190.0" y="411" text-anchor="middle" font-size="12.8" fill="#1f2933">Ungüento y oclusión nocturna</text>
<text x="190.0" y="428" text-anchor="middle" font-size="12.8" fill="#1f2933">Lentes de sol de día</text>
<text x="190.0" y="445" text-anchor="middle" font-size="12.8" fill="#1f2933">Consulta si dolor, ojo rojo</text>
<text x="190.0" y="462" text-anchor="middle" font-size="12.8" fill="#1f2933">o baja de visión</text>
<line x1="500" y1="324" x2="500" y2="346" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="350" y="346" width="300" height="132" rx="8" fill="#ffffff" stroke="#2f9e44" stroke-width="1.4"/>
<rect x="350" y="346" width="300" height="28" rx="8" fill="#2f9e44"/><rect x="350" y="362" width="300" height="12" fill="#2f9e44"/>
<text x="500.0" y="365" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">≤ 72 h y ≥ 16 años: corticoide</text>
<text x="500.0" y="394" text-anchor="middle" font-size="12.8" fill="#1f2933">Prednisona 60 mg/día por 5 días</text>
<text x="500.0" y="411" text-anchor="middle" font-size="12.8" fill="#1f2933">y descenso en 5 días, o</text>
<text x="500.0" y="428" text-anchor="middle" font-size="12.8" fill="#1f2933">prednisolona 50 mg/día por 10 días</text>
<text x="500.0" y="445" text-anchor="middle" font-size="12.8" fill="#1f2933">Diabetes: controlar la glicemia</text>
<text x="500.0" y="462" text-anchor="middle" font-size="12.8" fill="#1f2933">Embarazo: individualizar</text>
<line x1="500" y1="324" x2="810.0" y2="346" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="660" y="346" width="300" height="132" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="1.4"/>
<rect x="660" y="346" width="300" height="28" rx="8" fill="#6741d9"/><rect x="660" y="362" width="300" height="12" fill="#6741d9"/>
<text x="810.0" y="365" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Grave o completa (HB V–VI)</text>
<text x="810.0" y="394" text-anchor="middle" font-size="12.8" fill="#1f2933">Considerar sumar valaciclovir</text>
<text x="810.0" y="411" text-anchor="middle" font-size="12.8" fill="#1f2933">1 g c/8 h por 7 días</text>
<text x="810.0" y="428" text-anchor="middle" font-size="12.8" fill="#1f2933">Nunca antiviral solo</text>
<text x="810.0" y="445" text-anchor="middle" font-size="12.8" fill="#1f2933">Ramsay Hunt: antiviral siempre</text>
<text x="810.0" y="462" text-anchor="middle" font-size="12.8" fill="#1f2933">+ corticoide</text>
<line x1="500" y1="478" x2="500" y2="498" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="100" y="498" width="800" height="74" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6"/>
<text x="500.0" y="522.5" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1f2933">4. Control a las 1–2 semanas y luego mensual hasta la recuperación</text>
<text x="500.0" y="539.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Reevaluar o derivar si: déficits nuevos o progresión · síntomas oculares · sin ninguna mejoría a las 3 semanas</text>
<text x="500.0" y="556.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Recuperación incompleta a los 3 meses: RM, ORL o neurología, kinesiología facial, toxina botulínica</text>
</svg>