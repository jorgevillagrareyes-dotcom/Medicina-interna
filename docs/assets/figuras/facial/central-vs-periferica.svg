<circle cx="250" cy="147" r="2.6" fill="#868e96"/>
<text x="144" y="139" text-anchor="end" font-size="13" font-weight="700" fill="#1f5f99">Frente: se arruga</text>
<text x="144" y="155" text-anchor="end" font-size="13" font-weight="400" fill="#1f5f99">en ambos lados</text>
<line x1="240" y1="215" x2="150" y2="207" stroke="#868e96" stroke-width="1.2"/>
<circle cx="240" cy="215" r="2.6" fill="#868e96"/>
<text x="144" y="211" text-anchor="end" font-size="13" font-weight="700" fill="#1f5f99">Cierra el ojo</text>
<text x="144" y="227" text-anchor="end" font-size="13" font-weight="400" fill="#1f5f99">(o casi)</text>
<line x1="256" y1="329" x2="150" y2="315" stroke="#868e96" stroke-width="1.2"/>
<circle cx="256" cy="329" r="2.6" fill="#868e96"/>
<text x="144" y="319" text-anchor="end" font-size="13" font-weight="700" fill="#1f5f99">Comisura caída</text>
<text x="144" y="335" text-anchor="end" font-size="13" font-weight="400" fill="#1f5f99">y surco borrado</text>
<text x="760" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#b3261e">Periférica (nervio facial): p. ej., Bell</text>
<ellipse cx="760" cy="235" rx="108" ry="138" fill="#fdf3e7" stroke="#8a6d50" stroke-width="2"/>
<path d="M766,135 Q795,128 824,135" fill="none" stroke="#8a6d50" stroke-width="1.8"/>
