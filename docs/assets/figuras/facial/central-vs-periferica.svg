<line x1="788" y1="314.0" x2="788" y2="323.0" stroke="#ccc" stroke-width="1"/>
<line x1="802" y1="310.5" x2="802" y2="319.5" stroke="#ccc" stroke-width="1"/>
<line x1="710" y1="153" x2="610" y2="135" stroke="#868e96" stroke-width="1.2"/>
<circle cx="710" cy="153" r="2.6" fill="#868e96"/>
<text x="604" y="139" text-anchor="end" font-size="13" font-weight="700" fill="#b3261e">Frente lisa:</text>
<text x="604" y="155" text-anchor="end" font-size="13" font-weight="400" fill="#b3261e">no se arruga</text>
<line x1="686" y1="213" x2="610" y2="207" stroke="#868e96" stroke-width="1.2"/>
<circle cx="686" cy="213" r="2.6" fill="#868e96"/>
<text x="604" y="211" text-anchor="end" font-size="13" font-weight="700" fill="#b3261e">No cierra el ojo:</text>
<text x="604" y="227" text-anchor="end" font-size="13" font-weight="400" fill="#b3261e">se ve el globo girar</text>
<text x="604" y="243" text-anchor="end" font-size="13" font-weight="400" fill="#b3261e">hacia arriba (Bell)</text>
<line x1="716" y1="329" x2="610" y2="315" stroke="#868e96" stroke-width="1.2"/>
<circle cx="716" cy="329" r="2.6" fill="#868e96"/>
<text x="604" y="319" text-anchor="end" font-size="13" font-weight="700" fill="#b3261e">Comisura caída</text>
<text x="604" y="335" text-anchor="end" font-size="13" font-weight="400" fill="#b3261e">y surco borrado</text>
<rect x="40" y="400" width="920" height="28" fill="#495057"/>
<text x="437.5" y="419" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Central</text>
<text x="792.5" y="419" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Periférica</text>
<rect x="40" y="428" width="920" height="26" fill="#f8f9fa"/>
<text x="52" y="446" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2933">Frente</text>
<text x="437.5" y="446" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f5f99">Se arruga (inervación cortical bilateral)</text>
<text x="792.5" y="446" text-anchor="middle" font-size="13.5" font-weight="400" fill="#b3261e">No se arruga</text>
<rect x="40" y="454" width="920" height="26" fill="#ffffff"/>
<text x="52" y="472" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2933">Cierre del ojo</text>
<text x="437.5" y="472" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f5f99">Conservado o debilidad leve</text>
<text x="792.5" y="472" text-anchor="middle" font-size="13.5" font-weight="400" fill="#b3261e">Incompleto (lagoftalmo)</text>
<rect x="40" y="480" width="920" height="26" fill="#f8f9fa"/>
<text x="52" y="498" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2933">Mitad inferior</text>
<text x="437.5" y="498" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f5f99">Débil</text>
<text x="792.5" y="498" text-anchor="middle" font-size="13.5" font-weight="400" fill="#b3261e">Débil</text>
<rect x="40" y="506" width="920" height="26" fill="#ffffff"/>
<text x="52" y="524" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2933">Instalación</text>
<text x="437.5" y="524" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f5f99">Minutos (ACV)</text>
<text x="792.5" y="524" text-anchor="middle" font-size="13.5" font-weight="400" fill="#b3261e">Horas; máximo a las 72 h (Bell)</text>
<rect x="40" y="532" width="920" height="26" fill="#f8f9fa"/>
<text x="52" y="550" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2933">Acompañantes</text>
<text x="437.5" y="550" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f5f99">Hemiparesia, disartria, afasia</text>
<text x="792.5" y="550" text-anchor="middle" font-size="13.5" font-weight="400" fill="#b3261e">Dolor retroauricular, hiperacusia,</text>
<rect x="40" y="558" width="920" height="26" fill="#f8f9fa"/>
<text x="52" y="576" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2933"></text>
<text x="437.5" y="576" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f5f99"></text>
<text x="792.5" y="576" text-anchor="middle" font-size="13.5" font-weight="400" fill="#b3261e">alteración del gusto, ojo seco</text>
<rect x="40" y="400" width="920" height="184" fill="none" stroke="#adb5bd" stroke-width="1"/>
<text x="500.0" y="608" text-anchor="middle" font-size="12.5" font-weight="400" fill="#495057">Ojo: una lesión del núcleo en la protuberancia da una parálisis de tipo periférico, pero con otros signos de tronco (VI par, hemiparesia contralateral).</text>
<text x="500.0" y="626" text-anchor="middle" font-size="12.5" font-weight="400" fill="#495057">Un tumor de la parótida puede afectar solo algunas ramas y respetar la frente.</text>
</svg>