<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Parálisis facial central y periférica</text>
<text x="500.0" y="50" text-anchor="middle" font-size="13" font-weight="400" fill="#495057">Pídele: «arrugue la frente», «cierre los ojos con fuerza», «muestre los dientes». Lado afectado: derecho del paciente (izquierda de la imagen)</text>
<text x="300" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5f99">Central (supranuclear): p. ej., ACV</text>
<ellipse cx="300" cy="235" rx="108" ry="138" fill="#fdf3e7" stroke="#8a6d50" stroke-width="2"/>
<path d="M236,135 Q300,125 364,135" fill="none" stroke="#8a6d50" stroke-width="1.8"/>
