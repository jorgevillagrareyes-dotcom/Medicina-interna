<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="960" height="612" fill="#ffffff"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3e4c59"/></marker></defs>
<text x="480.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Cascada de la coagulación: qué mide cada prueba y dónde actúan los anticoagulantes</text>
<rect x="40" y="52" width="250" height="250" rx="14" fill="#eaf2fb" stroke="#1f5f99" stroke-dasharray="6 4"/>
<text x="165" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5f99">Vía intrínseca → TTPa</text>
<rect x="640" y="52" width="280" height="190" rx="14" fill="#fdf0e6" stroke="#c05621" stroke-dasharray="6 4"/>
<text x="780" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">Vía extrínseca → TP / INR</text>
<rect x="215" y="300" width="530" height="232" rx="14" fill="#f3edf9" stroke="#6b3fa0" stroke-dasharray="6 4"/>
<text x="480" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#6b3fa0">Vía común → alarga TP y TTPa</text>
<rect x="90" y="90" width="150" height="42" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="2.4"/>
<text x="165.0" y="116.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">XII</text>
<rect x="90" y="160" width="150" height="42" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="2.4"/>
<text x="165.0" y="186.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">XI</text>
<rect x="90" y="230" width="150" height="50" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="2.4"/>
<text x="165.0" y="251.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">IX + VIII</text>
<text x="165.0" y="268.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">(hemofilias B y A)</text>
<circle cx="236" cy="234" r="11" fill="#2f855a"/>
<text x="236" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">K</text>
<line x1="165" y1="132" x2="165" y2="158" stroke="#3e4c59" stroke-width="2" marker-end="url(#fl)"/>
<line x1="165" y1="202" x2="165" y2="228" stroke="#3e4c59" stroke-width="2" marker-end="url(#fl)"/>
<rect x="680" y="100" width="200" height="50" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="2.4"/>
<text x="780.0" y="121.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Factor tisular + VII</text>
<text x="780.0" y="138.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">(lesión del vaso)</text>
<circle cx="876" cy="104" r="11" fill="#2f855a"/>
<text x="876" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">K</text>
<text x="905" y="180" text-anchor="end" font-size="12" font-weight="700" fill="#52606d">Factor VII: vida media ~ 6 h</text>
<text x="905" y="197" text-anchor="end" font-size="12" font-weight="400" fill="#52606d">(el primero que cae con AVK,</text>
<text x="905" y="214" text-anchor="end" font-size="12" font-weight="400" fill="#52606d">déficit de vit. K o hepatopatía)</text>
<rect x="395" y="340" width="170" height="44" rx="8" fill="#ffffff" stroke="#6b3fa0" stroke-width="2.4"/>
<text x="480.0" y="367.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">X + V</text>
<circle cx="561" cy="344" r="11" fill="#2f855a"/>
<text x="561" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">K</text>
<line x1="240" y1="262" x2="393" y2="352" stroke="#3e4c59" stroke-width="2" marker-end="url(#fl)"/>
<line x1="700" y1="150" x2="567" y2="352" stroke="#3e4c59" stroke-width="2" marker-end="url(#fl)"/>
<rect x="250" y="410" width="170" height="44" rx="8" fill="#ffffff" stroke="#6b3fa0" stroke-width="2.4"/>
<text x="335.0" y="437.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Protrombina (II)</text>
<circle cx="416" cy="414" r="11" fill="#2f855a"/>
<text x="416" y="419" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">K</text>
<rect x="540" y="410" width="170" height="44" rx="8" fill="#ffffff" stroke="#6b3fa0" stroke-width="2.4"/>
<text x="625.0" y="437.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Trombina (IIa)</text>
<line x1="460" y1="384" x2="380" y2="408" stroke="#3e4c59" stroke-width="2" marker-end="url(#fl)"/>
<line x1="420" y1="432" x2="538" y2="432" stroke="#3e4c59" stroke-width="2" marker-end="url(#fl)"/>
<rect x="250" y="475" width="170" height="44" rx="8" fill="#ffffff" stroke="#6b3fa0" stroke-width="2.4"/>
<text x="335.0" y="502.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Fibrinógeno (I)</text>
<rect x="540" y="475" width="170" height="44" rx="8" fill="#ffffff" stroke="#6b3fa0" stroke-width="2.4"/>
<text x="625.0" y="502.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Fibrina (coágulo)</text>
<line x1="420" y1="497" x2="538" y2="497" stroke="#3e4c59" stroke-width="2" marker-end="url(#fl)"/>
<line x1="625" y1="454" x2="625" y2="473" stroke="#3e4c59" stroke-width="2" marker-end="url(#fl)"/>
<text x="718" y="502" text-anchor="start" font-size="12" font-weight="700" fill="#52606d">+ XIII estabiliza</text>
<line x1="567" y1="362" x2="770" y2="300" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="772" y="268" text-anchor="start" font-size="13" font-weight="700" fill="#b3261e">Anti-Xa</text>
<text x="772" y="285" text-anchor="start" font-size="13" font-weight="400" fill="#b3261e">Rivaroxabán, apixabán,</text>
<text x="772" y="302" text-anchor="start" font-size="13" font-weight="400" fill="#b3261e">edoxabán · HBPM y</text>
<text x="772" y="319" text-anchor="start" font-size="13" font-weight="400" fill="#b3261e">fondaparinux (vía</text>
<text x="772" y="336" text-anchor="start" font-size="13" font-weight="400" fill="#b3261e">antitrombina)</text>
<line x1="710" y1="425" x2="770" y2="410" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="772" y="390" text-anchor="start" font-size="13" font-weight="700" fill="#b3261e">Anti-IIa</text>
<text x="772" y="407" text-anchor="start" font-size="13" font-weight="400" fill="#b3261e">Dabigatrán · HNF</text>
<text x="772" y="424" text-anchor="start" font-size="13" font-weight="400" fill="#b3261e">(inhibe IIa y Xa vía</text>
<text x="772" y="441" text-anchor="start" font-size="13" font-weight="400" fill="#b3261e">antitrombina)</text>
<rect x="330" y="90" width="270" height="122" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
<text x="465" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#7c4a03">Hemostasia primaria</text>
<text x="465" y="131" text-anchor="middle" font-size="13" font-weight="400" fill="#7c4a03">Plaquetas + factor von Willebrand</text>
<text x="465" y="148" text-anchor="middle" font-size="13" font-weight="400" fill="#7c4a03">No la miden el TP ni el TTPa:</text>
<text x="465" y="165" text-anchor="middle" font-size="13" font-weight="400" fill="#7c4a03">recuento de plaquetas, historia de</text>
<text x="465" y="182" text-anchor="middle" font-size="13" font-weight="400" fill="#7c4a03">sangrado, estudio de von Willebrand</text>
<circle cx="52" cy="549" r="10" fill="#2f855a"/>
<text x="52" y="554" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">K</text>
<text x="70" y="553" text-anchor="start" font-size="13" font-weight="700" fill="#1f2933">Factores dependientes de vitamina K (II, VII, IX, X; también proteínas C y S):</text>
<text x="70" y="570" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">los disminuyen los AVK (acenocumarol, warfarina), el déficit de vitamina K y la hepatopatía.</text>
<text x="40" y="600" font-size="11.5" fill="#52606d">Esquema propio, simplificado (modelo clásico de la cascada, útil para interpretar las pruebas; in vivo la coagulación ocurre sobre superficies celulares).</text>
</svg>