<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="700" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Enfoque del paciente con artritis de varias articulaciones</text>
<rect x="150" y="44" width="700" height="70" rx="8" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="66.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">1. ¿ES INFLAMATORIO?</text>
<text x="500.0" y="83.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">Sí: aumento de volumen blando, calor, rigidez matinal &gt; 30–60 min que mejora con el uso, síntomas sistémicos</text>
<text x="500.0" y="100.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">No (mecánico): dolor con la carga que mejora con el reposo, rigidez breve, crujidos → artrosis</text>
<line x1="500" y1="114" x2="500" y2="132" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="150" y="132" width="700" height="52" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="500.0" y="154.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">2. ¿CUÁNTAS ARTICULACIONES? Monoartritis (1) → artrocentesis urgente (artritis séptica, gota)</text>
<text x="500.0" y="171.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">Oligoartritis (2–4) · Poliartritis (≥ 5)</text>
<line x1="330" y1="184" x2="250" y2="214" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="670" y1="184" x2="750" y2="214" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="214" width="460" height="36" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.6"/>
<text x="250.0" y="236.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">3a. AGUDA (&lt; 6 semanas)</text>
<rect x="20" y="256" width="460" height="196" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/>
<text x="32" y="300.8" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Viral: parvovirus B19, hepatitis B y C, VIH, rubéola,</text>
<text x="32" y="317.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">&#160;&#160;&#160;dengue o chikungunya (viajes); autolimitada</text>
<text x="32" y="333.8" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Artritis gonocócica: tenosinovitis, pústulas, migratoria</text>
<text x="32" y="350.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Artritis reactiva: 1–4 semanas tras diarrea o uretritis</text>
<text x="32" y="366.8" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Gota o pseudogota poliarticular</text>
<text x="32" y="383.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Endocarditis infecciosa, fiebre reumática (migratoria)</text>
<text x="32" y="399.8" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Debut de AR, LES o psoriásica (si persiste &gt; 6 semanas)</text>
<text x="32" y="416.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Enfermedad del suero, sarcoidosis aguda (Löfgren)</text>
<rect x="520" y="214" width="460" height="36" rx="8" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="750.0" y="236.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">3b. CRÓNICA (≥ 6 semanas)</text>
<rect x="520" y="256" width="460" height="196" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="532" y="300.8" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Artritis reumatoide: simétrica, pequeñas articulaciones</text>
<text x="532" y="317.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">&#160;&#160;&#160;de manos (MCF, IFP) y pies (MTF), respeta las IFD</text>
<text x="532" y="333.8" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• LES: poliartralgias o artritis no erosiva + compromiso</text>
<text x="532" y="350.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">&#160;&#160;&#160;sistémico (piel, riñón, citopenias)</text>
<text x="532" y="366.8" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Artritis psoriásica: asimétrica, IFD, dactilitis, uñas</text>
<text x="532" y="383.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Espondiloartritis periférica: oligoartritis de EEII, entesitis</text>
<text x="532" y="399.8" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Gota tofácea, pseudogota (CPPD) crónica</text>
<text x="532" y="416.3" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">• Polimialgia reumática (&gt; 50 años, cinturas)</text>
<line x1="500" y1="452" x2="500" y2="472" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="472" width="960" height="116" rx="8" fill="#eef2f6" stroke="#52606d" stroke-width="1.6"/>
<text x="500.0" y="501.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">4. ESTUDIO INICIAL</text>
<text x="500.0" y="518.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Hemograma, VHS, PCR, creatinina, perfil hepático, orina completa, ácido úrico · Factor reumatoide y anti-CCP · ANA</text>
<text x="500.0" y="534.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Serologías según el contexto: hepatitis B y C, VIH, parvovirus B19 · Radiografía de manos y pies (y de las articulaciones afectadas)</text>
<text x="500.0" y="551.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Artrocentesis si hay derrame: recuento celular, Gram y cultivo, cristales</text>
<text x="500.0" y="567.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Ecografía articular (sinovitis, erosiones) según disponibilidad</text>
<line x1="500" y1="588" x2="500" y2="606" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="120" y="606" width="760" height="56" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="500.0" y="630.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Artritis inflamatoria de ≥ 6 semanas o con FR/anti-CCP positivos → derivar a reumatología (GES 52 si es AR)</text>
<text x="500.0" y="647.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">y NO retrasar el tratamiento: la "ventana de oportunidad" son los primeros meses</text>
<text x="980" y="688" text-anchor="end" font-size="11.5" fill="#7b8794">Esquema propio basado en los criterios ACR/EULAR 2010, EULAR 2025 (artritis reumatoide) y ASAS-EULAR 2022 (espondiloartritis).</text>
</svg>