<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="980" height="520" fill="#ffffff"/>
<text x="490.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Cuándo aparece cada síndrome después de iniciar o subir el fármaco</text>
<line x1="250.0" y1="60" x2="250.0" y2="440" stroke="#eef1f4"/>
<text x="250.0" y="458" text-anchor="middle" font-size="12" fill="#52606d">1 h</text>
<line x1="373.2" y1="60" x2="373.2" y2="440" stroke="#eef1f4"/>
<text x="373.2" y="458" text-anchor="middle" font-size="12" fill="#52606d">6 h</text>
<line x1="468.6" y1="60" x2="468.6" y2="440" stroke="#eef1f4"/>
<text x="468.6" y="458" text-anchor="middle" font-size="12" fill="#52606d">1 día</text>
<line x1="544.2" y1="60" x2="544.2" y2="440" stroke="#eef1f4"/>
<text x="544.2" y="458" text-anchor="middle" font-size="12" fill="#52606d">3 días</text>
<line x1="602.5" y1="60" x2="602.5" y2="440" stroke="#eef1f4"/>
<text x="602.5" y="458" text-anchor="middle" font-size="12" fill="#52606d">1 sem</text>
<line x1="702.6" y1="60" x2="702.6" y2="440" stroke="#eef1f4"/>
<text x="702.6" y="458" text-anchor="middle" font-size="12" fill="#52606d">1 mes</text>
<line x1="778.1" y1="60" x2="778.1" y2="440" stroke="#eef1f4"/>
<text x="778.1" y="458" text-anchor="middle" font-size="12" fill="#52606d">3 meses</text>
<line x1="874.4" y1="60" x2="874.4" y2="440" stroke="#eef1f4"/>
<text x="874.4" y="458" text-anchor="middle" font-size="12" fill="#52606d">1 año</text>
<line x1="950.0" y1="60" x2="950.0" y2="440" stroke="#eef1f4"/>
<text x="950.0" y="458" text-anchor="middle" font-size="12" fill="#52606d">3 años</text>
<line x1="250" y1="440" x2="950" y2="440" stroke="#3e4c59" stroke-width="1.5"/>
<text x="600.0" y="480" text-anchor="middle" font-size="12.5" fill="#1f2933">Tiempo desde el inicio o el aumento de dosis (escala logarítmica, ilustrativa)</text>
<text x="20" y="88" font-size="14" font-weight="700" fill="#6b3fa0">Síndrome serotoninérgico</text>
<text x="20" y="105" font-size="11.8" fill="#52606d">ISRS, IRSN, tramadol, linezolid,</text>
<text x="20" y="120" font-size="11.8" fill="#52606d">combinaciones; clonus, hipertermia</text>
<rect x="250.0" y="78" width="218.6" height="26" rx="13" fill="#6b3fa0" opacity="0.85"/>
<text x="20" y="148" font-size="14" font-weight="700" fill="#b3261e">Distonía aguda</text>
<text x="20" y="165" font-size="11.8" fill="#52606d">Metoclopramida, haloperidol;</text>
<text x="20" y="180" font-size="11.8" fill="#52606d">jóvenes; tortícolis, crisis oculógiras</text>
<rect x="250.0" y="138" width="329.3" height="26" rx="13" fill="#b3261e" opacity="0.85"/>
<text x="20" y="208" font-size="14" font-weight="700" fill="#c77d0a">Síndrome neuroléptico maligno</text>
<text x="20" y="225" font-size="11.8" fill="#52606d">Antipsicóticos (o suspender</text>
<text x="20" y="240" font-size="11.8" fill="#52606d">levodopa); rigidez, fiebre, CK alta</text>
<rect x="468.6" y="198" width="234.0" height="26" rx="13" fill="#c77d0a" opacity="0.85"/>
<text x="20" y="268" font-size="14" font-weight="700" fill="#1f5f99">Acatisia</text>
<text x="20" y="285" font-size="11.8" fill="#52606d">Inquietud motora intensa;</text>
<text x="20" y="300" font-size="11.8" fill="#52606d">se confunde con agitación</text>
<rect x="420.9" y="258" width="329.3" height="26" rx="13" fill="#1f5f99" opacity="0.85"/>
<text x="20" y="328" font-size="14" font-weight="700" fill="#2e7d4f">Parkinsonismo por fármacos</text>
<text x="20" y="345" font-size="11.8" fill="#52606d">Simétrico, con temblor</text>
<text x="20" y="360" font-size="11.8" fill="#52606d">de reposo; adultos mayores</text>
<rect x="579.3" y="318" width="218.6" height="26" rx="13" fill="#2e7d4f" opacity="0.85"/>
<text x="20" y="388" font-size="14" font-weight="700" fill="#52606d">Discinesia tardía</text>
<text x="20" y="405" font-size="11.8" fill="#52606d">Movimientos orofaciales;</text>
<text x="20" y="420" font-size="11.8" fill="#52606d">puede ser irreversible</text>
<rect x="778.1" y="378" width="171.9" height="26" rx="13" fill="#52606d" opacity="0.85"/>
<text x="20" y="508" font-size="11.5" fill="#52606d">Esquema propio, ilustrativo; los rangos son aproximados y se superponen. Siempre revisar qué fármaco se inició, subió, combinó o suspendió.</text>
</svg>