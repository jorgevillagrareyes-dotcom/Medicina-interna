<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 602" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="602" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Enfermedad celíaca: algoritmo diagnóstico en el adulto</text>
<rect x="40" y="44" width="920" height="66" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="64.9" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f5f99">Sospecha clínica (paciente que COME gluten)</text>
<text x="500.0" y="81.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Diarrea crónica, baja de peso, distensión · anemia ferropénica sin causa · transaminasas elevadas · osteoporosis precoz</text>
<text x="500.0" y="98.1" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Dermatitis herpetiforme · familiar de primer grado · DM1, tiroiditis autoinmune, síndrome de Down o de Turner, déficit de IgA</text>
<line x1="500" y1="110" x2="500" y2="128" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="250" y="128" width="500" height="50" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="500.0" y="149.2" text-anchor="middle" font-size="12.4" font-weight="700" fill="#b35c00">IgA anti-transglutaminasa (tTG-IgA) + IgA total</text>
<text x="500.0" y="165.8" text-anchor="middle" font-size="12.4" font-weight="400" fill="#1f2933">Si ya dejó el gluten: volver a comerlo (~3 rebanadas de pan al día) por 1–3 meses antes</text>
<line x1="160" y1="196" x2="840" y2="196" stroke="#495057" stroke-width="1.6"/>
<line x1="500" y1="178" x2="500" y2="196" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="160" y1="196" x2="160" y2="214" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="500" y1="196" x2="500" y2="214" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="840" y1="196" x2="840" y2="214" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="214" width="240" height="96" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6"/>
<text x="160.0" y="233.3" text-anchor="middle" font-size="12.6" font-weight="700" fill="#6741d9">IgA total baja</text>
<text x="160.0" y="249.9" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">(déficit de IgA)</text>
<text x="160.0" y="266.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Pedir pruebas IgG:</text>
<text x="160.0" y="283.1" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">tTG-IgG o</text>
<text x="160.0" y="299.7" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">péptidos deamidados (DGP-IgG)</text>
<rect x="380" y="214" width="240" height="96" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="500.0" y="233.3" text-anchor="middle" font-size="12.6" font-weight="700" fill="#e8590c">tTG-IgA positiva</text>
<text x="500.0" y="249.9" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Endoscopía alta con</text>
<text x="500.0" y="266.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">biopsias duodenales:</text>
<text x="500.0" y="283.1" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">≥ 4 de la segunda porción</text>
<text x="500.0" y="299.7" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">+ 1–2 del bulbo</text>
<rect x="720" y="214" width="240" height="96" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="840.0" y="233.3" text-anchor="middle" font-size="12.6" font-weight="700" fill="#2f9e44">tTG-IgA negativa</text>
<text x="840.0" y="249.9" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">con IgA total normal</text>
<text x="840.0" y="266.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Celíaca improbable</text>
<text x="840.0" y="283.1" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Si la sospecha es alta:</text>
<text x="840.0" y="299.7" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">biopsia igual</text>
<line x1="160" y1="310" x2="160" y2="340" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="500" y1="310" x2="500" y2="340" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="160" y1="340" x2="500" y2="340" stroke="#495057" stroke-width="1.6"/>
<line x1="500" y1="340" x2="500" y2="358" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="500" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5f99">Histología (Marsh-Oberhuber)</text>
<rect x="40" y="390" width="220" height="120" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="150.0" y="410" text-anchor="middle" font-size="13.2" font-weight="700" fill="#c92a2a">Marsh 3</text>
<text x="150.0" y="430" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Atrofia vellositaria</text>
<text x="150.0" y="446" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">+ hiperplasia de criptas</text>
<text x="150.0" y="462" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">+ linfocitos intraepiteliales</text>
<text x="150.0" y="478" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Con serología positiva:</text>
<text x="150.0" y="494" text-anchor="middle" font-size="12.3" font-weight="700" fill="#1f2933">ENFERMEDAD CELÍACA</text>
<rect x="273" y="390" width="220" height="120" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="383.0" y="410" text-anchor="middle" font-size="13.2" font-weight="700" fill="#e8a10c">Marsh 1–2</text>
<text x="383.0" y="430" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Linfocitos intraepiteliales</text>
<text x="383.0" y="446" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">aumentados, sin atrofia</text>
<text x="383.0" y="462" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Inespecífico (AINE, H. pylori,</text>
<text x="383.0" y="478" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">SIBO, virus): considerar</text>
<text x="383.0" y="494" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">HLA, EMA, revisar biopsias</text>
<rect x="506" y="390" width="220" height="120" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6"/>
<text x="616.0" y="410" text-anchor="middle" font-size="13.2" font-weight="700" fill="#6741d9">Atrofia con serología negativa</text>
<text x="616.0" y="430" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Pensar en: giardiasis, fármacos</text>
<text x="616.0" y="446" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">(olmesartán, micofenolato),</text>
<text x="616.0" y="462" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">inmunodeficiencia común</text>
<text x="616.0" y="478" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">variable, Whipple, linfoma,</text>
<text x="616.0" y="494" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">esprúe tropical, TBC, VIH</text>
<rect x="739" y="390" width="220" height="120" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="849.0" y="410" text-anchor="middle" font-size="13.2" font-weight="700" fill="#2f9e44">Biopsia normal</text>
<text x="849.0" y="430" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Con serología positiva:</text>
<text x="849.0" y="446" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">revisar si comía gluten,</text>
<text x="849.0" y="462" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">tomar más biopsias,</text>
<text x="849.0" y="478" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">EMA y HLA-DQ2/DQ8</text>
<text x="849.0" y="494" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">(celíaca potencial)</text>
<rect x="40" y="524" width="920" height="66" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="500.0" y="544.9" text-anchor="middle" font-size="12.6" font-weight="700" fill="#495057">HLA-DQ2/DQ8: su valor está en DESCARTAR</text>
<text x="500.0" y="561.5" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Negativo: la celíaca es prácticamente imposible (útil si ya hace dieta sin gluten o hay resultados discordantes)</text>
<text x="500.0" y="578.1" text-anchor="middle" font-size="12.6" font-weight="400" fill="#1f2933">Positivo: no confirma (~30–40 % de la población lo tiene)</text>
</svg>