<text x="231.5" y="502.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Deshidratación, fiebre alta,</text>
<text x="231.5" y="518.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">convulsión febril (niños)</text>
<rect x="359.0" y="456" width="231.0" height="84" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="474.5" y="478.1" text-anchor="middle" font-size="12.2" font-weight="700" fill="#c92a2a">Riesgos</text>
<text x="474.5" y="494.3" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Fuga plasmática → shock, hemorragia,</text>
<text x="474.5" y="510.5" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">daño de órganos; vigilar los signos</text>
<text x="474.5" y="526.7" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">de alarma al caer la fiebre</text>
<rect x="602.0" y="456" width="312.0" height="84" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="758.0" y="486.2" text-anchor="middle" font-size="12.2" font-weight="700" fill="#2f9e44">Riesgos</text>
<text x="758.0" y="502.4" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Sobrecarga de volumen si se</text>
<text x="758.0" y="518.6" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">siguen dando fluidos IV</text>
<text x="480" y="566" text-anchor="middle" font-size="11.5" font-weight="400" fill="#495057">Esquema propio adaptado de las guías OMS 2009, OPS 2022 y OMS 2025 (curvas ilustrativas, sin escala).</text>
