<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">Síndrome febril prolongado (fiebre de origen desconocido): estudio por etapas</text>
<rect x="130" y="44" width="740" height="66" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="65.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5f99">1. Confirmar que es fiebre de origen desconocido (Delphi 2024)</text>
<text x="500.0" y="81.4" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Fiebre ≥ 38,3 °C en más de 3 ocasiones por más de 3 SEMANAS, sin causa pese al estudio mínimo, en un adulto inmunocompetente</text>
<text x="500.0" y="97.6" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Documentar la fiebre (registro de temperatura) · descartar fiebre facticia · suspender fármacos no esenciales</text>
<line x1="500" y1="110" x2="500" y2="126" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="126" width="940" height="82" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="500.0" y="147.1" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">2. Anamnesis y examen físico REPETIDOS en busca de pistas diagnósticas</text>
<text x="500.0" y="163.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Viajes, zona rural, animales (gatos, ganado, leche no pasteurizada), garrapatas, contacto TBC, conducta sexual, fármacos, prótesis y dispositivos</text>
<text x="500.0" y="179.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Baja de peso, sudoración, artralgias, cefalea temporal, exantema · soplos, adenopatías, hepatoesplenomegalia, arterias temporales, piel, fondo de ojo,</text>
<text x="500.0" y="195.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">dientes, senos paranasales, próstata · revisar al paciente cada día: las pistas aparecen en la evolución</text>
<line x1="500" y1="208" x2="500" y2="224" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="224" width="940" height="82" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="500.0" y="245.1" text-anchor="middle" font-size="12" font-weight="700" fill="#7048e8">3. Estudio mínimo estándar</text>
<text x="500.0" y="261.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Hemograma con fórmula, VHS, PCR, ferritina, perfil bioquímico con calcio y pruebas hepáticas, LDH, orina completa y urocultivo</text>
<text x="500.0" y="277.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">HEMOCULTIVOS (≥ 3 sets separados), VIH, IGRA o PPD · radiografía de tórax y ecografía abdominal (o TC de tórax, abdomen y pelvis)</text>
<text x="500.0" y="293.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Según el contexto: serologías (Bartonella, Brucella, Coxiella, VEB, CMV, sífilis), ANA, FR, ANCA, electroforesis, TSH, ecocardiograma</text>
<line x1="500" y1="306" x2="500" y2="322" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="322" width="940" height="66" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="500.0" y="343.2" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c">4. Sin diagnóstico: PET-TC con FDG (rendimiento ~ 50 %) y BIOPSIA dirigida de lo que capte</text>
<text x="500.0" y="359.4" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Biopsia de arteria temporal (≥ 50 años con VHS alta), médula ósea (citopenias, sospecha de linfoma o TBC miliar), hígado, ganglio, piel</text>
<text x="500.0" y="375.6" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Evitar el "tratamiento de prueba" con antibióticos o corticoides en el paciente estable: puede ocultar el diagnóstico</text>
<rect x="30" y="402" width="228" height="104" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="144.0" y="426.0" text-anchor="middle" font-size="11.8" font-weight="700" fill="#c92a2a">INFECCIONES (~ 50 %)</text>
<text x="144.0" y="442.2" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">TBC extrapulmonar,</text>
<text x="144.0" y="458.4" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">endocarditis, abscesos,</text>
<text x="144.0" y="474.6" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">brucelosis, Bartonella,</text>
<text x="144.0" y="490.8" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">VIH, VEB, CMV, fiebre Q</text>
<rect x="267" y="402" width="228" height="104" rx="8" fill="#e6fcf5" stroke="#0c8599" stroke-width="1.6"/>
<text x="381.0" y="426.0" text-anchor="middle" font-size="11.8" font-weight="700" fill="#0c8599">INFLAMATORIAS (~ 10–25 %)</text>
<text x="381.0" y="442.2" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">Arteritis de células</text>
<text x="381.0" y="458.4" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">gigantes, Still del adulto,</text>
<text x="381.0" y="474.6" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">LES, vasculitis,</text>
<text x="381.0" y="490.8" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">polimialgia, sarcoidosis</text>
<rect x="504" y="402" width="228" height="104" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="618.0" y="426.0" text-anchor="middle" font-size="11.8" font-weight="700" fill="#7048e8">NEOPLASIAS (~ 10–15 %)</text>
<text x="618.0" y="442.2" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">LINFOMA, leucemia,</text>
<text x="618.0" y="458.4" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">cáncer renal, hepático,</text>
<text x="618.0" y="474.6" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">metástasis, mixoma</text>
<text x="618.0" y="490.8" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">auricular</text>
<rect x="741" y="402" width="228" height="104" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="855.0" y="426.0" text-anchor="middle" font-size="11.8" font-weight="700" fill="#495057">OTRAS / SIN DIAGNÓSTICO</text>
<text x="855.0" y="442.2" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">Fármacos, TEP, tiroiditis,</text>
<text x="855.0" y="458.4" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">hematoma, fiebre facticia ·</text>
<text x="855.0" y="474.6" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">~ 20 % sin diagnóstico</text>
<text x="855.0" y="490.8" text-anchor="middle" font-size="11.8" font-weight="400" fill="#1f2933">(buen pronóstico)</text>
</svg>