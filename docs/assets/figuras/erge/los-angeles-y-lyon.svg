<text x="360" y="482" text-anchor="middle" font-size="13.5" fill="#1f2933">Erosiones confluentes</text>
<text x="360" y="499" text-anchor="middle" font-size="13.5" fill="#1f2933">≥ 75 % de la circunferencia</text>
<text x="725" y="60" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f5f99">Lyon 2.0: ¿hay reflujo patológico?</text>
<text x="725" y="80" text-anchor="middle" font-size="13" fill="#52606d">ERGE no demostrada, estudio SIN IBP (endoscopía y pH-metría)</text>
<rect x="490" y="96" width="470" height="114" rx="9" fill="#fde7e5" stroke="#b3261e" stroke-width="1.6"/>
<text x="504" y="119" font-size="14.5" font-weight="700" fill="#b3261e">CONCLUYENTE</text>
<text x="520" y="141" font-size="13.5" fill="#1f2933">• Esofagitis Los Ángeles B, C o D</text>
<text x="520" y="162" font-size="13.5" fill="#1f2933">• Esófago de Barrett confirmado por biopsia</text>
<text x="520" y="183" font-size="13.5" fill="#1f2933">• Estenosis péptica</text>
<text x="520" y="204" font-size="13.5" fill="#1f2933">• pH-metría: exposición ácida > 6 % del tiempo</text>
<rect x="490" y="222" width="470" height="93" rx="9" fill="#f3effa" stroke="#6b3fa0" stroke-width="1.6"/>
<text x="504" y="245" font-size="14.5" font-weight="700" fill="#6b3fa0">LIMÍTROFE</text>
<text x="520" y="267" font-size="13.5" fill="#1f2933">• Esofagitis Los Ángeles A</text>
<text x="520" y="288" font-size="13.5" fill="#1f2933">• Exposición ácida 4–6 %</text>
<text x="520" y="309" font-size="13.5" fill="#1f2933">• 40–80 episodios de reflujo al día</text>
<rect x="490" y="327" width="470" height="93" rx="9" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="504" y="350" font-size="14.5" font-weight="700" fill="#c28a12">APOYA</text>
<text x="520" y="372" font-size="13.5" fill="#1f2933">• Hernia hiatal</text>
<text x="520" y="393" font-size="13.5" fill="#1f2933">• Asociación síntoma-reflujo</text>
<text x="520" y="414" font-size="13.5" fill="#1f2933">• > 80 episodios al día</text>
<rect x="490" y="432" width="470" height="72" rx="9" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.6"/>
<text x="504" y="455" font-size="14.5" font-weight="700" fill="#1f5f99">EN CONTRA</text>
<text x="520" y="477" font-size="13.5" fill="#1f2933">• Exposición ácida &lt; 4 %</text>
<text x="520" y="498" font-size="13.5" fill="#1f2933">• &lt; 40 episodios de reflujo al día</text>
<text x="490" y="524" font-size="12.5" fill="#52606d">Exposición ácida: % del tiempo con pH &lt; 4 en la pH-metría de 24 h (o en ≥ 2 días</text>
<text x="490" y="541" font-size="12.5" fill="#52606d">con cápsula inalámbrica). La esofagitis A es frecuente en personas sanas.</text>
