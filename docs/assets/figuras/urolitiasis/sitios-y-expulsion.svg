<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="480.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Cálculos ureterales: dónde se impactan y cuántos se expulsan solos</text>
<text x="30" y="64" font-size="15" font-weight="700" fill="#1f5f99">A. Estrecheces fisiológicas del uréter</text>
<path d="M140 80 C70 80 65 220 140 220 C175 220 180 180 164 162 C176 150 176 140 164 136 C180 118 175 80 140 80 Z" fill="#e8b4a0" stroke="#9c5b45" stroke-width="2"/>
<path d="M132 130 Q158 144 172 150 Q158 158 132 172 Q146 150 132 130 Z" fill="#f6e3a1" stroke="#b58a17" stroke-width="1.5"/>
<path d="M172 150 C210 190 195 270 220 320 C240 360 245 400 290 435" fill="none" stroke="#b58a17" stroke-width="9" stroke-linecap="round"/>
<path d="M172 150 C210 190 195 270 220 320 C240 360 245 400 290 435" fill="none" stroke="#f6e3a1" stroke-width="5" stroke-linecap="round"/>
<path d="M280 270 C250 310 210 325 160 365" fill="none" stroke="#b3261e" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
<text x="110" y="388" font-size="11.5" fill="#b3261e">vasos ilíacos</text>
<ellipse cx="325" cy="450" rx="55" ry="36" fill="#f6e3a1" stroke="#b58a17" stroke-width="2"/>
<text x="325" y="455" text-anchor="middle" font-size="12" fill="#6b5410">vejiga</text>
<text x="32" y="154" text-anchor="end" font-size="12" fill="#9c5b45">riñón</text>
<circle cx="176" cy="154" r="11" fill="#1f5f99" stroke="#fff" stroke-width="1.5"/>
<text x="176" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<circle cx="212" cy="318" r="11" fill="#1f5f99" stroke="#fff" stroke-width="1.5"/>
<text x="212" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<circle cx="286" cy="432" r="11" fill="#1f5f99" stroke="#fff" stroke-width="1.5"/>
<text x="286" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<circle cx="300" cy="110" r="10" fill="#1f5f99"/>
<text x="300" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">1</text>
<text x="316" y="115" font-size="12.5" fill="#1f2933">Unión pieloureteral</text>
<circle cx="300" cy="140" r="10" fill="#1f5f99"/>
<text x="300" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">2</text>
<text x="316" y="145" font-size="12.5" fill="#1f2933">Cruce de los vasos ilíacos</text>
<circle cx="300" cy="170" r="10" fill="#1f5f99"/>
<text x="300" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">3</text>
<text x="316" y="175" font-size="12.5" fill="#1f2933">Unión ureterovesical (la más estrecha)</text>
<text x="290" y="220" font-size="12.5" fill="#1f2933">El dolor migra con el cálculo:</text>
<text x="290" y="238" font-size="12.5" fill="#1f2933">fosa lumbar → flanco → fosa ilíaca</text>
<text x="290" y="256" font-size="12.5" fill="#1f2933">→ genitales; síntomas urinarios</text>
<text x="290" y="274" font-size="12.5" fill="#1f2933">bajos cerca de la vejiga.</text>
<text x="560" y="64" font-size="15" font-weight="700" fill="#b3261e">B. Expulsión espontánea según el tamaño</text>
<text x="590" y="144" text-anchor="end" font-size="14" font-weight="700" fill="#1f2933">≤ 5 mm</text>
<rect x="600" y="120" width="300" height="36" rx="6" fill="#eef1f4"/>
<rect x="600" y="120" width="204.0" height="36" rx="6" fill="#2e7d4f"/>
<text x="812.0" y="144" font-size="15" font-weight="700" fill="#2e7d4f">~ 68 %</text>
<text x="590" y="214" text-anchor="end" font-size="14" font-weight="700" fill="#1f2933">5–10 mm</text>
<rect x="600" y="190" width="300" height="36" rx="6" fill="#eef1f4"/>
<rect x="600" y="190" width="141.0" height="36" rx="6" fill="#c77d0a"/>
<text x="749.0" y="214" font-size="15" font-weight="700" fill="#c77d0a">~ 47 %</text>
<text x="590" y="284" text-anchor="end" font-size="14" font-weight="700" fill="#1f2933">&gt; 10 mm</text>
<rect x="600" y="260" width="300" height="36" rx="6" fill="#eef1f4"/>
<text x="610" y="284" font-size="13" fill="#b3261e">Rara vez pasa: tratamiento urológico</text>
<text x="540" y="330" font-size="11.5" fill="#52606d">Porcentaje aproximado de expulsión (metaanálisis de la guía AUA/EAU 2007).</text>
<text x="540" y="346" font-size="11.5" fill="#52606d">Los cálculos distales pasan más que los proximales.</text>
<rect x="540" y="372" width="200" height="92" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
<text x="640" y="394" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2e7d4f">Manejo expectante</text>
<text x="640" y="414" text-anchor="middle" font-size="11.5" fill="#1f2933">Dolor controlado, sin infección,</text>
<text x="640" y="430" text-anchor="middle" font-size="11.5" fill="#1f2933">riñón funcionante, ≤ 10 mm:</text>
<text x="640" y="446" text-anchor="middle" font-size="11.5" fill="#1f2933">AINE + control (4–6 semanas)</text>
<rect x="750" y="372" width="200" height="92" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
<text x="850" y="394" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b3261e">Drenaje urgente</text>
<text x="850" y="414" text-anchor="middle" font-size="11.5" fill="#1f2933">Fiebre u obstrucción infectada,</text>
<text x="850" y="430" text-anchor="middle" font-size="11.5" fill="#1f2933">anuria o riñón único obstruido,</text>
<text x="850" y="446" text-anchor="middle" font-size="11.5" fill="#1f2933">LRA, dolor intratable</text>
<text x="20" y="508" font-size="11.5" fill="#52606d">Esquema propio basado en Preminger et al. (guía AUA/EAU 2007) y en las guías EAU y AUA vigentes. Porcentajes aproximados.</text>
</svg>