<text x="44" y="228" font-size="12.5" font-weight="700" fill="#b3261e">Intensidad del dolor</text>
<text x="480" y="352" text-anchor="middle" font-size="12.5" fill="#52606d">Tiempo →</text>
<text x="535" y="232" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b3261e">Tratar precozmente, al inicio del dolor</text>
<text x="14" y="388" font-size="11.5" fill="#52606d">Esquema propio basado en la ICHD-3. No todas las crisis tienen todas las fases. El aura típica dura 5–60 minutos y es totalmente reversible.</text>
</svg>