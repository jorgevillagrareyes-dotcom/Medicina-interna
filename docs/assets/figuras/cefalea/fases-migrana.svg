<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="960" height="400" fill="#ffffff"/>
<text x="480.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Fases de una crisis de migraña</text>
<rect x="40" y="70" width="180" height="46" rx="8" fill="#52606d"/>
<text x="130.0" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Pródromo</text>
<text x="130.0" y="109" text-anchor="middle" font-size="12" fill="#ffffff">horas a 2 días antes</text>
<text x="130.0" y="142" text-anchor="middle" font-size="13" fill="#1f2933">Bostezos, cansancio,</text>
<text x="130.0" y="159" text-anchor="middle" font-size="13" fill="#1f2933">irritabilidad, antojos,</text>
<text x="130.0" y="176" text-anchor="middle" font-size="13" fill="#1f2933">rigidez de cuello,</text>
<text x="130.0" y="193" text-anchor="middle" font-size="13" fill="#1f2933">fotofobia</text>
<rect x="230" y="70" width="130" height="46" rx="8" fill="#6d28d9"/>
<text x="295.0" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Aura (~ 1/3)</text>
<text x="295.0" y="109" text-anchor="middle" font-size="12" fill="#ffffff">5–60 min</text>
<text x="295.0" y="142" text-anchor="middle" font-size="13" fill="#1f2933">Visual (espectro de</text>
<text x="295.0" y="159" text-anchor="middle" font-size="13" fill="#1f2933">fortificación, escotoma),</text>
<text x="295.0" y="176" text-anchor="middle" font-size="13" fill="#1f2933">sensitiva, del lenguaje;</text>
<text x="295.0" y="193" text-anchor="middle" font-size="13" fill="#1f2933">progresa gradualmente</text>
<rect x="370" y="70" width="330" height="46" rx="8" fill="#b3261e"/>
<text x="535.0" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Cefalea</text>
<text x="535.0" y="109" text-anchor="middle" font-size="12" fill="#ffffff">4–72 horas</text>
<text x="535.0" y="142" text-anchor="middle" font-size="13" fill="#1f2933">Unilateral, pulsátil,</text>
<text x="535.0" y="159" text-anchor="middle" font-size="13" fill="#1f2933">moderada a intensa,</text>
<text x="535.0" y="176" text-anchor="middle" font-size="13" fill="#1f2933">empeora con la actividad;</text>
<text x="535.0" y="193" text-anchor="middle" font-size="13" fill="#1f2933">náuseas, fotofobia y</text>
<text x="535.0" y="210" text-anchor="middle" font-size="13" fill="#1f2933">fonofobia</text>
<rect x="710" y="70" width="210" height="46" rx="8" fill="#12474f"/>
<text x="815.0" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Pósdromo</text>
<text x="815.0" y="109" text-anchor="middle" font-size="12" fill="#ffffff">horas a 1 día</text>
<text x="815.0" y="142" text-anchor="middle" font-size="13" fill="#1f2933">Cansancio, dificultad</text>
<text x="815.0" y="159" text-anchor="middle" font-size="13" fill="#1f2933">para concentrarse,</text>
<text x="815.0" y="176" text-anchor="middle" font-size="13" fill="#1f2933">sensación de "resaca"</text>
<line x1="40" y1="330" x2="920" y2="330" stroke="#1f2933" stroke-width="1.3"/>
