<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="960" height="560" fill="#ffffff"/>
<text x="480.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Umbrales glicémicos: respuesta del organismo y niveles de hipoglicemia (ADA)</text>
<text x="180" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#12474f">Respuesta fisiológica</text>
<text x="515" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#12474f">Nivel ADA</text>
<rect x="440" y="80" width="150" height="150" fill="#dcefe3"/>
<text x="515" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#1e6b3a">Normal</text>
<text x="515" y="170" text-anchor="middle" font-size="12.5" fill="#1e6b3a">≥ 70 mg/dL</text>
<rect x="440" y="230" width="150" height="80" fill="#fbe7b5"/>
<text x="515" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#7a5200">Nivel 1</text>
<text x="515" y="285" text-anchor="middle" font-size="12.5" fill="#7a5200">54–69 mg/dL</text>
<rect x="440" y="310" width="150" height="170" fill="#f6c9c3"/>
<text x="515" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#8a1c14">Nivel 2</text>
<text x="515" y="410" text-anchor="middle" font-size="12.5" fill="#8a1c14">&lt; 54 mg/dL</text>
<line x1="430" y1="80.0" x2="430" y2="480.0" stroke="#1f2933" stroke-width="2"/>
<line x1="425" y1="480.0" x2="435" y2="480.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="484.0" text-anchor="end" font-size="11.5" fill="#52606d">20</text>
<line x1="425" y1="430.0" x2="435" y2="430.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="434.0" text-anchor="end" font-size="11.5" fill="#52606d">30</text>
<line x1="425" y1="380.0" x2="435" y2="380.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="384.0" text-anchor="end" font-size="11.5" fill="#52606d">40</text>
<line x1="425" y1="330.0" x2="435" y2="330.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="334.0" text-anchor="end" font-size="11.5" fill="#52606d">50</text>
<line x1="425" y1="280.0" x2="435" y2="280.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="284.0" text-anchor="end" font-size="11.5" fill="#52606d">60</text>
<line x1="425" y1="230.0" x2="435" y2="230.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="234.0" text-anchor="end" font-size="11.5" fill="#52606d">70</text>
<line x1="425" y1="180.0" x2="435" y2="180.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="184.0" text-anchor="end" font-size="11.5" fill="#52606d">80</text>
<line x1="425" y1="130.0" x2="435" y2="130.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="134.0" text-anchor="end" font-size="11.5" fill="#52606d">90</text>
<line x1="425" y1="80.0" x2="435" y2="80.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="421" y="84.0" text-anchor="end" font-size="11.5" fill="#52606d">100</text>
<text x="430" y="502.0" text-anchor="middle" font-size="12" fill="#52606d">glicemia (mg/dL)</text>
<line x1="400" y1="170" x2="428" y2="170" stroke="#b3261e" stroke-width="2"/>
<circle cx="430" cy="170" r="4" fill="#b3261e"/>
<text x="394" y="174" text-anchor="end" font-size="12.5" font-weight="700" fill="#b3261e">~ 80–85</text>
<text x="20" y="174" font-size="12.5" fill="#1f2933">1.ª defensa: baja la secreción de insulina</text>
<line x1="400" y1="240" x2="428" y2="240" stroke="#b3261e" stroke-width="2"/>
<circle cx="430" cy="240" r="4" fill="#b3261e"/>
<text x="394" y="244" text-anchor="end" font-size="12.5" font-weight="700" fill="#b3261e">~ 65–70</text>
<text x="20" y="244" font-size="12.5" fill="#1f2933">2.ª y 3.ª defensas: sube el glucagón y la adrenalina</text>
<text x="20" y="260" font-size="12.5" fill="#52606d">(también cortisol y hormona de crecimiento)</text>
<line x1="400" y1="315" x2="428" y2="315" stroke="#b3261e" stroke-width="2"/>
<circle cx="430" cy="315" r="4" fill="#b3261e"/>
<text x="394" y="319" text-anchor="end" font-size="12.5" font-weight="700" fill="#b3261e">~ 50–55</text>
<text x="20" y="319" font-size="12.5" fill="#1f2933">Síntomas autonómicos → comer (4.ª defensa)</text>
<line x1="400" y1="345" x2="428" y2="345" stroke="#b3261e" stroke-width="2"/>
<circle cx="430" cy="345" r="4" fill="#b3261e"/>
<text x="394" y="349" text-anchor="end" font-size="12.5" font-weight="700" fill="#b3261e">&lt; 50</text>
<text x="20" y="349" font-size="12.5" fill="#1f2933">Neuroglucopenia: confusión, conducta anormal</text>
<line x1="400" y1="440" x2="428" y2="440" stroke="#b3261e" stroke-width="2"/>
<circle cx="430" cy="440" r="4" fill="#b3261e"/>
<text x="394" y="444" text-anchor="end" font-size="12.5" font-weight="700" fill="#b3261e">&lt; 30</text>
<text x="20" y="444" font-size="12.5" fill="#1f2933">Convulsiones, coma; si se prolonga, daño neuronal</text>
<rect x="640" y="88" width="300" height="98" rx="6" fill="#f4f7f8" stroke="#c9d6d9"/>
<text x="654" y="110" font-size="14" font-weight="700" fill="#8a1c14">Nivel 3 (grave)</text>
<text x="654" y="129" font-size="12.5" fill="#1f2933">Evento con alteración mental o</text>
<text x="654" y="146" font-size="12.5" fill="#1f2933">física que requiere ayuda de otra</text>
<text x="654" y="163" font-size="12.5" fill="#1f2933">persona para recuperarse,</text>
<text x="654" y="180" font-size="12.5" fill="#1f2933">con cualquier valor de glicemia.</text>
<rect x="640" y="216" width="300" height="115" rx="6" fill="#f4f7f8" stroke="#c9d6d9"/>
<text x="654" y="238" font-size="14" font-weight="700" fill="#12474f">Hipoglicemia inadvertida</text>
<text x="654" y="257" font-size="12.5" fill="#1f2933">En la DM1, la DM2 avanzada y tras</text>
<text x="654" y="274" font-size="12.5" fill="#1f2933">hipoglicemias repetidas, estos</text>
<text x="654" y="291" font-size="12.5" fill="#1f2933">umbrales bajan: los síntomas de</text>
<text x="654" y="308" font-size="12.5" fill="#1f2933">alarma aparecen tarde o no aparecen,</text>
<text x="654" y="325" font-size="12.5" fill="#1f2933">y el primer signo es la neuroglucopenia.</text>
<text x="14" y="550" font-size="11.5" fill="#52606d">Esquema propio basado en los umbrales descritos por Cryer (Endocrine Society 2009) y en los niveles de la ADA 2026. 70 mg/dL = 3,9 mmol/L; 54 mg/dL = 3,0 mmol/L.</text>
</svg>