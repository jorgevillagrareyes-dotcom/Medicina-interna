<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="466" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">Detección y diagnóstico de la diabetes en el embarazo (Chile, Guía Perinatal MINSAL 2015)</text>
<rect x="300" y="44" width="400" height="50" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="65.3" text-anchor="middle" font-size="12.3" font-weight="700" fill="#1f5f99">1er control prenatal (1er trimestre)</text>
<text x="500.0" y="81.7" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Glicemia de ayuno a TODAS las embarazadas</text>
<line x1="160" y1="110" x2="840" y2="110" stroke="#495057" stroke-width="1.6"/>
<line x1="500" y1="94" x2="500" y2="110" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="160" y1="110" x2="160" y2="126" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="500" y1="110" x2="500" y2="126" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="840" y1="110" x2="840" y2="126" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="126" width="240" height="66" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="160.0" y="147.1" text-anchor="middle" font-size="12.3" font-weight="700" fill="#2f9e44">&lt; 100 mg/dL</text>
<text x="160.0" y="163.5" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Normal: PTGO con 75 g</text>
<text x="160.0" y="179.9" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">a las 24–28 semanas</text>
<rect x="380" y="126" width="240" height="66" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="500.0" y="147.1" text-anchor="middle" font-size="12.3" font-weight="700" fill="#b35c00">100–125 mg/dL</text>
<text x="500.0" y="163.5" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">Repetir en ≤ 7 días</text>
<text x="500.0" y="179.9" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">(con alimentación normal)</text>
<rect x="720" y="126" width="240" height="66" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="840.0" y="147.1" text-anchor="middle" font-size="12.3" font-weight="700" fill="#c92a2a">≥ 126 mg/dL (2 veces)</text>
<text x="840.0" y="163.5" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">o ≥ 200 mg/dL con síntomas</text>
<text x="840.0" y="179.9" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">o PTGO 2 h ≥ 200 mg/dL</text>
<line x1="500" y1="192" x2="500" y2="208" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="840" y1="192" x2="840" y2="208" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="380" y="208" width="240" height="50" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="500.0" y="229.3" text-anchor="middle" font-size="12.3" font-weight="700" fill="#e8590c">Confirma 100–125 mg/dL</text>
<text x="500.0" y="245.7" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">→ DIABETES GESTACIONAL</text>
<rect x="720" y="208" width="240" height="50" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="840.0" y="229.3" text-anchor="middle" font-size="12.3" font-weight="700" fill="#c92a2a">DIABETES PREGESTACIONAL</text>
<text x="840.0" y="245.7" text-anchor="middle" font-size="12.3" font-weight="400" fill="#1f2933">(toda DM del 1er trimestre)</text>
<line x1="160" y1="192" x2="160" y2="274" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="274" width="400" height="74" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="240.0" y="290.9" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44">PTGO 75 g a las 24–28 semanas (glicemia en ayunas y a las 2 h)</text>
<text x="240.0" y="307.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Ayuno ≥ 100 mg/dL y/o 2 h ≥ 140 mg/dL → DIABETES GESTACIONAL</text>
<text x="240.0" y="323.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Normal → se descarta (repetir a las 30–33 semanas si hay</text>
<text x="240.0" y="340.1" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">polihidroamnios, macrosomía o aumento de peso excesivo)</text>
<rect x="460" y="274" width="500" height="74" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="710.0" y="290.9" text-anchor="middle" font-size="12" font-weight="700" fill="#7048e8">Comparación: criterios IADPSG / ADA 2026 (PTGO 75 g, 24–28 semanas)</text>
<text x="710.0" y="307.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Ayuno ≥ 92 · 1 hora ≥ 180 · 2 horas ≥ 153 mg/dL (basta UN valor)</text>
<text x="710.0" y="323.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Más sensibles: diagnostican más diabetes gestacional</text>
<text x="710.0" y="340.1" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">La PTGO está contraindicada tras una cirugía bariátrica (perfil capilar)</text>
<rect x="40" y="362" width="920" height="92" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="500.0" y="387.9" text-anchor="middle" font-size="12.2" font-weight="700" fill="#495057">Después del diagnóstico</text>
<text x="500.0" y="404.3" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Diabetes gestacional: alimentación + automonitoreo por 2 semanas → INSULINA (NPH ± rápida) si no se logran las metas</text>
<text x="500.0" y="420.7" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Metas: ayuno 60–90 mg/dL, 1 h posprandial &lt; 140 mg/dL, 2 h &lt; 120 mg/dL (MINSAL) · HbA1c &lt; 6 % en la pregestacional</text>
<text x="500.0" y="437.1" text-anchor="middle" font-size="12.2" font-weight="400" fill="#1f2933">Posparto: PTGO a las 6–12 semanas en toda mujer con diabetes gestacional; luego tamizaje cada 1–3 años (alto riesgo de DM2)</text>
</svg>