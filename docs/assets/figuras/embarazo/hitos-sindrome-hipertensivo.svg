<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="980" height="520" fill="#ffffff"/>
<text x="490.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Trastornos hipertensivos del embarazo: hitos para decidir</text>
<rect x="60.0" y="234" width="246.7" height="32" fill="#eef1f4" stroke="#cbd2d9"/>
<text x="68.0" y="255" font-size="12.5" fill="#52606d">1.er trimestre</text>
<rect x="306.7" y="234" width="246.7" height="32" fill="#f6f7f9" stroke="#cbd2d9"/>
<text x="314.7" y="255" font-size="12.5" fill="#52606d">2.º trimestre</text>
<rect x="553.3" y="234" width="246.7" height="32" fill="#eef1f4" stroke="#cbd2d9"/>
<text x="561.3" y="255" font-size="12.5" fill="#52606d">3.er trimestre</text>
<rect x="830" y="234" width="120" height="32" fill="#fdecea" stroke="#e3b5b0"/>
<text x="890.0" y="255" text-anchor="middle" font-size="12.5" fill="#b3261e">Posparto (6 sem)</text>
<text x="60.0" y="284" text-anchor="middle" font-size="11.5" fill="#52606d">0</text>
<text x="236.2" y="284" text-anchor="middle" font-size="11.5" fill="#52606d">10</text>
<text x="412.4" y="284" text-anchor="middle" font-size="11.5" fill="#52606d">20</text>
<text x="588.6" y="284" text-anchor="middle" font-size="11.5" fill="#52606d">30</text>
<text x="764.8" y="284" text-anchor="middle" font-size="11.5" fill="#52606d">40</text>
<text x="430.0" y="302" text-anchor="middle" font-size="12" fill="#52606d">Semanas de gestación</text>
<circle cx="280.2" cy="250" r="7" fill="#2e7d4f"/>
<line x1="280.2" y1="230" x2="280.2" y2="155" stroke="#2e7d4f" stroke-width="1.5"/>
<rect x="175.2" y="62" width="210" height="101" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="185.2" y="80" font-size="13" font-weight="700" fill="#2e7d4f">11–14 semanas</text>
<text x="185.2" y="97" font-size="11.8" fill="#1f2933">Evaluar el riesgo (factores clínicos,</text>
<text x="185.2" y="112" font-size="11.8" fill="#1f2933">± Doppler de arterias uterinas).</text>
<text x="185.2" y="127" font-size="11.8" fill="#1f2933">Alto riesgo: aspirina 100–150 mg</text>
<text x="185.2" y="142" font-size="11.8" fill="#1f2933">de noche desde antes de las</text>
<text x="185.2" y="157" font-size="11.8" fill="#1f2933">16 semanas hasta las 36</text>
<circle cx="412.4" cy="250" r="7" fill="#1f5f99"/>
<line x1="412.4" y1="268" x2="412.4" y2="322" stroke="#1f5f99" stroke-width="1.5"/>
<rect x="307.4" y="322" width="210" height="86" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.6"/>
<text x="317.4" y="340" font-size="13" font-weight="700" fill="#1f5f99">20 semanas: la línea divisoria</text>
<text x="317.4" y="357" font-size="11.8" fill="#1f2933">HTA antes: crónica (preexistente)</text>
<text x="317.4" y="372" font-size="11.8" fill="#1f2933">HTA nueva después: gestacional</text>
<text x="317.4" y="387" font-size="11.8" fill="#1f2933">o preeclampsia (± proteinuria,</text>
<text x="317.4" y="402" font-size="11.8" fill="#1f2933">daño de órganos o de la placenta)</text>
<circle cx="659.0" cy="250" r="7" fill="#b3261e"/>
<line x1="659.0" y1="230" x2="659.0" y2="155" stroke="#b3261e" stroke-width="1.5"/>
<rect x="554.0" y="62" width="210" height="101" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/>
<text x="564.0" y="80" font-size="13" font-weight="700" fill="#b3261e">34 semanas</text>
<text x="564.0" y="97" font-size="11.8" fill="#1f2933">Preeclampsia con criterios</text>
<text x="564.0" y="112" font-size="11.8" fill="#1f2933">de gravedad: interrumpir</text>
<text x="564.0" y="127" font-size="11.8" fill="#1f2933">(antes, si la madre o el feto</text>
<text x="564.0" y="142" font-size="11.8" fill="#1f2933">se deterioran). Corticoides</text>
<text x="564.0" y="157" font-size="11.8" fill="#1f2933">si &lt; 34 semanas</text>
<circle cx="711.9" cy="250" r="7" fill="#c77d0a"/>
<line x1="711.9" y1="268" x2="711.9" y2="322" stroke="#c77d0a" stroke-width="1.5"/>
<rect x="521.9" y="322" width="210" height="86" rx="8" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/>
<text x="531.9" y="340" font-size="13" font-weight="700" fill="#c77d0a">37 semanas</text>
<text x="531.9" y="357" font-size="11.8" fill="#1f2933">Preeclampsia sin criterios de</text>
<text x="531.9" y="372" font-size="11.8" fill="#1f2933">gravedad e HTA gestacional:</text>
<text x="531.9" y="387" font-size="11.8" fill="#1f2933">interrumpir. HTA crónica con</text>
<text x="531.9" y="402" font-size="11.8" fill="#1f2933">buen control: 38 semanas</text>
<line x1="890.0" y1="268" x2="890.0" y2="322" stroke="#b3261e" stroke-width="1.5"/>
<rect x="772" y="322" width="200" height="116" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/>
<text x="782" y="340" font-size="13" font-weight="700" fill="#b3261e">Posparto y después</text>
<text x="782" y="357" font-size="11.8" fill="#1f2933">Puede aparecer o empeorar hasta</text>
<text x="782" y="372" font-size="11.8" fill="#1f2933">6 semanas después del parto.</text>
<text x="782" y="387" font-size="11.8" fill="#1f2933">Sulfato de magnesio 24 h.</text>
<text x="782" y="402" font-size="11.8" fill="#1f2933">Control de PA en la 1.ª semana.</text>
<text x="782" y="417" font-size="11.8" fill="#1f2933">Riesgo CV de por vida: ~ 3,7 veces</text>
<text x="782" y="432" font-size="11.8" fill="#1f2933">más HTA crónica</text>
<text x="20" y="506" font-size="11.5" fill="#52606d">Esquema propio basado en ACOG 2020, ISSHP 2021, la Guía Perinatal MINSAL 2015, el ensayo ASPRE (2017) y Bellamy (BMJ 2007).</text>
</svg>