<text x="775" y="256" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Se pierden las mitades temporales (externas): choca con</text>
<text x="775" y="272" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">las puertas y no ve a los lados al manejar</text>
