<text x="260" y="442" text-anchor="start" font-size="13" font-weight="700" fill="#495057">Consecuencia</text>
<circle cx="64" cy="464" r="6" fill="#e67700"/>
<text x="78" y="468" text-anchor="start" font-size="13" font-weight="700" fill="#e67700">Quiasma óptico</text>
<text x="260" y="468" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Hemianopsia bitemporal, baja de agudeza visual, atrofia óptica</text>
<circle cx="64" cy="494" r="6" fill="#1c7ed6"/>
<text x="78" y="498" text-anchor="start" font-size="13" font-weight="700" fill="#1c7ed6">Seno cavernoso</text>
<text x="260" y="498" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Diplopía y ptosis (III, IV, VI), dolor facial (V1, V2)</text>
<circle cx="64" cy="524" r="6" fill="#862e9c"/>
<text x="78" y="528" text-anchor="start" font-size="13" font-weight="700" fill="#862e9c">Tallo hipofisario</text>
<text x="260" y="528" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Hiperprolactinemia leve ("efecto tallo": se pierde la inhibición por dopamina)</text>
<circle cx="64" cy="554" r="6" fill="#2f9e44"/>
<text x="78" y="558" text-anchor="start" font-size="13" font-weight="700" fill="#2f9e44">Hipófisis normal</text>
<text x="260" y="558" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Hipopituitarismo: GH, LH y FSH, luego TSH y ACTH</text>
<circle cx="64" cy="584" r="6" fill="#c92a2a"/>
<text x="78" y="588" text-anchor="start" font-size="13" font-weight="700" fill="#c92a2a">Hemorragia o infarto</text>
<text x="260" y="588" text-anchor="start" font-size="13" font-weight="400" fill="#1f2933">Apoplejía: cefalea súbita, alteración visual, insuficiencia suprarrenal aguda</text>
