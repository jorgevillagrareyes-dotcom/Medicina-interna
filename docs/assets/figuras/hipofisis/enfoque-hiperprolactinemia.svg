<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="548" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Hiperprolactinemia: enfoque diagnóstico</text>
<rect x="260" y="42" width="480" height="54" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="65.0" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1f2933">Prolactina elevada</text>
<text x="500.0" y="82.0" text-anchor="middle" font-size="12.8" fill="#1f2933">Galactorrea, oligo o amenorrea, infertilidad, baja de libido, disfunción eréctil</text>
<line x1="500" y1="96" x2="500" y2="114" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="130" y="114" width="740" height="92" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="500.0" y="139.0" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">1. Descartar causas no tumorales</text>
<text x="500.0" y="156.0" text-anchor="middle" font-size="12.6" fill="#1f2933">Embarazo y lactancia · fármacos (antipsicóticos, metoclopramida, domperidona, antidepresivos, opioides, verapamilo)</text>
<text x="500.0" y="173.0" text-anchor="middle" font-size="12.6" fill="#1f2933">Hipotiroidismo primario (TSH) · ERC (creatinina) · cirrosis · estrés de la venopunción</text>
<text x="500.0" y="190.0" text-anchor="middle" font-size="12.6" fill="#1f2933">Macroprolactina (forma inactiva) si no hay síntomas</text>
<line x1="870" y1="160" x2="905" y2="160" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="874" y="152" text-anchor="start" font-size="12.5" font-weight="700" fill="#2f9e44">Sí</text>
<rect x="905" y="120" width="80" height="80" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.6"/>
<text x="945.0" y="139.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2933">Tratar</text>
<text x="945.0" y="156.0" text-anchor="middle" font-size="12" fill="#1f2933">la causa</text>
<text x="945.0" y="173.0" text-anchor="middle" font-size="12" fill="#1f2933">o cambiar</text>
<text x="945.0" y="190.0" text-anchor="middle" font-size="12" fill="#1f2933">el fármaco</text>
<line x1="500" y1="206" x2="500" y2="226" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="508" y="221" text-anchor="start" font-size="12.5" font-weight="700" fill="#b3261e">No</text>
<rect x="300" y="226" width="400" height="40" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="250.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">2. RM de silla turca con gadolinio</text>
<line x1="500" y1="266" x2="500" y2="286" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="26" y="306" width="228" height="140" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.5"/>
<text x="140.0" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6741d9">Microprolactinoma</text>
<text x="140.0" y="350" text-anchor="middle" font-size="12.6" fill="#1f2933">Adenoma &lt; 10 mm</text>
<text x="140.0" y="366" text-anchor="middle" font-size="12.6" fill="#1f2933">PRL habitualmente</text>
<text x="140.0" y="382" text-anchor="middle" font-size="12.6" fill="#1f2933">moderada</text>
<text x="140.0" y="398" text-anchor="middle" font-size="12.6" fill="#1f2933">Cabergolina si hay</text>
<text x="140.0" y="414" text-anchor="middle" font-size="12.6" fill="#1f2933">síntomas (hipogonadismo,</text>
<text x="140.0" y="430" text-anchor="middle" font-size="12.6" fill="#1f2933">infertilidad, galactorrea)</text>
<rect x="262" y="306" width="228" height="140" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
<text x="376.0" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c2255c">Macroprolactinoma</text>
<text x="376.0" y="350" text-anchor="middle" font-size="12.6" fill="#1f2933">Adenoma ≥ 10 mm</text>
<text x="376.0" y="366" text-anchor="middle" font-size="12.6" fill="#1f2933">PRL muy alta</text>
<text x="376.0" y="382" text-anchor="middle" font-size="12.6" fill="#1f2933">(&gt; 250 µg/L)</text>
<text x="376.0" y="398" text-anchor="middle" font-size="12.6" fill="#1f2933">Cabergolina (primera</text>
<text x="376.0" y="414" text-anchor="middle" font-size="12.6" fill="#1f2933">línea, aun con alteración</text>
<text x="376.0" y="430" text-anchor="middle" font-size="12.6" fill="#1f2933">visual); campo visual</text>
<rect x="498" y="306" width="228" height="140" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
<text x="612.0" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e8590c">Macroadenoma con PRL</text>
<text x="612.0" y="350" text-anchor="middle" font-size="12.6" fill="#1f2933">poco elevada</text>
<text x="612.0" y="366" text-anchor="middle" font-size="12.6" fill="#1f2933">(&lt; 100 µg/L)</text>
<text x="612.0" y="382" text-anchor="middle" font-size="12.6" fill="#1f2933">Efecto tallo: adenoma</text>
<text x="612.0" y="398" text-anchor="middle" font-size="12.6" fill="#1f2933">no funcionante</text>
<text x="612.0" y="414" text-anchor="middle" font-size="12.6" fill="#1f2933">Cirugía si compresión</text>
<text x="612.0" y="430" text-anchor="middle" font-size="12.6" fill="#1f2933">visual; o efecto gancho</text>
<rect x="734" y="306" width="228" height="140" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
<text x="848.0" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#868e96">RM normal</text>
<text x="848.0" y="350" text-anchor="middle" font-size="12.6" fill="#1f2933">Hiperprolactinemia</text>
<text x="848.0" y="366" text-anchor="middle" font-size="12.6" fill="#1f2933">idiopática o</text>
<text x="848.0" y="382" text-anchor="middle" font-size="12.6" fill="#1f2933">microadenoma no visible</text>
<text x="848.0" y="398" text-anchor="middle" font-size="12.6" fill="#1f2933">Cabergolina si hay</text>
<text x="848.0" y="414" text-anchor="middle" font-size="12.6" fill="#1f2933">síntomas; controlar</text>
<text x="848.0" y="430" text-anchor="middle" font-size="12.6" fill="#1f2933">con PRL</text>
<line x1="140" y1="296" x2="860" y2="296" stroke="#495057" stroke-width="1.6"/>
<line x1="140.0" y1="296" x2="140.0" y2="306" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="376.0" y1="296" x2="376.0" y2="306" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="612.0" y1="296" x2="612.0" y2="306" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="848.0" y1="296" x2="848.0" y2="306" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="60" y="462" width="880" height="74" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.6"/>
<text x="500.0" y="486.5" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">Efecto gancho (hook): un macroadenoma gigante con PRL "normal o poco alta" puede tener PRL muy alta en realidad</text>
<text x="500.0" y="503.5" text-anchor="middle" font-size="12.6" fill="#1f2933">Pedir que el laboratorio diluya la muestra (1:100) antes de concluir que es un adenoma no funcionante.</text>
<text x="500.0" y="520.5" text-anchor="middle" font-size="12.6" fill="#1f2933">Además, en todo macroadenoma: campo visual, función hipofisaria (cortisol, T4 libre, IGF-1, gonadotropinas).</text>
</svg>