<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 586" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="586" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Fiebre tifoidea sin tratamiento: curso clínico y rendimiento de los exámenes</text>
<rect x="168.0" y="44" width="159.6" height="44" rx="5" fill="#868e96"/>
<text x="247.8" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Incubación</text>
<text x="247.8" y="80" text-anchor="middle" font-size="12.5" fill="#ffffff">7–21 días (hasta ~6 sem.)</text>
<rect x="331.6" y="44" width="159.6" height="44" rx="5" fill="#1f5f99"/>
<text x="411.40000000000003" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Semana 1</text>
<text x="411.40000000000003" y="80" text-anchor="middle" font-size="12.5" fill="#ffffff">bacteriemia</text>
<rect x="495.2" y="44" width="159.6" height="44" rx="5" fill="#d9480f"/>
<text x="575.0" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Semana 2</text>
<text x="575.0" y="80" text-anchor="middle" font-size="12.5" fill="#ffffff">estado de enfermedad</text>
<rect x="658.8" y="44" width="159.6" height="44" rx="5" fill="#b3261e"/>
<text x="738.5999999999999" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Semana 3</text>
<text x="738.5999999999999" y="80" text-anchor="middle" font-size="12.5" fill="#ffffff">complicaciones</text>
<rect x="822.4" y="44" width="159.6" height="44" rx="5" fill="#2f9e44"/>
<text x="902.1999999999999" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Semana 4 y más</text>
<text x="902.1999999999999" y="80" text-anchor="middle" font-size="12.5" fill="#ffffff">convalecencia</text>
<rect x="16" y="96" width="146" height="106" rx="4" fill="#e7f0f8"/>
<text x="24" y="142" font-size="13" font-weight="700" fill="#1f5f99">Temperatura</text>
<text x="24" y="159" font-size="12" fill="#1f5f99">(°C)</text>
<line x1="168" y1="180.9" x2="982" y2="180.9" stroke="#e9ecef"/>
<text x="164" y="184.9" text-anchor="end" font-size="10.5" fill="#868e96">37</text>
<line x1="168" y1="158.8" x2="982" y2="158.8" stroke="#e9ecef"/>
<text x="164" y="162.8" text-anchor="end" font-size="10.5" fill="#868e96">38</text>
<line x1="168" y1="136.7" x2="982" y2="136.7" stroke="#e9ecef"/>
<text x="164" y="140.7" text-anchor="end" font-size="10.5" fill="#868e96">39</text>
<line x1="168" y1="114.6" x2="982" y2="114.6" stroke="#e9ecef"/>
<text x="164" y="118.6" text-anchor="end" font-size="10.5" fill="#868e96">40</text>
<polyline fill="none" stroke="#b3261e" stroke-width="2.2" points="168.0,185.4 327.6,183.2 331.6,183.2 343.3,172.1 355.0,174.8 366.7,163.7 378.3,166.4 390.0,155.3 401.7,158.0 413.4,146.9 425.1,149.6 436.8,138.5 448.5,141.2 460.1,130.1 471.8,132.8 483.5,121.7 495.2,121.3 506.9,119.1 518.6,116.8 530.3,119.1 541.9,121.3 553.6,119.1 565.3,116.8 577.0,119.1 588.7,121.3 600.4,119.1 612.1,116.8 623.7,119.1 635.4,121.3 647.1,119.1 658.8,116.8 670.5,119.1 682.2,121.3 693.9,119.1 705.5,116.8 717.2,119.1 728.9,121.3 740.6,119.1 752.3,116.8 764.0,119.1 775.7,121.3 787.3,119.1 799.0,116.8 810.7,119.1 822.4,123.5 834.1,132.3 845.8,132.3 857.5,141.2 869.1,141.2 880.8,150.0 892.5,150.0 904.2,158.8 915.9,158.8 927.6,167.7 939.3,167.7 950.9,176.5 962.6,176.5 974.3,185.4 982.0,183.2"/>
<text x="413.4" y="183.2" text-anchor="middle" font-size="12" fill="#b3261e">fiebre "en escalera"</text>
<text x="658.8" y="109.7" text-anchor="middle" font-size="12" fill="#b3261e">meseta de 39–40 °C</text>
<text x="915.9" y="138.9" text-anchor="middle" font-size="12" fill="#b3261e">lisis</text>
<rect x="16" y="206" width="146" height="78" rx="4" fill="#e7f0f8"/>
<text x="24" y="250.0" font-size="13" font-weight="700" fill="#1f5f99">Clínica</text>
<rect x="168.0" y="206" width="159.6" height="78" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="247.8" y="233.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Asintomática</text>
<text x="247.8" y="249.5" text-anchor="middle" font-size="12.8" fill="#1f2933">(bacteriemia primaria</text>
<text x="247.8" y="265.5" text-anchor="middle" font-size="12.8" fill="#1f2933">silenciosa)</text>
<rect x="331.6" y="206" width="159.6" height="78" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="411.4" y="225.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Fiebre progresiva,</text>
<text x="411.4" y="241.5" text-anchor="middle" font-size="12.8" fill="#1f2933">cefalea, malestar, tos,</text>
<text x="411.4" y="257.5" text-anchor="middle" font-size="12.8" fill="#1f2933">dolor abdominal,</text>
<text x="411.4" y="273.5" text-anchor="middle" font-size="12.8" fill="#1f2933">constipación o diarrea</text>
<rect x="495.2" y="206" width="159.6" height="78" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="575.0" y="225.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Postración, "estado</text>
<text x="575.0" y="241.5" text-anchor="middle" font-size="12.8" fill="#1f2933">tífico", roséola tífica,</text>
<text x="575.0" y="257.5" text-anchor="middle" font-size="12.8" fill="#1f2933">hepatoesplenomegalia,</text>
<text x="575.0" y="273.5" text-anchor="middle" font-size="12.8" fill="#1f2933">lengua saburral</text>
<rect x="658.8" y="206" width="159.6" height="78" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="738.6" y="225.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Persisten la fiebre</text>
<text x="738.6" y="241.5" text-anchor="middle" font-size="12.8" fill="#1f2933">y el compromiso;</text>
<text x="738.6" y="257.5" text-anchor="middle" font-size="12.8" fill="#1f2933">delirium en los</text>
<text x="738.6" y="273.5" text-anchor="middle" font-size="12.8" fill="#1f2933">casos graves</text>
<rect x="822.4" y="206" width="159.6" height="78" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="902.2" y="233.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Mejoría lenta</text>
<text x="902.2" y="249.5" text-anchor="middle" font-size="12.8" fill="#1f2933">en semanas;</text>
<text x="902.2" y="265.5" text-anchor="middle" font-size="12.8" fill="#1f2933">recaída posible</text>
<rect x="16" y="288" width="146" height="62" rx="4" fill="#e7f0f8"/>
<text x="24" y="324.0" font-size="13" font-weight="700" fill="#1f5f99">Complicaciones</text>
<rect x="168.0" y="288" width="159.6" height="62" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="247.8" y="323.5" text-anchor="middle" font-size="12.8" fill="#1f2933">—</text>
<rect x="331.6" y="288" width="159.6" height="62" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="411.4" y="323.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Raras</text>
<rect x="495.2" y="288" width="159.6" height="62" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="575.0" y="315.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Encefalopatía, hepatitis,</text>
<text x="575.0" y="331.5" text-anchor="middle" font-size="12.8" fill="#1f2933">colecistitis, shock</text>
<rect x="658.8" y="288" width="159.6" height="62" rx="4" fill="#fff5f5" stroke="#dee2e6"/>
<text x="738.6" y="307.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Hemorragia intestinal</text>
<text x="738.6" y="323.5" text-anchor="middle" font-size="12.8" font-weight="700" fill="#b3261e">y perforación ileal</text>
<text x="738.6" y="339.5" text-anchor="middle" font-size="12.8" fill="#1f2933">(máximo riesgo)</text>
<rect x="822.4" y="288" width="159.6" height="62" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="902.2" y="307.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Portación crónica</text>
<text x="902.2" y="323.5" text-anchor="middle" font-size="12.8" fill="#1f2933">(1–5 %), en la</text>
<text x="902.2" y="339.5" text-anchor="middle" font-size="12.8" fill="#1f2933">vesícula con litiasis</text>
<text x="20" y="376" font-size="14" font-weight="700" fill="#1f2933">Rendimiento de los exámenes (mayor grosor = mayor rendimiento)</text>
<text x="24" y="393" font-size="13" font-weight="700" fill="#1f5f99">Hemocultivo</text>
<rect x="333.6" y="379.7" width="155.6" height="16.7" rx="8.3" fill="#1f5f99" opacity="0.85"/>
<rect x="497.2" y="382.2" width="155.6" height="11.7" rx="5.8" fill="#1f5f99" opacity="0.85"/>
<rect x="660.8" y="384.7" width="155.6" height="6.7" rx="3.3" fill="#1f5f99" opacity="0.85"/>
<rect x="824.4" y="386.3" width="155.6" height="3.3" rx="1.7" fill="#1f5f99" opacity="0.85"/>
<text x="333.6" y="412" font-size="11.8" fill="#495057">40–80 %; cae tras la 1.ª semana y con antibióticos</text>
<text x="24" y="437" font-size="13" font-weight="700" fill="#6741d9">Mielocultivo</text>
<rect x="333.6" y="423.7" width="155.6" height="16.7" rx="8.3" fill="#6741d9" opacity="0.85"/>
<rect x="497.2" y="423.7" width="155.6" height="16.7" rx="8.3" fill="#6741d9" opacity="0.85"/>
<rect x="660.8" y="424.5" width="155.6" height="15.0" rx="7.5" fill="#6741d9" opacity="0.85"/>
<rect x="824.4" y="425.3" width="155.6" height="13.3" rx="6.7" fill="#6741d9" opacity="0.85"/>
<text x="333.6" y="456" font-size="11.8" fill="#495057">estándar de oro; se mantiene positivo</text>
<text x="24" y="481" font-size="13" font-weight="700" fill="#a0522d">Coprocultivo</text>
<rect x="333.6" y="473.5" width="155.6" height="5.0" rx="2.5" fill="#a0522d" opacity="0.85"/>
<rect x="497.2" y="471.0" width="155.6" height="10.0" rx="5.0" fill="#a0522d" opacity="0.85"/>
<rect x="660.8" y="470.2" width="155.6" height="11.7" rx="5.8" fill="#a0522d" opacity="0.85"/>
<rect x="824.4" y="471.8" width="155.6" height="8.3" rx="4.2" fill="#a0522d" opacity="0.85"/>
<text x="333.6" y="500" font-size="11.8" fill="#495057">30–40 %; útil también para detectar portadores</text>
<text x="24" y="525" font-size="13" font-weight="700" fill="#adb5bd">Widal (serología)</text>
<rect x="333.6" y="518.3" width="155.6" height="3.3" rx="1.7" fill="#adb5bd" opacity="0.85"/>
<rect x="497.2" y="516.7" width="155.6" height="6.7" rx="3.3" fill="#adb5bd" opacity="0.85"/>
<rect x="660.8" y="515.8" width="155.6" height="8.3" rx="4.2" fill="#adb5bd" opacity="0.85"/>
<rect x="824.4" y="515.8" width="155.6" height="8.3" rx="4.2" fill="#adb5bd" opacity="0.85"/>
<text x="333.6" y="544" font-size="11.8" fill="#495057">baja sensibilidad y especificidad: no usar para diagnosticar</text>
<text x="20" y="570" font-size="12" fill="#495057">La paratifoidea (S. Paratyphi A, B, C) tiene el mismo curso, a menudo más leve. Con tratamiento precoz, las complicaciones son raras.</text>
</svg>