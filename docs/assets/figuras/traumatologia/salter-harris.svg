<text x="18.333333333333332" y="416" font-size="12.5" fill="#495057">Epífisis arriba (beige), fisis (azul), metáfisis abajo. Rojo: trazo de fractura. Los tipos III–V tienen más riesgo de alteración del crecimiento.</text>
