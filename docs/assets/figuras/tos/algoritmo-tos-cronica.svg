<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1000" height="534" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Tos crónica del adulto (&gt; 8 semanas): enfoque por pasos</text>
<rect x="300" y="42" width="400" height="54" rx="8" fill="#e7f0f8" stroke="#1f5f99" stroke-width="1.6"/>
<text x="500.0" y="65.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">1. Historia, examen y exámenes básicos</text>
<text x="500.0" y="82.0" text-anchor="middle" font-size="13" fill="#1f2933">IECA · tabaco · Rx de tórax · espirometría con broncodilatador</text>
<line x1="500" y1="96" x2="500" y2="116" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="250" y="116" width="500" height="74" rx="8" fill="#fff5f5" stroke="#b3261e" stroke-width="1.6"/>
<text x="500.0" y="140.5" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">2. ¿Signos de alarma?</text>
<text x="500.0" y="157.5" text-anchor="middle" font-size="12.6" fill="#1f2933">Hemoptisis · baja de peso · fiebre · disnea · disfonía o disfagia</text>
<text x="500.0" y="174.5" text-anchor="middle" font-size="12.6" fill="#1f2933">Rx anormal · fumador &gt; 45 años con tos nueva o que cambia · inmunosupresión</text>
<line x1="750" y1="153" x2="800" y2="153" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="800" y="116" width="184" height="74" rx="8" fill="#ffc9c9" stroke="#b3261e" stroke-width="1.6"/>
<text x="892.0" y="140.5" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">Sí: estudiar</text>
<text x="892.0" y="157.5" text-anchor="middle" font-size="12.6" fill="#1f2933">TC de tórax, baciloscopías,</text>
<text x="892.0" y="174.5" text-anchor="middle" font-size="12.6" fill="#1f2933">broncoscopía; derivar</text>
<line x1="500" y1="190" x2="500" y2="212" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="510" y="206" font-size="12.5" font-weight="700" fill="#2f9e44">No</text>
<rect x="260" y="212" width="480" height="36" rx="8" fill="#fff9db" stroke="#e8a10c" stroke-width="1.6"/>
<text x="500.0" y="234.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">3. Eliminar irritantes: suspender el IECA y dejar de fumar</text>
<line x1="500" y1="248" x2="500" y2="268" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="500.0" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5f99">4. Tratar los rasgos tratables (prueba terapéutica)</text>
<rect x="26" y="296" width="233" height="132" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.4"/>
<rect x="26" y="296" width="233" height="28" rx="8" fill="#1f5f99"/><rect x="26" y="312" width="233" height="12" fill="#1f5f99"/>
<text x="142.5" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Asma / bronquitis eosinofílica</text>
<text x="142.5" y="344" text-anchor="middle" font-size="12.6" fill="#1f2933">Sibilancias, atopia, VEF1</text>
<text x="142.5" y="361" text-anchor="middle" font-size="12.6" fill="#1f2933">reversible, FeNO alto o</text>
<text x="142.5" y="378" text-anchor="middle" font-size="12.6" fill="#1f2933">eosinofilia</text>
<text x="142.5" y="395" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">→ corticoide inhalado</text>
<text x="142.5" y="412" text-anchor="middle" font-size="12.6" fill="#1f2933">2–4 semanas</text>
<rect x="267" y="296" width="233" height="132" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.4"/>
<rect x="267" y="296" width="233" height="28" rx="8" fill="#1f5f99"/><rect x="267" y="312" width="233" height="12" fill="#1f5f99"/>
<text x="383.5" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Vía aérea superior</text>
<text x="383.5" y="344" text-anchor="middle" font-size="12.6" fill="#1f2933">Rinorrea, goteo posnasal,</text>
<text x="383.5" y="361" text-anchor="middle" font-size="12.6" fill="#1f2933">carraspera, rinosinusitis</text>
<text x="383.5" y="378" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">→ corticoide nasal ±</text>
<text x="383.5" y="395" text-anchor="middle" font-size="12.6" fill="#1f2933">antihistamínico (rinitis</text>
<text x="383.5" y="412" text-anchor="middle" font-size="12.6" fill="#1f2933">alérgica) o lavado nasal</text>
<rect x="508" y="296" width="233" height="132" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.4"/>
<rect x="508" y="296" width="233" height="28" rx="8" fill="#1f5f99"/><rect x="508" y="312" width="233" height="12" fill="#1f5f99"/>
<text x="624.5" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Reflujo</text>
<text x="624.5" y="344" text-anchor="middle" font-size="12.6" fill="#1f2933">Pirosis, regurgitación,</text>
<text x="624.5" y="361" text-anchor="middle" font-size="12.6" fill="#1f2933">tos al comer o al hablar</text>
<text x="624.5" y="378" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">→ medidas e IBP solo si</text>
<text x="624.5" y="395" text-anchor="middle" font-size="12.6" fill="#1f2933">hay síntomas o reflujo</text>
<text x="624.5" y="412" text-anchor="middle" font-size="12.6" fill="#1f2933">demostrado</text>
<rect x="749" y="296" width="233" height="132" rx="8" fill="#ffffff" stroke="#1f5f99" stroke-width="1.4"/>
<rect x="749" y="296" width="233" height="28" rx="8" fill="#1f5f99"/><rect x="749" y="312" width="233" height="12" fill="#1f5f99"/>
<text x="865.5" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Bronquitis crónica / otras</text>
<text x="865.5" y="344" text-anchor="middle" font-size="12.6" fill="#1f2933">Fumador con expectoración,</text>
<text x="865.5" y="361" text-anchor="middle" font-size="12.6" fill="#1f2933">bronquiectasias, TBC,</text>
<text x="865.5" y="378" text-anchor="middle" font-size="12.6" fill="#1f2933">coqueluche, ICC,</text>
<text x="865.5" y="395" text-anchor="middle" font-size="12.6" fill="#1f2933">fármacos (IECA)</text>
<text x="865.5" y="412" text-anchor="middle" font-size="12.6" font-weight="700" fill="#1f2933">→ tratar la causa</text>
<line x1="500" y1="428" x2="500" y2="448" stroke="#495057" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="512" y="443" font-size="12.5" font-weight="700" fill="#b3261e">Persiste pese a tratar todo</text>
<rect x="150" y="448" width="700" height="74" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6"/>
<text x="500.0" y="472.5" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1f2933">5. Tos crónica refractaria o inexplicada (hipersensibilidad tusígena)</text>
<text x="500.0" y="489.5" text-anchor="middle" font-size="12.8" fill="#1f2933">Terapia fonoaudiológica de supresión de la tos · gabapentina o pregabalina</text>
<text x="500.0" y="506.5" text-anchor="middle" font-size="12.8" fill="#1f2933">morfina de liberación prolongada en dosis bajas · antagonistas P2X3 donde estén disponibles</text>
</svg>