<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 646" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker></defs>
<rect width="1000" height="646" fill="#ffffff"/>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Enfoque del temblor: ¿cuándo aparece?</text>
<rect x="340" y="46" width="320" height="71" rx="8" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.5"/>
<text x="500.0" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5f99">Temblor: observar en 3 situaciones</text>
<text x="500.0" y="85" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">reposo (manos en el regazo) · postura (brazos</text>
<text x="500.0" y="102" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">extendidos) · acción (dedo-nariz, espiral, escribir)</text>
<line x1="500" y1="117" x2="170" y2="149" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="151" width="300" height="71" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.5"/>
<text x="170.0" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#b3261e">En REPOSO</text>
<text x="170.0" y="190" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">desaparece al moverse;</text>
<text x="170.0" y="207" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">4–6 Hz, asimétrico</text>
<line x1="500" y1="117" x2="500" y2="149" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="350" y="151" width="300" height="71" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.5"/>
<text x="500.0" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#c28a12">POSTURAL y de ACCIÓN</text>
<text x="500.0" y="190" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">al mantener una postura</text>
<text x="500.0" y="207" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">o al usar las manos</text>
<line x1="500" y1="117" x2="830" y2="149" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="680" y="151" width="300" height="71" rx="8" fill="#efeafa" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="830.0" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#7c5cc4">De INTENCIÓN</text>
<text x="830.0" y="190" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">aumenta al acercarse</text>
<text x="830.0" y="207" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">al objetivo (dedo-nariz)</text>
<rect x="20" y="246" width="300" height="71" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.5"/>
<text x="170.0" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#b3261e">¿Bradicinesia (y rigidez)?</text>
<text x="170.0" y="285" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">golpeteo de dedos que se enlentece</text>
<text x="170.0" y="302" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">y pierde amplitud</text>
<line x1="170" y1="230" x2="170" y2="244" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="170" y1="317" x2="170" y2="341" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="343" width="300" height="105" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.5"/>
<text x="170.0" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#b3261e">Parkinsonismo</text>
<text x="170.0" y="382" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Enfermedad de Parkinson (lo más frecuente)</text>
<text x="170.0" y="399" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Fármacos: antipsicóticos, metoclopramida,</text>
<text x="170.0" y="416" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">flunarizina, cinarizina, valproato</text>
<text x="170.0" y="433" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Atípicos: banderas rojas (ver tabla)</text>
<rect x="20" y="462" width="300" height="71" rx="8" fill="#f5f7fa" stroke="#52606d" stroke-width="1.5"/>
<text x="170.0" y="484" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Si no hay bradicinesia:</text>
<text x="170.0" y="501" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">temblor distónico, temblor de Holmes</text>
<text x="170.0" y="518" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">(lesión del mesencéfalo), funcional</text>
<rect x="350" y="246" width="300" height="54" rx="8" fill="#ffffff" stroke="#c28a12" stroke-width="1.5"/>
<text x="500.0" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#c28a12">1.° Descartar temblor fisiológico</text>
<text x="500.0" y="285" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">exacerbado (simétrico, fino, rápido)</text>
<line x1="500" y1="230" x2="500" y2="244" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="350" y="310" width="300" height="105" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.5"/>
<text x="500.0" y="332" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Hipertiroidismo (TSH) · hipoglicemia</text>
<text x="500.0" y="349" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">cafeína · ansiedad · abstinencia de alcohol</text>
<text x="500.0" y="366" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">o benzodiacepinas · fármacos: β-agonistas,</text>
<text x="500.0" y="383" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">litio, valproato, amiodarona, ISRS,</text>
<text x="500.0" y="400" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">teofilina, corticoides, tacrolimus</text>
<line x1="500" y1="415" x2="500" y2="437" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="350" y="439" width="300" height="88" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.5"/>
<text x="500.0" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#c28a12">Temblor esencial</text>
<text x="500.0" y="478" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">bilateral en ambas manos, ≥ 3 años;</text>
<text x="500.0" y="495" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">a veces cabeza o voz; antecedente familiar;</text>
<text x="500.0" y="512" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">mejora con alcohol; sin otros signos</text>
<rect x="680" y="246" width="300" height="71" rx="8" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="830.0" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#7c5cc4">Lesión cerebelosa o de sus vías</text>
<text x="830.0" y="285" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">+ dismetría, ataxia de marcha,</text>
<text x="830.0" y="302" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">nistagmo, disartria</text>
<line x1="830" y1="230" x2="830" y2="244" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="830" y1="317" x2="830" y2="341" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="680" y="343" width="300" height="88" rx="8" fill="#efeafa" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="830.0" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#7c5cc4">Causas</text>
<text x="830.0" y="382" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">ACV o tumor de fosa posterior · esclerosis</text>
<text x="830.0" y="399" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">múltiple · alcohol · fármacos (fenitoína,</text>
<text x="830.0" y="416" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">litio) · déficit de B1 o B12 · paraneoplásico</text>
<rect x="680" y="445" width="300" height="54" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.5"/>
<text x="830.0" y="467" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">Inicio agudo con déficit focal:</text>
<text x="830.0" y="484" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2933">neuroimagen urgente (ACV de fosa posterior)</text>
<rect x="20" y="548" width="960" height="70" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="34" y="570" font-size="13" fill="#1f2933"><tspan font-weight="700">Temblor funcional</tspan>: inicio brusco, variable, se distrae o se "contagia" del ritmo de la otra mano (arrastre). Diagnóstico por signos positivos, no de exclusión.</text>
<text x="34" y="590" font-size="13" fill="#1f2933"><tspan font-weight="700">Asterixis</tspan> (no es temblor): caída intermitente de las manos extendidas por pérdida breve del tono, en la encefalopatía hepática,</text>
<text x="34" y="608" font-size="13" fill="#1f2933">urémica o hipercápnica. Ver encefalopatías tóxico-metabólicas.</text>
<text x="980" y="638" text-anchor="end" font-size="11.5" fill="#7b8794">Esquema propio basado en la clasificación de los temblores de la MDS (Bhatia 2018) y los criterios de la MDS para la enfermedad de Parkinson (Postuma 2015).</text>
</svg>