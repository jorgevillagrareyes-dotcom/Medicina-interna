<text x="100.0" y="142.0" font-size="12" fill="#1f2933">COHb inicial 30 %</text>
<line x1="670" y1="110" x2="704" y2="110" stroke="#9aa5b1" stroke-width="4"/>
<text x="714" y="115" font-size="13.5" font-weight="700" fill="#9aa5b1">Aire ambiente</text>
<text x="714" y="132" font-size="12.5" fill="#1f2933">t½ ≈ 320 min (~5 h)</text>
<line x1="670" y1="188" x2="704" y2="188" stroke="#1f5f99" stroke-width="4"/>
<text x="714" y="193" font-size="13.5" font-weight="700" fill="#1f5f99">O2 100 % normobárico</text>
<text x="714" y="210" font-size="12" fill="#52606d">(mascarilla con reservorio)</text>
<text x="714" y="227" font-size="12.5" fill="#1f2933">t½ ≈ 80 min</text>
<line x1="670" y1="266" x2="704" y2="266" stroke="#b3261e" stroke-width="4"/>
<text x="714" y="271" font-size="13.5" font-weight="700" fill="#b3261e">O2 hiperbárico</text>
<text x="714" y="288" font-size="12" fill="#52606d">(2–3 ATA)</text>
<text x="714" y="305" font-size="12.5" fill="#1f2933">t½ ≈ 23 min</text>
<text x="670" y="360" font-size="12.5" fill="#1f2933">El nivel de COHb <tspan font-weight="700">no predice</tspan> la gravedad</text>
<text x="670" y="377" font-size="12.5" fill="#1f2933">ni las secuelas: baja con el tiempo y el</text>
<text x="670" y="394" font-size="12.5" fill="#1f2933">oxígeno del traslado. El O2 al 100 % se</text>
<text x="670" y="411" font-size="12.5" fill="#1f2933">inicia <tspan font-weight="700">antes</tspan> de tener el resultado.</text>
<text x="20" y="460" font-size="11.5" fill="#52606d">Esquema propio: curvas exponenciales calculadas con las vidas medias aproximadas citadas por Poblete et al. (Rev Chil Med Intensiva 2005).</text>
<text x="20" y="476" font-size="11.5" fill="#52606d">Valores ilustrativos: la vida media real varía entre pacientes y con la ventilación.</text>
