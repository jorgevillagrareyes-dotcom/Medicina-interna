<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<text x="500.0" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Obesidad: del IMC al diagnóstico y a la intensidad del tratamiento</text>
<text x="290" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5f99">1. Diagnóstico (ADA 2026 y Comisión Lancet 2025)</text>
<rect x="90" y="74" width="400" height="50" rx="8" fill="#eef2f6" stroke="#52606d" stroke-width="1.6"/>
<text x="290.0" y="95.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Tamizaje: IMC al menos una vez al año</text>
<text x="290.0" y="112.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2933">IMC = peso (kg) / talla² (m²)</text>
<line x1="290" y1="124" x2="290" y2="142" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="142" width="500" height="98" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="290.0" y="162.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">¿Exceso de adiposidad?</text>
<text x="290.0" y="179.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">IMC ≥ 30, o bien</text>
<text x="290.0" y="195.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">IMC ≥ 25 + cintura ≥ 102 cm (hombre) o ≥ 88 cm (mujer),</text>
<text x="290.0" y="212.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">o IMC ≥ 25 + índice cintura/talla ≥ 0,5</text>
<text x="290.0" y="228.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">(con IMC &gt; 40 se asume sin otras medidas)</text>
<line x1="120" y1="240" x2="120" y2="272" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="130" y="261" font-size="12.5" font-weight="700" fill="#52606d" text-anchor="start">No: IMC 25–29,9</text>
<line x1="420" y1="240" x2="420" y2="272" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="430" y="262" font-size="12.5" font-weight="700" fill="#52606d" text-anchor="start">Sí</text>
<rect x="20" y="272" width="200" height="88" rx="8" fill="#eef2f6" stroke="#52606d" stroke-width="1.6"/>
<text x="120.0" y="295.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">SOBREPESO</text>
<text x="120.0" y="312.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">sin adiposidad central</text>
<text x="120.0" y="328.8" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Estilo de vida,</text>
<text x="120.0" y="345.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">control anual del peso</text>
<rect x="250" y="272" width="290" height="88" rx="8" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.6"/>
<text x="395.0" y="295.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">OBESIDAD</text>
<text x="395.0" y="312.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Evaluación integral: causas,</text>
<text x="395.0" y="328.8" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">fármacos que suben de peso,</text>
<text x="395.0" y="345.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">complicaciones, etapa (EOSS)</text>
<line x1="395" y1="360" x2="395" y2="382" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="210" y="382" width="370" height="70" rx="8" fill="#fff4d6" stroke="#c28a12" stroke-width="1.6"/>
<text x="395.0" y="405.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">¿Disfunción de un órgano o limitación de las</text>
<text x="395.0" y="421.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">actividades diarias causada por la obesidad?</text>
<text x="395.0" y="438.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">(18 criterios: apnea, IC-FEp, HTA, MASLD, gonartrosis…)</text>
<line x1="290" y1="452" x2="200" y2="486" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="232" y="474" font-size="12.5" font-weight="700" fill="#52606d" text-anchor="end">No</text>
<line x1="500" y1="452" x2="500" y2="486" stroke="#52606d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="510" y="474" font-size="12.5" font-weight="700" fill="#52606d" text-anchor="start">Sí</text>
<rect x="40" y="486" width="250" height="96" rx="8" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="165.0" y="505.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">OBESIDAD PRECLÍNICA</text>
<text x="165.0" y="522.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Función orgánica conservada</text>
<text x="165.0" y="538.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Consejería, seguimiento,</text>
<text x="165.0" y="555.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">prevenir la progresión</text>
<text x="165.0" y="571.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">(fármacos si el riesgo es alto)</text>
<rect x="330" y="486" width="250" height="96" rx="8" fill="#fde7e5" stroke="#b3261e" stroke-width="1.6"/>
<text x="455.0" y="505.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">OBESIDAD CLÍNICA</text>
<text x="455.0" y="522.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Enfermedad crónica activa</text>
<text x="455.0" y="538.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">Tratamiento oportuno para</text>
<text x="455.0" y="555.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">mejorar o remitir la disfunción</text>
<text x="455.0" y="571.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2933">(fármacos, cirugía)</text>
<line x1="600" y1="50" x2="600" y2="590" stroke="#cbd2d9" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="790" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5f99">2. Intensidad del tratamiento</text>
<text x="670" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">IMC</text>
<text x="759.0" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Estilo de vida</text>
<text x="844.0" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Fármacos</text>
<text x="934.0" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Cirugía</text>
<rect x="620" y="108" width="96" height="62" rx="6" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="668" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">25–26,9</text>
<rect x="720" y="108" width="78" height="62" rx="6" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="759.0" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Sí</text>
<rect x="800" y="108" width="88" height="62" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4"/>
<text x="844.0" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">—</text>
<rect x="890" y="108" width="88" height="62" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4"/>
<text x="934.0" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">—</text>
<rect x="620" y="178" width="96" height="62" rx="6" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="668" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">27–29,9</text>
<rect x="720" y="178" width="78" height="62" rx="6" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="759.0" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Sí</text>
<rect x="800" y="178" width="88" height="62" rx="6" fill="#fff4d6" stroke="#c28a12" stroke-width="1.4"/>
<text x="844.0" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Con</text>
<text x="844.0" y="223" text-anchor="middle" font-size="11.5" fill="#1f2933">comorbilidad</text>
<rect x="890" y="178" width="88" height="62" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4"/>
<text x="934.0" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">—</text>
<rect x="620" y="248" width="96" height="62" rx="6" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="668" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">30–34,9</text>
<rect x="720" y="248" width="78" height="62" rx="6" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="759.0" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Sí</text>
<rect x="800" y="248" width="88" height="62" rx="6" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.4"/>
<text x="844.0" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Sí</text>
<rect x="890" y="248" width="88" height="62" rx="6" fill="#fff4d6" stroke="#c28a12" stroke-width="1.4"/>
<text x="934.0" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Con</text>
<text x="934.0" y="293" text-anchor="middle" font-size="11.5" fill="#1f2933">enf. metabólica</text>
<rect x="620" y="318" width="96" height="62" rx="6" fill="#f5f7fa" stroke="#cbd2d9"/>
<text x="668" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">≥ 35</text>
<rect x="720" y="318" width="78" height="62" rx="6" fill="#e3f5ea" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="759.0" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Sí</text>
<rect x="800" y="318" width="88" height="62" rx="6" fill="#e3f2fd" stroke="#1f5f99" stroke-width="1.4"/>
<text x="844.0" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Sí</text>
<rect x="890" y="318" width="88" height="62" rx="6" fill="#fde7e5" stroke="#b3261e" stroke-width="1.4"/>
<text x="934.0" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Sí</text>
<text x="620" y="408" font-size="12.5" fill="#1f2933" font-weight="400">Estilo de vida: déficit de 500–750 kcal/día,</text>
<text x="620" y="426" font-size="12.5" fill="#1f2933" font-weight="400">150–300 min/semana de ejercicio + fuerza,</text>
<text x="620" y="444" font-size="12.5" fill="#1f2933" font-weight="400">terapia conductual. Meta: bajar ≥ 5–10 %.</text>
<text x="620" y="462" font-size="12.5" fill="#1f2933" font-weight="400">Fármacos: semaglutida, tirzepatida, liraglutida,</text>
<text x="620" y="480" font-size="12.5" fill="#1f2933" font-weight="400">naltrexona-bupropión, orlistat.</text>
<text x="620" y="498" font-size="12.5" fill="#1f2933" font-weight="400">Cirugía: IFSO/ASMBS 2022. FONASA (PAD):</text>
<text x="620" y="516" font-size="12.5" fill="#1f2933" font-weight="400">18–65 años con IMC ≥ 40, 35–39,9 con</text>
<text x="620" y="534" font-size="12.5" fill="#1f2933" font-weight="400">comorbilidad o 30–34,9 con DM2 de difícil manejo.</text>
<text x="620" y="552" font-size="12.5" fill="#1f2933" font-weight="400">En asiáticos, umbrales menores (IMC ≥ 27,5).</text>
<text x="980" y="622" text-anchor="end" font-size="11.5" fill="#7b8794">Esquema propio basado en ADA Standards of Care in Overweight and Obesity 2026, Comisión Lancet Diabetes &amp; Endocrinology 2025 (Rubino) e IFSO/ASMBS 2022.</text>
</svg>